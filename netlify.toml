[build]
  publish = "."
  command = ""

# Güvenlik başlıkları (yalnızca Netlify'da uygulanır; sayfadaki <meta> CSP yedektir)
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://laopdoxuxvcwgcjghdim.supabase.co wss://laopdoxuxvcwgcjghdim.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
