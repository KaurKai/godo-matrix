  const overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  overlay.innerHTML = productEditHtml();
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay){ prodEditing=null; overlay.remove(); } });
  attachProductEditHandlers(overlay);
}
function productEditHtml(){
  const p = prodEditing;
  return `<div class="modal-box">
    <h2>${p.id ? 'Ürün Düzenle' : 'Yeni Ürün'}</h2>
    <div class="field mono"><label>Ürün Kodu</label><input id="pr-code" value="${escapeAttr(p.code)}"></div>
    <div class="field"><label>Açıklama</label><input id="pr-desc" value="${escapeAttr(p.desc)}"></div>
    <div class="field"><label>Varsayılan Teslim Süresi</label><input id="pr-delivery" value="${escapeAttr(p.delivery)}" placeholder="Stoktan / 6 hafta"></div>
    <div class="field"><label>Kategori</label><input id="pr-category" value="${escapeAttr(p.category||'')}" placeholder="ör. PLC, Sürücü, HMI"></div>
    <div class="field"><label>Tedarikçi</label>
      <select id="pr-supplier"><option value="">— Seçilmedi —</option>${suppliers.map(sp=>`<option value="${sp.id}" ${p.supplierId===sp.id?'selected':''}>${escapeHtml(sp.name)}</option>`).join('')}</select>
    </div>
    <div class="grid3">
      <div class="field mono"><label>Liste Fiyatı</label><input id="pr-list" type="number" step="0.01" value="${p.listPrice}"></div>
      <div class="field mono"><label>Alış İskonto %</label><input id="pr-buydisc" type="number" step="0.1" value="${p.buyDiscount||''}"></div>
      <div class="field mono"><label>Varsayılan Satış İskonto %</label><input id="pr-disc" type="number" step="0.1" value="${p.discount}"></div>
    </div>
    <div class="actions-row" style="margin-top:6px;">
      <button class="btn btn-primary" id="pr-save">Kaydet</button>
      <button class="btn btn-ghost" id="pr-cancel">Vazgeç</button>
    </div>
  </div>`;
}
function attachProductEditHandlers(overlay){
  const p = prodEditing;
  overlay.querySelector('#pr-code').oninput = e=>p.code=e.target.value;
  overlay.querySelector('#pr-desc').oninput = e=>p.desc=e.target.value;
  overlay.querySelector('#pr-delivery').oninput = e=>p.delivery=e.target.value;
  overlay.querySelector('#pr-category').oninput = e=>p.category=e.target.value;
  overlay.querySelector('#pr-supplier').onchange = e=>p.supplierId=e.target.value;
  overlay.querySelector('#pr-list').oninput = e=>p.listPrice=e.target.value;
  overlay.querySelector('#pr-buydisc').oninput = e=>p.buyDiscount=e.target.value;
  overlay.querySelector('#pr-disc').oninput = e=>p.discount=e.target.value;
  overlay.querySelector('#pr-cancel').onclick = ()=>{ prodEditing=null; overlay.remove(); };
  overlay.querySelector('#pr-save').onclick = ()=>{
    if(!p.code.trim() && !p.desc.trim()){ alert('Ürün kodu veya açıklaması gerekli.'); return; }
    if(!p.id) p.id = crypto.randomUUID();
    const idx = products.findIndex(x=>x.id===p.id);
    if(idx>=0) products[idx]=p; else products.push(p);
    saveProducts();
    prodEditing=null;
    overlay.remove();
    render();
  };
}

/* ---------------- QUICK SEARCH (⌘K) ---------------- */
function openQuickSearch(){
  const old = document.getElementById('quickSearchOverlay'); if(old){ old.remove(); return; }
  const overlay = document.createElement('div');
  overlay.id='quickSearchOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding-top:12vh;';
  overlay.innerHTML = `
    <div style="background:#fff;width:560px;max-width:90vw;border-radius:8px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);">
      <input id="qsInput" placeholder="Cari, ürün veya teklif ara..." style="width:100%;border:none;padding:16px 18px;font-size:15px;font-family:var(--font-sans);outline:none;border-bottom:1px solid var(--hairline);box-sizing:border-box;">
      <div id="qsResults" style="max-height:360px;overflow-y:auto;"></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });
  const input = document.getElementById('qsInput');
  input.focus();
  input.oninput = ()=>renderQuickSearchResults(input.value);
  renderQuickSearchResults('');
}
function renderQuickSearchResults(query){
  const results = document.getElementById('qsResults');
  if(!results) return;
  const q = query.trim().toLowerCase();
  if(!q){ results.innerHTML = '<div style="padding:20px 18px;font-size:12.5px;color:var(--gray-500);">Cari adı, ürün kodu/açıklaması ya da teklif numarası yazmaya başla...</div>'; return; }

  let items = [];
  customers.filter(c=>(c.name||'').toLowerCase().includes(q)).slice(0,5).forEach(c=>items.push({type:'Cari', label:c.name, id:c.id}));
  products.filter(p=>(p.code||'').toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)).slice(0,5).forEach(p=>items.push({type:'Ürün', label:(p.code?p.code+' — ':'')+(p.desc||''), id:p.id}));
  quotesIndex.filter(qt=>(qt.quoteNo||'').toLowerCase().includes(q)||(qt.customerName||'').toLowerCase().includes(q)).slice(0,5).forEach(qt=>items.push({type:'Teklif', label:(qt.quoteNo||'')+' — '+(qt.customerName||''), id:qt.id}));

  if(!items.length){ results.innerHTML = '<div style="padding:20px 18px;font-size:12.5px;color:var(--gray-500);">Sonuç bulunamadı.</div>'; return; }

  results.innerHTML = items.map(it=>`
    <div class="qs-row" data-type="${it.type}" data-id="${it.id}" style="padding:11px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--hairline);">
      <span style="font-size:13px;">${escapeHtml(it.label)}</span>
      <span style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-300);">${it.type}</span>
    </div>`).join('');
  results.querySelectorAll('.qs-row').forEach(row=>{
    row.onmouseenter = ()=>row.style.background='var(--paper-2)';
    row.onmouseleave = ()=>row.style.background='';
    row.onclick = async ()=>{
      const id = row.dataset.id, type = row.dataset.type;
      const ov = document.getElementById('quickSearchOverlay'); if(ov) ov.remove();
      if(type==='Cari'){ selectedCustomerId=id; activeTab='customerDetail'; render(); }
      else if(type==='Ürün'){ prodEditing = JSON.parse(JSON.stringify(products.find(p=>p.id===id))); openProductEditModal(); }
      else if(type==='Teklif'){ await openQuote(id); activeTab='info'; render(); }
    };
  });
}
document.addEventListener('keydown', e=>{
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openQuickSearch(); }
  if(e.key==='Escape'){ const ov = document.getElementById('quickSearchOverlay'); if(ov) ov.remove(); }
});

/* ---------------- INIT ---------------- */
document.getElementById('btnQuickSearch').onclick = ()=>openQuickSearch();
document.getElementById('btnNewQuote').onclick = ()=>{ quote = emptyQuote(); quote.quoteNo = nextQuoteNo(); activeTab='info'; render(); };
document.getElementById('btnBackup').onclick = ()=>exportBackup();
document.getElementById('btnRestore').onclick = ()=>document.getElementById('restoreFile').click();
document.getElementById('restoreFile').onchange = e=>{ if(e.target.files[0]) importBackupFile(e.target.files[0]); e.target.value=''; };

/* ---------------- AUTH / BOOT ---------------- */
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAuthError(){
  document.getElementById('authError').style.display = 'none';
}
async function enterApp(user){
  currentUser = user;
  storageMode = 'supabase';
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = '';
  await loadAll();
}
async function boot(){
  if(!sb){
    // Supabase istemcisi yüklenemedi (CDN'e erişilemedi vb.) — yerel moda düş, giriş ekranını atla
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('app').style.display = '';
    storageMode = 'local';
    await loadAll();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){ await enterApp(session.user); return; }
  // Giriş ekranı zaten görünür durumda; buton olaylarını bağla
  document.getElementById('btnAuthSignIn').onclick = async ()=>{
    hideAuthError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ showAuthError('E-posta ve şifre gerekli.'); return; }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ showAuthError(error.message==='Invalid login credentials' ? 'E-posta veya şifre hatalı.' : error.message); return; }
    await enterApp(data.user);
  };
  document.getElementById('btnAuthSignUp').onclick = async ()=>{
    hideAuthError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ showAuthError('E-posta ve şifre gerekli.'); return; }
    if(password.length < 6){ showAuthError('Şifre en az 6 karakter olmalı.'); return; }
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error){ showAuthError(error.message); return; }
    if(data.session){ await enterApp(data.user); }
    else { document.getElementById('authHint').textContent = 'Kayıt oluşturuldu. E-postana gelen onay linkine tıkladıktan sonra "Giriş Yap" ile devam edebilirsin.'; document.getElementById('authHint').style.color = '#9be89b'; }
  };
}
document.getElementById('btnSignOut').onclick = async ()=>{
  if(sb) await sb.auth.signOut();
  location.reload();
};
boot();
</script>
