function foldTR(s){
  return String(s==null?'':s).toLocaleLowerCase('tr-TR')
    .replace(/[çğıöşüâîû]/g, m=>({'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u'}[m]))
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function foldKey(s){ return foldTR(s).replace(/[^a-z0-9]/g,''); }
function companyKey(name){
  const s = foldTR(name).replace(/(^|\s)a\.\s?s\.?(?=\s|$)/g,' ');
  const toks = s.replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(t=>t && !COMPANY_STOP.has(t));
  return toks.length ? toks.join(' ') : foldKey(name);
}
function domainOf(v){
  let s = String(v||'').trim().toLowerCase();
  if(!s) return '';
  if(s.includes('@')) s = s.split('@').pop();
  s = s.replace(/^[a-z]+:\/\//,'').replace(/^www\./,'').split(/[\/?#:\s]/)[0];
  return /^[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(s) ? s : '';
}
function usableDomain(d){ return d && !GENERIC_DOMAINS.has(d) ? d : ''; }
function cleanEmail(v){
  const s = String(v||'').trim().toLowerCase();
  return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(s) ? s : '';
}
function safeUrl(u){
  const s = String(u||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z][a-z0-9+.-]*:/i.test(s)) return '';
  return 'https://'+s.replace(/^\/+/,'');
}

function detectDelimiter(text){
  const firstLine = String(text).split(/\r?\n/).find(l=>l.trim().length) || '';
  const counts = {'\t':0, ';':0, ',':0};
  let inQ = false;
  for(const ch of firstLine){
    if(ch==='"') inQ = !inQ;
    else if(!inQ && counts[ch]!==undefined) counts[ch]++;
  }
  if(counts['\t']>0 && counts['\t']>=counts[';'] && counts['\t']>=counts[',']) return '\t';
  return (counts[';']>0 && counts[';']>=counts[',']) ? ';' : ',';   // Türkçe CSV: ondalık virgül + ayraç noktalı virgül (eşitlikte ';')
}
function parseDelimited(text, delim){
  text = String(text||'').replace(/^\uFEFF/,'');
  const rows = []; let row = [], field = '', inQ = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ field += '"'; i++; } else inQ = false; }
      else field += ch;
    } else if(ch==='"' && field===''){ inQ = true; }
    else if(ch===delim){ row.push(field); field = ''; }
    else if(ch==='\n' || ch==='\r'){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(field); field = ''; rows.push(row); row = [];
    } else field += ch;
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

function guessImportField(header){
  const k = foldKey(header);
  if(!k) return 'skip';
  for(const [re, f] of IMPORT_HEADER_RULES){ if(re.test(k)) return f; }
  return 'skip';
}
function guessImportMap(headers){
  const map = headers.map(guessImportField);
  const hasCompany = map.includes('company');
  for(let i=0;i<map.length;i++){
    if(map[i]==='unvan?') map[i] = hasCompany ? 'title' : 'company';
  }
  if(map.includes('firstName') && !map.includes('lastName') && !map.includes('contactName')){
    const i = map.indexOf('firstName'); map[i] = 'contactName';
  }
  return map;
}
function mapStageText(s){
  const k = foldKey(s);
  if(!k) return '';
  const table = [
    [/^(aday|cold|new|prospect|lead|yeni)$/, 'Aday'],
    [/^(iletisimde|approaching|contacted|outreach|attempted|unresponsive|ulasilamiyor)$/, 'İletişimde'],
    [/^(ilgili|interested|replied|engaged|warm|ilgileniyor|meeting|demo)$/, 'İlgili'],
    [/^(teklif|quoted|proposal|quote|teklifverildi)$/, 'Teklif'],
    [/^(musteri|customer|client|previousclient|won|kazanildi)$/, 'Müşteri'],
    [/^(kaybedildi|lost|notinterested|ilgilenmiyor|closedlost)$/, 'Kaybedildi'],
    [/^(aranmayacak|donotcontact|dnc|unsubscribed)$/, 'Aranmayacak']
  ];
  for(const [re, st] of table){ if(re.test(k)) return st; }
  return '';
}

function importRowToRecord(cells, map){
  const rec = {}; const tags = [];
  map.forEach((f,i)=>{
    if(!f || f==='skip') return;
    const v = String(cells[i]==null ? '' : cells[i]).trim();
    if(!v) return;
    if(f==='tags'){ tags.push(v); return; }
    if(!rec[f]) rec[f] = v;
  });
  rec.tags = tags.join(';').split(/[;,|]/).map(t=>t.trim()).filter(Boolean);
  return rec;
}

function buildImportPlan(rows, map){
  const groups = []; const byDomain = new Map(), byKey = new Map();
  let noCompany = 0;
  rows.forEach(cells=>{
    const rec = importRowToRecord(cells, map);
    const name = (rec.company||'').trim();
    if(!name){ noCompany++; return; }
    const key = companyKey(name);
    const email = cleanEmail(rec.email);
    const dom = usableDomain(domainOf(rec.website)) || usableDomain(domainOf(email));
    let g = (dom && byDomain.get(dom)) || byKey.get(key);
    if(!g){
      g = { name, key, domains:new Set(), fields:{}, stages:[], tags:new Set(), contacts:[], contactKeys:new Set() };
      groups.push(g);
    }
    if(dom){ g.domains.add(dom); if(!byDomain.has(dom)) byDomain.set(dom, g); }
    if(!byKey.has(key)) byKey.set(key, g);
    ['website','address','city','country','industry','employees','companyLinkedin','taxOffice','taxNo'].forEach(f=>{
      if(rec[f] && !g.fields[f]) g.fields[f] = rec[f];
    });
    const st = mapStageText(rec.stage); if(st) g.stages.push(st);
    rec.tags.forEach(t=>g.tags.add(t.slice(0,40)));
    const cname = rec.contactName || [rec.firstName, rec.lastName].filter(Boolean).join(' ');
    const phone = rec.phone || rec.companyPhone || '';
    if(cname || email || phone){
      const ck = email || ('n:'+foldTR(cname)+'|'+phone.replace(/\D/g,''));
      if(!g.contactKeys.has(ck)){
        g.contactKeys.add(ck);
        const ct = { id:null, name:cname||'', phone, email };
        if(rec.title) ct.title = rec.title;
        if(rec.emailStatus) ct.emailStatus = rec.emailStatus;
        if(rec.personLinkedin) ct.linkedin = rec.personLinkedin;
        g.contacts.push(ct);
      }
    }
  });
  // Mevcut cariler ile eşleştir
  const exDomain = new Map(), exKey = new Map();
  customers.forEach(c=>{
    const k = companyKey(c.name||''); if(k && !exKey.has(k)) exKey.set(k, c);
    const d = usableDomain(domainOf(c.website)); if(d && !exDomain.has(d)) exDomain.set(d, c);
    (c.contacts||[]).forEach(ct=>{ const ed = usableDomain(domainOf(ct.email)); if(ed && !exDomain.has(ed)) exDomain.set(ed, c); });
  });
  let newCompanies = 0, matched = 0, newContacts = 0;
  groups.forEach(g=>{
    let m = null;
    for(const d of g.domains){ if(exDomain.has(d)){ m = exDomain.get(d); break; } }
    if(!m) m = exKey.get(g.key) || null;
    g.match = m;
    const have = new Set(); const haveNames = new Set();
    if(m) (m.contacts||[]).forEach(ct=>{ const e = cleanEmail(ct.email); if(e) have.add(e); haveNames.add(foldTR(ct.name||'')); });
    g.newContacts = m ? g.contacts.filter(ct=> ct.email ? !have.has(ct.email) : !(ct.name && haveNames.has(foldTR(ct.name)))) : g.contacts.slice();
    const rank = ['Müşteri','Teklif','İlgili','İletişimde','Aday'];
    g.stage = rank.find(s=>g.stages.includes(s)) || g.stages.find(s=>s==='Kaybedildi'||s==='Aranmayacak') || '';
    if(m) matched++; else newCompanies++;
    newContacts += g.newContacts.length;
  });
  return { groups, rowCount: rows.length, noCompany, newCompanies, matched, newContacts };
}

async function applyImportPlan(plan, opts){
  const created = [], snapshots = {};
  let newCompanies = 0, updated = 0, newContacts = 0;
  const fillFields = ['website','address','city','country','industry','employees','taxOffice','taxNo'];
  plan.groups.forEach(g=>{
    let c = g.match ? customers.find(x=>x.id===g.match.id) : null;
    const isNew = !c;
    let before = null;
    if(c){ before = JSON.stringify(c); }
    else {
      c = emptyCustomer(); c.id = crypto.randomUUID(); c.name = upperCompanyName(g.name);
      c.stage = g.stage || opts.defaultStage || 'Aday';
      c.source = opts.source || '';
      customers.push(c); created.push(c.id); newCompanies++;
    }
    fillFields.forEach(f=>{ if(g.fields[f] && !c[f]) c[f] = g.fields[f]; });
    if(g.fields.companyLinkedin && !c.linkedin) c.linkedin = g.fields.companyLinkedin;
    if(!isNew && g.stage && !c.stage) c.stage = g.stage;
    const tags = new Set(c.tags||[]);
    g.tags.forEach(t=>tags.add(t));
    if(opts.batchTag) tags.add(opts.batchTag);
    c.tags = Array.from(tags).slice(0,12);
    if(!c.contacts) c.contacts = [];
    g.newContacts.forEach(ct=>{ c.contacts.push(Object.assign({}, ct, { id: crypto.randomUUID() })); newContacts++; });
    if(!isNew){
      if(JSON.stringify(c) !== before){
        snapshots[c.id] = JSON.parse(before);
        updated++;
      }
    }
  });
  await saveCustomers();
  lastImport = { id: crypto.randomUUID(), at: new Date().toISOString(), source: opts.source||'', created, snapshots, counts:{ newCompanies, updated, newContacts } };
  await stSet('godo:lastImport', JSON.stringify(lastImport));
  return { newCompanies, updated, newContacts };
}

async function undoLastImport(){
  if(!lastImport) return;
  const li = lastImport;
  if(!confirm(`Son içe aktarma geri alınsın mı?\n\n• ${li.created.length} yeni cari silinecek\n• ${Object.keys(li.snapshots).length} mevcut cari eski haline dönecek\n\nBu içe aktarmadan sonra o kayıtlarda yaptığın değişiklikler de kaybolur.`)) return;
  const created = new Set(li.created);
  customers = customers.filter(c=>!created.has(c.id));
  Object.values(li.snapshots).forEach(snap=>{
    const i = customers.findIndex(c=>c.id===snap.id);
    if(i>=0) customers[i] = snap;
  });
  await saveCustomers();
  lastImport = null;
  await stSet('godo:lastImport', '');
  render();
}

async function readImportFile(file){
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if(text.includes('\uFFFD')){ try{ text = new TextDecoder('windows-1254').decode(buf); }catch(e){} }
  return text;
}

      : headers.map((_,i)=>['company','address','contactName','phone','email'][i] || 'skip');

  }

  $('ci-paste').oninput = e=>{

/* ---------------- AUTH / BOOT ---------------- */
function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAuthError(){
  document.getElementById('authError').style.display = 'none';
}
/* ---------------- GİRİŞ GÜVENLİĞİ: oturum, iki adımlı doğrulama, hareketsizlik, çıkışta temizlik ---------------- */
const ACT_KEY = 'godo-last-activity', IDLE_KEY = 'godo-idle-min', LOCK_KEY = 'godo-auth-lock', REASON_KEY = 'godo-signout-reason';
let mfaFactorId = null, mfaUser = null, idleTimer = null, lastMark = 0, signingOut = false;

function authBusy(on){ ['btnAuthSignIn','btnAuthVerify'].forEach(id=>{ const b = document.getElementById(id); if(b){ b.disabled = on; b.style.opacity = on ? '.6' : '1'; } }); }
function showAuthInfo(msg){ const el = document.getElementById('authInfo'); if(el){ el.textContent = msg; el.style.display = 'block'; } }
function authLockState(){ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}'); }catch(e){ return {}; } }
function authLockRemaining(){ return Math.max(0, Math.ceil(((authLockState().until||0) - Date.now())/1000)); }
function registerAuthFailure(){
  const n = (authLockState().n||0) + 1, secs = n >= 5 ? Math.min(300, 15*Math.pow(2, n-5)) : 0;   // 5. hatadan sonra 15, 30, 60… sn (en çok 5 dk)
  try{ localStorage.setItem(LOCK_KEY, JSON.stringify({ n, until: secs ? Date.now()+secs*1000 : 0 })); }catch(e){}
}
function clearAuthFailures(){ try{ localStorage.removeItem(LOCK_KEY); }catch(e){} }
function authErrorText(error){
  const m = String((error && error.message) || '').toLowerCase(), st = error && error.status;
  if(st===429 || m.includes('rate limit') || m.includes('too many')) return 'Çok fazla deneme yapıldı. Birkaç dakika bekleyip tekrar dene.';
  if((error && error.name==='AuthRetryableFetchError') || m.includes('fetch') || m.includes('network')) return 'Sunucuya ulaşılamıyor. Bağlantını kontrol edip tekrar dene.';
  return 'E-posta veya şifre hatalı.';          // hesap var/yok bilgisini sızdırmayan tek genel mesaj
}

/* ---- Hareketsizlik: süre dolunca oturum kapanır ---- */
function idleMinutes(){ const v = parseInt(localStorage.getItem(IDLE_KEY)); return [15,30,60,120].includes(v) ? v : 30; }
function touchActivity(force){ const now = Date.now(); if(force || now - lastMark > 5000){ lastMark = now; try{ localStorage.setItem(ACT_KEY, String(now)); }catch(e){} } }
function idleExpired(){ const t = parseInt(localStorage.getItem(ACT_KEY)); return !!t && (Date.now() - t) > idleMinutes()*60000; }
function startIdleWatcher(){
  if(idleTimer) return;
  touchActivity(true);
  ['pointerdown','keydown','scroll','touchstart','mousemove'].forEach(ev=>window.addEventListener(ev, ()=>touchActivity(false), { passive:true }));
  idleTimer = setInterval(()=>{ if(idleExpired()) secureSignOut('idle'); }, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && idleExpired()) secureSignOut('idle'); });
}

/* ---- Çıkış: oturumu kapat, bu cihazdaki iş verisi kopyasını sil ---- */
function clearLocalCaches(){
  try{ Object.keys(localStorage).filter(k=>k.startsWith('godo::') || k===ACT_KEY).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}
}
async function secureSignOut(reason, opts){
  if(signingOut) return; signingOut = true; opts = opts || {};
  try{ if(!opts.skipFlush && pendingSync && pendingSync.length) await Promise.race([ retryPendingSync(), new Promise(r=>setTimeout(r, 4000)) ]); }catch(e){}
  try{ if(sb) await sb.auth.signOut(opts.global ? { scope:'global' } : undefined); }catch(e){}
  clearLocalCaches();
  if(reason){ try{ sessionStorage.setItem(REASON_KEY, reason); }catch(e){} }
  location.reload();
}
async function manualSignOut(){
  if(pendingSync && pendingSync.length){
    try{ await Promise.race([ retryPendingSync(), new Promise(r=>setTimeout(r, 4000)) ]); }catch(e){}
    if(pendingSync.length && !confirm('Sunucuya gönderilmemiş değişiklikler var. Çıkarsan bu cihazdaki kopya silinecek ve bu değişiklikler kaybolur. Yine de çıkılsın mı?')) return;
  }
  secureSignOut('', { skipFlush:true });
}

/* ---- Giriş akışı ---- */
async function proceedAfterAuth(user){
  let aal;
  try{ const r = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if(r.error) throw r.error; aal = r.data; }
  catch(e){ showAuthError('Güvenlik düzeyi doğrulanamadı. Bağlantını kontrol edip tekrar dene.'); return; }
  if(aal.nextLevel==='aal2' && aal.currentLevel!=='aal2'){ await showMfaStep(user); return; }
  await enterApp(user);
}
async function showMfaStep(user){
  let factor = null;
  try{ const { data, error } = await sb.auth.mfa.listFactors(); if(error) throw error; factor = (data.totp||[])[0]; }catch(e){}
  if(!factor){ showAuthError('İki adımlı doğrulama bilgisi alınamadı. Tekrar giriş yap.'); try{ await sb.auth.signOut(); }catch(e){} return; }
  mfaFactorId = factor.id; mfaUser = user;
  document.getElementById('authForm').style.display = 'none';
  document.getElementById('mfaForm').style.display = 'block';
  hideAuthError(); const c = document.getElementById('authCode'); c.value = ''; c.focus();
}
async function onAuthSubmit(e){
  e.preventDefault(); hideAuthError();
  if(!sb) return;
  const rem = authLockRemaining();
  if(rem > 0){ showAuthError('Çok fazla hatalı deneme. '+rem+' sn sonra tekrar dene.'); return; }
  const email = document.getElementById('authEmail').value.trim(), pw = document.getElementById('authPassword');
  if(!email || !pw.value){ showAuthError('E-posta ve şifre gerekli.'); return; }
  authBusy(true);
  let res; try{ res = await sb.auth.signInWithPassword({ email, password:pw.value }); }catch(err){ res = { error:err }; }
  authBusy(false); pw.value = '';
  if(res.error){ registerAuthFailure(); showAuthError(authErrorText(res.error)); return; }
  clearAuthFailures();
  await proceedAfterAuth(res.data.user);
}
async function onMfaSubmit(e){
  e.preventDefault(); hideAuthError();
  const rem = authLockRemaining();
  if(rem > 0){ showAuthError('Çok fazla hatalı deneme. '+rem+' sn sonra tekrar dene.'); return; }
  const input = document.getElementById('authCode'), code = input.value.replace(/\D/g,'');
  if(code.length !== 6){ showAuthError('6 haneli kodu gir.'); return; }
  authBusy(true);
  let res; try{ res = await sb.auth.mfa.challengeAndVerify({ factorId:mfaFactorId, code }); }catch(err){ res = { error:err }; }
  authBusy(false); input.value = '';
  if(res.error){ registerAuthFailure(); showAuthError('Kod hatalı ya da süresi dolmuş. Yeni kodla tekrar dene.'); return; }
  clearAuthFailures();
  await enterApp(mfaUser);
}
async function enterApp(user){
  currentUser = user;
  storageMode = 'supabase';
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = '';
  startIdleWatcher();
  const ct = document.getElementById('content'); if(ct) ct.innerHTML = '<div class="panel"><p class="hint">Veriler yükleniyor…</p></div>';
  await loadAll();
}
async function boot(){
  // Varsayılan durum "kilitli": giriş ekranı görünür, uygulama gizli. Yalnızca doğrulanmış oturum uygulamayı açar.
  document.getElementById('authForm').addEventListener('submit', onAuthSubmit);
  document.getElementById('mfaForm').addEventListener('submit', onMfaSubmit);
  document.getElementById('btnAuthBack').onclick = ()=>secureSignOut('', { skipFlush:true });
  let why = ''; try{ why = sessionStorage.getItem(REASON_KEY) || ''; sessionStorage.removeItem(REASON_KEY); }catch(e){}
  if(why==='idle') showAuthInfo('Güvenlik için, hareketsizlik nedeniyle oturum kapatıldı. Tekrar giriş yap.');
  if(why==='global') showAuthInfo('Tüm cihazlardaki oturumlar kapatıldı.');
  if(!sb){ showAuthError('Giriş servisi yüklenemedi. Bağlantını kontrol edip sayfayı yenile.'); authBusy(true); return; }
  let session = null;
  try{ const r = await sb.auth.getSession(); session = r.data && r.data.session; }catch(e){}
  if(session && session.user){
    if(idleExpired()){ await secureSignOut('idle', { skipFlush:true }); return; }
    await proceedAfterAuth(session.user);
    return;
  }
  if(navigator.onLine) clearLocalCaches();    // oturum yoksa bu cihazda iş verisi kopyası tutma
}

/* ---------------- AYARLAR · GÜVENLİK ---------------- */
let secState = { loading:true, verified:null, unverified:[], enroll:null, msg:'', ok:true, err:'' };
function renderSettingsSecurity(){
  return `<div class="panel" style="max-width:760px;"><h2>Güvenlik</h2><p class="hint">Hesap, iki adımlı doğrulama, şifre ve oturum ayarları.</p><div id="secBody"><p class="hint">Yükleniyor…</p></div></div>`;
}
async function loadSecurityState(){
  secState.loading = true;
  try{
    const { data, error } = await sb.auth.mfa.listFactors(); if(error) throw error;
    secState.verified = (data.totp||[])[0] || null;
    secState.unverified = (data.all||[]).filter(f=>f.status==='unverified');
    secState.err = '';
  }catch(e){ secState.err = e.message || 'Bilgi alınamadı'; }
  secState.loading = false; refreshSecurityBody();
}
function renderSecurityBody(){
  const u = currentUser || {}, e = secState.enroll;
  const msg = secState.msg ? `<div class="ready-note" style="margin-bottom:14px;${secState.ok?'':'border-left-color:var(--danger);'}">${escapeHtml(secState.msg)}</div>` : '';
  return `${msg}
    <div class="subhead" style="margin-top:6px;">Hesap</div>
    <p style="font-size:13px;margin:6px 0 18px;"><b>${escapeHtml(u.email||'—')}</b>${u.last_sign_in_at?` <span style="color:var(--gray-500);font-size:12px;">· son giriş ${escapeHtml(new Date(u.last_sign_in_at).toLocaleString('tr-TR'))}</span>`:''}</p>

    <div class="subhead">İki Adımlı Doğrulama (TOTP)</div>
    ${secState.err ? `<p class="hint" style="color:var(--danger);">Durum alınamadı: ${escapeHtml(secState.err)}</p>` : secState.loading ? '<p class="hint">Yükleniyor…</p>' :
      secState.verified ? `<p style="font-size:13px;margin:6px 0 10px;">✓ <b>Etkin.</b> Girişte parolana ek olarak doğrulama uygulamasındaki 6 haneli kod istenir; veritabanı da kodsuz oturumlara kapalıdır.</p>
        <button class="btn btn-ghost" id="sec-mfa-off">Devre Dışı Bırak</button>`
      : e ? `<p class="hint" style="margin-bottom:10px;">Authenticator uygulamasıyla (Google Authenticator, Microsoft Authenticator, 1Password…) QR kodu tara, çıkan 6 haneli kodu gir.</p>
        <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:12px;"><img src="${escapeAttr(e.qr)}" alt="QR" width="170" height="170" style="background:#fff;padding:6px;border-radius:4px;">
          <div><div style="font-size:11px;color:var(--gray-500);margin-bottom:4px;">QR okunmazsa bu anahtarı elle gir:</div><div class="mono" style="font-size:12px;word-break:break-all;max-width:300px;user-select:all;">${escapeHtml(e.secret)}</div>
          <div style="font-size:11px;color:var(--gray-500);margin-top:10px;max-width:300px;">Bu anahtarı güvenli bir yerde sakla: telefonu kaybedersen hesaba girmek için gerekir.</div></div></div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;"><div class="field mono" style="margin:0;width:150px;"><label>6 haneli kod</label><input id="sec-mfa-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
          <button class="btn btn-primary" id="sec-mfa-confirm">Doğrula ve Etkinleştir</button><button class="btn btn-ghost" id="sec-mfa-cancel">Vazgeç</button></div>`
      : `<p style="font-size:13px;margin:6px 0 10px;">Kapalı. Etkinleştirirsen parola tek başına yetmez; telefonundaki kod da gerekir.</p><button class="btn btn-primary" id="sec-mfa-on">Etkinleştir</button>`}

    <div class="section-div"></div>
    <div class="subhead">Şifre Değiştir</div>
    <div class="grid2"><div class="field"><label>Yeni şifre</label><input id="sec-pw1" type="password" autocomplete="new-password"></div><div class="field"><label>Yeni şifre (tekrar)</label><input id="sec-pw2" type="password" autocomplete="new-password"></div></div>
    <p class="hint" style="margin-top:-4px;">En az 12 karakter; harf ve rakam içermeli, e-postan olmamalı.</p>
    <button class="btn btn-ghost" id="sec-pw-save">Şifreyi Güncelle</button>

    <div class="section-div"></div>
    <div class="subhead">Oturum</div>
    <div class="field" style="max-width:300px;"><label>Hareketsizlikte otomatik çıkış</label>
      <select id="sec-idle">${[15,30,60,120].map(m=>`<option value="${m}" ${idleMinutes()===m?'selected':''}>${m} dakika</option>`).join('')}</select></div>
    <button class="btn btn-ghost" id="sec-signout-all">Tüm Cihazlardan Çıkış Yap</button>`;
}
function refreshSecurityBody(){
  const el = document.getElementById('secBody'); if(!el) return;
  el.innerHTML = renderSecurityBody();
  const $ = id=>document.getElementById(id), setMsg = (m,ok)=>{ secState.msg = m; secState.ok = ok; };
  if($('sec-mfa-on')) $('sec-mfa-on').onclick = async ()=>{
    for(const f of secState.unverified){ try{ await sb.auth.mfa.unenroll({ factorId:f.id }); }catch(e){} }     // yarım kalmış eski kayıtları temizle
    const { data, error } = await sb.auth.mfa.enroll({ factorType:'totp', friendlyName:'Godo Matrix '+todayStr(), issuer:'Godo Matrix' });
    if(error){ setMsg('Etkinleştirilemedi: '+error.message+' (Supabase panelinde iki adımlı doğrulama kapalı olabilir).', false); }
    else { secState.enroll = { id:data.id, qr:data.totp.qr_code, secret:data.totp.secret }; setMsg('', true); }
    refreshSecurityBody();
  };
  if($('sec-mfa-cancel')) $('sec-mfa-cancel').onclick = async ()=>{ try{ await sb.auth.mfa.unenroll({ factorId:secState.enroll.id }); }catch(e){} secState.enroll = null; setMsg('', true); await loadSecurityState(); };
  if($('sec-mfa-confirm')) $('sec-mfa-confirm').onclick = async ()=>{
    const code = $('sec-mfa-code').value.replace(/\D/g,'');
    if(code.length !== 6){ setMsg('6 haneli kodu gir.', false); refreshSecurityBody(); return; }
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId:secState.enroll.id, code });
    if(error){ setMsg('Kod hatalı ya da süresi dolmuş, yenisiyle tekrar dene.', false); refreshSecurityBody(); return; }
    secState.enroll = null; setMsg('İki adımlı doğrulama etkinleştirildi. Bir sonraki girişte kod istenecek.', true); await loadSecurityState();
  };
  if($('sec-mfa-off')) $('sec-mfa-off').onclick = async ()=>{
    if(!confirm('İki adımlı doğrulama kapatılsın mı? Hesap yalnızca parolayla korunur.')) return;
    const { error } = await sb.auth.mfa.unenroll({ factorId:secState.verified.id });
    setMsg(error ? 'Kapatılamadı: '+error.message : 'İki adımlı doğrulama kapatıldı.', !error); await loadSecurityState();
  };
  $('sec-pw-save').onclick = async ()=>{
    const p1 = $('sec-pw1').value, p2 = $('sec-pw2').value, email = ((currentUser||{}).email||'').toLowerCase();
    if(p1.length < 12 || !/[A-Za-z]/.test(p1) || !/\d/.test(p1)) setMsg('Şifre en az 12 karakter olmalı ve harf ile rakam içermeli.', false);
    else if(p1.toLowerCase().includes(email.split('@')[0]) && email) setMsg('Şifre e-postanı içermemeli.', false);
    else if(p1 !== p2) setMsg('Şifreler aynı değil.', false);
    else { const { error } = await sb.auth.updateUser({ password:p1 }); setMsg(error ? 'Şifre güncellenemedi: '+error.message : 'Şifre güncellendi.', !error); }
    refreshSecurityBody();
  };
  $('sec-idle').onchange = e=>{ try{ localStorage.setItem(IDLE_KEY, e.target.value); }catch(err){} touchActivity(true); };
  $('sec-signout-all').onclick = ()=>{ if(confirm('Bu cihaz dahil tüm cihazlardaki oturumlar kapatılsın mı?')) secureSignOut('global', { global:true }); };
}

document.getElementById('btnSignOut').onclick = manualSignOut;
boot();
</script>

</body>
</html>
