<style id="antiFrame">html{display:none !important}</style>
<script>
(function(){
  // Eski Netlify adresine gelen herkes yeni adrese taşınır (oturumlar adres bazlıdır; yeni adreste bir kez yeniden giriş gerekir).
  if(/(^|\.)netlify\.app$/i.test(location.hostname)){ location.replace('https://kaurkai.github.io/godo-matrix/'); return; }
  // Tıklama-hırsızlığı (clickjacking) koruması: sayfa bir iframe içindeyse gizli kalır ve en üst pencereye çıkar.
  if(window.top === window.self){ var s = document.getElementById('antiFrame'); if(s) s.remove(); }
  else { try{ window.top.location = window.self.location; }catch(e){} }
})();
</script>

<script src="vendor/supabase-js-2.117.3.umd.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
<style>
  :root{
    --ink:#0E0E0E;
    --paper:#F4F4F2;
    --paper-2:#E8E8E5;
    --white:#FFFFFF;
    --gray-700:#454540;
    --gray-500:#77766F;
    --gray-300:#CFCEC7;
    --hairline:#DEDDD7;
    --hairline-strong:#C6C5BD;
    --danger:#8A2E22;
    --font-display:'Orbitron', 'Inter', sans-serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:260px;flex:none;background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;
  }
  .sidebar-brand{
    padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);
  }
  .sidebar-brand .word{
    font-family:var(--font-display);font-size:21px;letter-spacing:.08em;font-weight:700;color:#fff;
  }
  .sidebar-brand .word-suffix{
    font-size:10px;letter-spacing:.14em;font-weight:600;color:var(--gray-300);
    border:1px solid rgba(255,255,255,.28);padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;
  }
  .sidebar-brand .rule{width:28px;height:2px;background:#fff;margin:10px 0 6px;}
  .sidebar-brand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-300);}
  .sidebar-new{
    margin:16px 16px 4px;padding:10px 12px;background:#fff;border:1px solid #fff;
    color:var(--ink);font-family:var(--font-sans);font-size:13px;font-weight:700;border-radius:var(--radius);
    cursor:pointer;text-align:left;letter-spacing:.01em;
  }
  .sidebar-new:hover{background:var(--paper);}
  .sidebar-nav{margin:10px 16px 8px;display:flex;flex-direction:column;gap:1px;}
  .sidebar-nav button{
    background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--paper);
    font-family:var(--font-sans);font-size:12px;font-weight:600;padding:8px 10px;border-radius:var(--radius);
    cursor:pointer;text-align:left;
  }
  .sidebar-nav button:hover{border-color:#fff;}
  .sidebar-list{flex:1;overflow-y:auto;padding:10px 8px 8px;}
  .sidebar-list::-webkit-scrollbar{width:6px;}
  .sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}
  .quote-item{
    padding:10px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;
  }
  .quote-item:hover{background:rgba(255,255,255,.07);}
  .quote-item.active{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2);}
  .quote-item .qno{font-family:var(--font-mono);font-size:11px;color:var(--gray-300);letter-spacing:.02em;}
  .quote-item .qcust{font-size:13px;margin-top:3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;}
  .quote-item .qmeta{font-size:11px;color:#8B8A82;margin-top:2px;display:flex;justify-content:space-between;}
  .sidebar-empty{padding:20px 14px;font-size:12.5px;color:#8B8A82;line-height:1.5;}
  .sidebar-footer{
    padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8B8A82;
  }

  /* ---------- MAIN ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .tabs{
    display:flex;gap:2px;padding:14px 28px 0;background:var(--paper);border-bottom:1px solid var(--hairline);
  }
  .tab{
    padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--gray-500);cursor:pointer;
    border-bottom:2px solid transparent;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font-sans);
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}
  .tab:hover{color:var(--ink);}
  .subtabs{padding:0 28px;background:var(--paper-2);border-bottom:1px solid var(--hairline);}
  .subtabs .tab{font-size:11.5px;padding:9px 14px;}
  .side-primary-nav{display:flex;flex-direction:column;gap:1px;margin:14px 16px 4px;}
  .side-primary-nav .tab{
    padding:9px 10px;font-size:11.5px;font-weight:700;color:var(--gray-300);cursor:pointer;
    border-radius:3px;text-transform:uppercase;letter-spacing:.04em;border-bottom:none;border-left:2px solid transparent;
  }
  .side-primary-nav .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .side-primary-nav .tab.active{background:rgba(255,255,255,.11);border-left-color:#fff;color:#fff;}
  .nav-badge{
    display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
    background:var(--danger);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;
    padding:0 4px;margin-left:4px;vertical-align:middle;
  }

  .subtabs-context{padding:12px 28px 0;background:var(--paper-2);font-size:11px;font-family:var(--font-mono);color:var(--gray-500);letter-spacing:.02em;}
  .content{flex:1;overflow-y:auto;}
  .content::-webkit-scrollbar{width:8px;}
  .content::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:4px;}

  .panel{max-width:920px;margin:0 auto;padding:36px 28px 80px;}
  .panel h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
  .panel .hint{font-size:12.5px;color:var(--gray-500);margin:0 0 26px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--hairline-strong);border-radius:var(--radius);
    font-family:var(--font-sans);font-size:13.5px;background:var(--white);color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:90px;line-height:1.55;}
  .field textarea.code-editor{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;background:#1a1a18;color:#d8d6cc;border-color:#1a1a18;tab-size:2;}
  .field textarea.code-editor:focus{border-color:var(--ink);}
  .field.mono input{font-family:var(--font-mono);}
  .section-div{height:1px;background:var(--hairline);margin:26px 0;}
  .subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-500);margin:0 0 14px;font-family:var(--font-display);}
  .subhead-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .link-btn{background:none;border:none;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;padding:0;text-transform:uppercase;letter-spacing:.04em;}

  /* items table */
  .items-table{width:100%;border-collapse:collapse;}
  .items-table th{
    text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);
    padding:0 8px 8px;font-weight:700;border-bottom:1px solid var(--hairline-strong);
  }
  .items-table td{padding:6px 8px;vertical-align:top;border-bottom:1px solid var(--hairline);}
  .items-table input,.items-table select{
    width:100%;border:1px solid transparent;background:transparent;padding:6px 6px;font-size:13px;
    font-family:var(--font-sans);border-radius:3px;
  }
  .items-table input:focus,.items-table select:focus{outline:none;border-color:var(--ink);background:var(--white);}
  .items-table input.mono{font-family:var(--font-mono);font-size:12.5px;}
  .items-table .num{text-align:right;}
  .col-code{width:110px;} .col-delivery{width:100px;} .col-qty{width:60px;}
  .col-list{width:80px;} .col-disc{width:70px;} .col-unit{width:90px;} .col-buyprice{width:90px;} .col-margin{width:70px;} .col-total{width:100px;}
  .row-remove{cursor:pointer;color:var(--gray-300);font-size:15px;padding:6px 4px;text-align:center;width:26px;}
  .row-remove:hover{color:var(--danger);}
  .calc-toggle{font-size:10.5px;color:var(--ink);cursor:pointer;font-weight:700;letter-spacing:.02em;user-select:none;text-decoration:underline;}
  .add-row-btn{
    margin-top:12px;padding:8px 14px;font-size:12.5px;font-weight:700;border:1px dashed var(--hairline-strong);
    background:transparent;border-radius:var(--radius);cursor:pointer;color:var(--gray-500);
  }
  .add-row-btn:hover{border-color:var(--ink);color:var(--ink);}

  .totals-box{margin-top:22px;margin-left:auto;width:290px;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--gray-500);}
  .totals-row.grand{
    border-top:1px solid var(--hairline-strong);margin-top:6px;padding-top:10px;
    font-size:16px;font-weight:700;color:var(--ink);font-family:var(--font-mono);
  }
  .vat-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gray-500);margin:10px 0 2px;}
  .vat-row input[type=checkbox]{width:auto;}
  .vat-row input[type=number]{width:52px;padding:4px 6px;font-size:12px;}

  /* buttons */
  .btn{
    padding:10px 18px;font-size:12.5px;font-weight:700;border-radius:var(--radius);cursor:pointer;
    font-family:var(--font-sans);letter-spacing:.02em;border:1px solid var(--ink);text-transform:uppercase;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:#2b2b28;}
  .btn-ghost{background:transparent;color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .actions-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;align-items:center;}

  .save-indicator{font-size:11px;color:var(--gray-300);margin-left:auto;text-transform:uppercase;letter-spacing:.04em;}
  .version-pill{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border:1px solid var(--hairline-strong);border-radius:12px;cursor:pointer;color:var(--gray-500);}
  .version-pill:hover{border-color:var(--ink);color:var(--ink);}
  .version-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tag-pill{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:10px;background:var(--paper-2);color:var(--gray-500);margin-right:5px;display:inline-block;}
  .tag-pill.hot{background:#F3E4E0;color:#8A2E22;}
  .tag-pill.warm{background:#F3EEDD;color:#8A6B22;}
  .tag-pill.cold{background:#E4E9F0;color:#2E4E8A;}

  /* ---------- PREVIEW / PRINT DOC ---------- */
  .preview-wrap{background:var(--paper-2);padding:40px 20px;min-height:100%;}
  #printArea{
    background:#fff;max-width:900px;margin:0 auto;padding:46px 46px 54px;
    box-shadow:0 6px 30px rgba(0,0,0,.10);color:var(--ink);
  }
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .doc-word{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.08em;color:var(--ink);}
  .doc-rule{width:36px;height:2px;background:var(--ink);margin:9px 0 5px;}
  .doc-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-500);}
  .doc-tagline{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-500);margin-bottom:6px;}
  .doc-meta{text-align:right;font-size:12px;color:var(--gray-500);line-height:1.7;}
  .doc-meta .qn{font-family:var(--font-mono);font-size:13px;color:var(--ink);font-weight:600;}
  .doc-title{
    font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;
    margin:34px 0 18px;color:var(--ink);border-bottom:1.5px solid var(--ink);padding-bottom:10px;
  }
  .doc-customer{
    border-bottom:1px solid var(--hairline);
    padding:0 0 18px; margin-bottom:6px;
  }
  .dc-name{font-weight:700;font-size:15px;margin-bottom:10px;}
  .dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:8px;}
  .dc-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:2px;}
  .dc-value{display:block;font-size:13px;color:var(--ink);font-weight:700;}
  .dc-address{font-size:12px;color:var(--gray-500);line-height:1.5;white-space:pre-line;}

  table.doc-items{width:100%;border-collapse:collapse;margin-top:22px;table-layout:fixed;}
  table.doc-items thead th{
    text-align:left;font-size:8.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);
    padding:0 6px 8px;border-bottom:1.5px solid var(--ink);font-weight:700;vertical-align:bottom;white-space:nowrap;
  }
  table.doc-items td{padding:9px 6px;font-size:12.5px;border-bottom:1px solid var(--hairline);vertical-align:middle;word-wrap:break-word;}
  table.doc-items td.num,table.doc-items th.num{text-align:right;font-family:var(--font-mono);}
  table.doc-items td.center,table.doc-items th.center{text-align:center;}
  table.doc-items td.pos{color:var(--ink);font-weight:700;font-size:13px;}

  .doc-totals{margin-left:auto;width:260px;margin-top:6px;}
  .doc-totals .r{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--gray-500);}
  .doc-totals .r.grand{
    border-top:1.5px solid var(--ink);margin-top:5px;padding-top:9px;font-weight:700;font-size:15px;
    color:var(--ink);font-family:var(--font-mono);
  }
  .doc-terms{margin-top:38px;}
  .doc-terms .blk{margin-bottom:18px;}
  .doc-terms .blk .h{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);font-weight:700;margin-bottom:6px;font-family:var(--font-display);}
  .doc-terms .blk .t{font-size:11.5px;line-height:1.7;color:var(--gray-500);white-space:pre-line;}
  .doc-foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--hairline);display:flex;justify-content:space-between;font-size:10px;color:var(--gray-300);letter-spacing:.03em;font-family:var(--font-mono);}

  /* ---------- PROJE TEKLİFİ (PROPOSAL) DOKÜMAN ---------- */
  .doc-cover-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin:34px 0 22px;line-height:1.25;}
  .doc-cover-table{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;padding-top:20px;border-top:1.5px solid var(--ink);}
  .doc-cover-note{margin-top:60px;font-size:10.5px;font-style:italic;color:var(--gray-300);}
  .doc-page-header{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-300);font-family:var(--font-display);padding-bottom:10px;border-bottom:1px solid var(--hairline);margin-bottom:24px;}
  .doc-sub-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-family:var(--font-display);margin:24px 0 12px;}
  .doc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:16px;padding-bottom:20px;border-bottom:1px solid var(--hairline);}
  .doc-info-block-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);font-family:var(--font-display);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--hairline-strong);}
  .doc-info-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-500);font-weight:700;margin-bottom:2px;margin-top:9px;}
  .doc-info-h:first-child{margin-top:0;}
  .doc-info-v{font-size:12.5px;color:var(--ink);}
  .doc-toc{margin-top:22px;}
  .doc-toc-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:12.5px;}
  .doc-toc-num{font-family:var(--font-mono);color:var(--gray-500);width:18px;flex:none;}
  .doc-section{margin-top:30px;}
  .doc-section-h{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin-bottom:12px;padding-bottom:7px;border-bottom:1.5px solid var(--ink);display:flex;gap:10px;align-items:baseline;}
  .doc-section-h .n{color:var(--gray-300);font-family:var(--font-mono);font-size:12px;}
  .doc-section-t{font-size:12.5px;line-height:1.55;color:var(--gray-700);}
  .doc-section-t .prose-gap{height:7px;}
  .doc-list{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--gray-700);}
  .doc-simple-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .doc-simple-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);padding:0 10px 9px;font-weight:700;border-bottom:1.5px solid var(--ink);}
  .doc-simple-table td{padding:10px;font-size:12.5px;border-bottom:1px solid var(--hairline);}
  .doc-simple-table td.pos{font-weight:700;color:var(--ink);}
  .doc-simple-table .num,.doc-simple-table th.num{text-align:right;font-family:var(--font-mono);}
  .doc-simple-table .center,.doc-simple-table th.center{text-align:center;}
  .doc-note{font-size:11px;font-style:italic;color:var(--gray-500);margin-top:12px;}
  .doc-sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:56px;}
  .doc-sig-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-family:var(--font-display);}
  .doc-sig-line{border-top:1px solid var(--hairline-strong);margin-top:46px;padding-top:8px;}
  .doc-sig-sub{font-size:10.5px;color:var(--gray-300);}
  .small-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:8px;}
  .dyn-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .dyn-row input{flex:1;padding:9px 11px;border:1px solid var(--hairline-strong);border-radius:var(--radius);font-family:var(--font-sans);font-size:13.5px;background:var(--white);color:var(--ink);}
  .dyn-row input:focus{outline:none;border-color:var(--ink);}
  .dyn-row .row-remove{flex:none;}

  .preview-toolbar{max-width:900px;margin:0 auto 18px;display:flex;justify-content:flex-end;gap:10px;}

  @media print{
    body *{visibility:hidden;}
    .preview-wrap,.preview-wrap *{visibility:visible;}
    .preview-wrap{background:#fff;padding:0;position:absolute;top:0;left:0;width:100%;}
    #printArea{box-shadow:none;max-width:100%;padding:0;margin:0;}
    .preview-toolbar, .screen-only-note{display:none!important;}
    table.doc-items tr{ page-break-inside:avoid; }
    .doc-terms{ page-break-inside:avoid; }
    .doc-terms .blk{ page-break-inside:avoid; }
    .doc-totals{ page-break-inside:avoid; }
    .doc-simple-table tr{ page-break-inside:avoid; }
    .doc-sig-grid{ page-break-inside:avoid; }
    .doc-cover-title, .doc-cover-table{ page-break-after:auto; }

      hem Supabase'e (kv_store tablosu, kullanıcıya özel RLS ile) hem de anlık bir
      yerel önbelleğe (localStorage) yazar. Ağ hatası/çevrimdışı durumda stGet
      otomatik olarak bu yerel önbelleğe düşer, senkronizasyon bekleyen yazımlar
      kuyruğa alınır ve bağlantı dönünce otomatik gönderilir.
   1) FILE  — bilgisayarda seçtiğin bir dosyaya doğrudan yazar (eski yöntem, hâlâ

   3) LOCAL — hiçbiri yoksa bu tarayıcının localStorage'ı (son çare).
   Hepsi aynı key/value arayüzünü (stGet/stSet/stDelete) kullanır, üstteki kod
   hangi modda olduğunu bilmek zorunda değildir. */

const SUPABASE_URL = 'https://laopdoxuxvcwgcjghdim.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1nISfnWk7beTCi0DDnquYA_IALD-58G';
const sb = (typeof window.supabase !== 'undefined')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, flowType:'pkce' } })
  : null;

/* ---- Okuma önbelleği: açılışta tüm veri TEK istekte çekilir, sonraki okumalar hafızadan gelir ----
   (Önceden her parça ayrı ve sırayla isteniyordu; sunucu Sidney'de olduğu için açılış ~12 sn sürüyordu.) */
const KV_TTL_MS = 5*60*1000;
const kvCache = new Map();          // anahtar → { value, at }
let kvFullAt = 0;                   // son tam yüklemenin zamanı
async function prefetchAllKV(){
  const { data, error } = await sb.from('kv_store').select('key,value').eq('user_id', currentUser.id);
  if(error) throw error;
  const now = Date.now(); kvCache.clear();
  (data||[]).forEach(r=>{ kvCache.set(r.key, { value:r.value, at:now }); try{ localStorage.setItem('godo::'+r.key, r.value); }catch(e){} });
  kvFullAt = now;
  return (data||[]).length;
}
async function sbGet(key){
  const now = Date.now(), hit = kvCache.get(key);
  if(hit && now - hit.at < KV_TTL_MS) return { key, value:hit.value, shared:false };
  if(!hit && kvFullAt && now - kvFullAt < KV_TTL_MS) return null;          // tam yüklemede yoktu → sunucuda da yok, istek atma
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('user_id', currentUser.id).eq('key', key).maybeSingle();
    if(error) throw error;
    if(data){ try{ localStorage.setItem('godo::'+key, data.value); }catch(e){} kvCache.set(key, { value:data.value, at:Date.now() }); return { key, value:data.value, shared:false }; }
    kvCache.delete(key);
    return null;
  }catch(e){
    syncFailed = true; renderStorageBanner();
    const v = localStorage.getItem('godo::'+key);
    return v!==null ? { key, value:v, shared:false } : null;
  }
}
async function sbSet(key, value){
  kvCache.set(key, { value, at:Date.now() });
  try{ localStorage.setItem('godo::'+key, value); }catch(e){}
  try{
    const { error } = await sb.from('kv_store').upsert(
      { user_id: currentUser.id, key, value },
      { onConflict: 'user_id,key' }
    );
    if(error) throw error;
    syncFailed = false;
  }catch(e){
    syncFailed = true;
    pendingSync.push({ key, value });
    renderStorageBanner();
  }
  return { key, value, shared:false };
}
async function sbDelete(key){
  kvCache.delete(key);
  try{ localStorage.removeItem('godo::'+key); }catch(e){}
  try{
    const { error } = await sb.from('kv_store').delete().eq('user_id', currentUser.id).eq('key', key);
    if(error) throw error;
  }catch(e){
    syncFailed = true;
    pendingSync.push({ key, value:null });
    renderStorageBanner();
  }
  return { key, deleted:true, shared:false };
}
async function retryPendingSync(){
  if(!pendingSync.length || !currentUser) return;
  const queue = pendingSync; pendingSync = [];
  for(const item of queue){
    if(item.value===null) await sbDelete(item.key);
    else await sbSet(item.key, item.value);
  }
  if(!pendingSync.length){ syncFailed = false; renderStorageBanner(); }
}
window.addEventListener('online', retryPendingSync);
setInterval(retryPendingSync, 20000);

let fileWriteTimer = null;
let fileNeedsReconnect = false; // true if a handle was linked previously but permission needs a click to re-grant

function idbOpen(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('godo-fs', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbGetHandle(){
  try{ const db = await idbOpen(); return await new Promise((res,rej)=>{ const tx=db.transaction('handles','readonly'); const r=tx.objectStore('handles').get('fileHandle'); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }catch(e){ return null; }
}
async function idbSetHandle(handle){
  try{ const db = await idbOpen(); return await new Promise((res,rej)=>{ const tx=db.transaction('handles','readwrite'); tx.objectStore('handles').put(handle,'fileHandle'); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }catch(e){ return false; }
}

async function readFileStoreFromHandle(handle){
  try{
    const f = await handle.getFile();
    const text = await f.text();
    return text.trim() ? JSON.parse(text) : {};
  }catch(e){ return {}; }
}
function scheduleFileWrite(){
  clearTimeout(fileWriteTimer);
  fileWriteTimer = setTimeout(writeFileStoreNow, 500);
}
let lastFileWriteAt = null;
async function writeFileStoreNow(){
  if(!fileHandle) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(fileStore));
    await w.close();
    lastFileWriteAt = Date.now();
    updateSyncStatusLabel();
  }catch(e){ /* permission may have lapsed; user will see reconnect banner on next load */ }
}
function updateSyncStatusLabel(){
  const el = document.getElementById('syncStatusLabel');
  if(!el) return;
  if(storageMode!=='file'){ el.textContent=''; return; }
  if(!lastFileWriteAt){ el.textContent='Henüz bu oturumda yerel dosyaya yazılmadı.'; return; }
  const secs = Math.floor((Date.now()-lastFileWriteAt)/1000);
  let rel;
  if(secs<10) rel='az önce';
  else if(secs<60) rel=secs+' sn önce';
  else if(secs<3600) rel=Math.floor(secs/60)+' dk önce';
  else rel=Math.floor(secs/3600)+' sa önce';
  el.textContent = '💾 Son yerel kayıt: '+rel+' · Drive senkronunu Drive simgesinden takip et';
}

    fileStore = {};
    for(const k of ['godo:company','godo:customers','godo:products','godo:quotes-index']){
      const existing = await stGetFromPreviousMode(k);

async function stGetFromPreviousMode(key){
  if(hasCloudStorage){ try{ const r = await window.storage.get(key); return r && r.value ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem('godo::'+key);
}

async function tryReconnectFile(){
  if(!fileHandle) return false;
  try{
    let perm = await fileHandle.queryPermission({ mode:'readwrite' });
    if(perm !== 'granted') perm = await fileHandle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileStore = await readFileStoreFromHandle(fileHandle);
      storageMode = 'file';
      fileNeedsReconnect = false;
      return true;
    }
  }catch(e){}
  return false;
}

async function initStorage(){
  if(storageMode==='supabase') return; // Supabase birincil kaynak — eski dosya-bağlama mantığı devre dışı
  if(!hasFileSystemAccess) return; // file:// veya desteklenmeyen tarayıcı — cloud/local moda devam
  const handle = await idbGetHandle();
  if(!handle) return;
  fileHandle = handle;
  try{
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileStore = await readFileStoreFromHandle(handle);
      storageMode = 'file';
    } else {
      fileNeedsReconnect = true; // bağlanmak için tek tık gerekiyor (kullanıcı jesti şart)
    }
  }catch(e){}
}

async function stGet(key){
  if(storageMode==='supabase'){ return await sbGet(key); }
  if(storageMode==='file'){ return fileStore[key]!==undefined ? { key, value:fileStore[key], shared:false } : null; }
  if(storageMode==='cloud'){ try{ return await window.storage.get(key); }catch(e){ return null; } }
  const v = localStorage.getItem('godo::'+key);
  return v!==null ? { key, value:v, shared:false } : null;
}
async function stSet(key, value){
  if(storageMode==='supabase'){ return await sbSet(key, value); }
  if(storageMode==='file'){ fileStore[key]=value; scheduleFileWrite(); return { key, value, shared:false }; }
  if(storageMode==='cloud'){ try{ return await window.storage.set(key, value); }catch(e){ return null; } }
  try{ localStorage.setItem('godo::'+key, value); return { key, value, shared:false }; }catch(e){ return null; }
}
async function stDelete(key){
  if(storageMode==='supabase'){ return await sbDelete(key); }
  if(storageMode==='file'){ delete fileStore[key]; scheduleFileWrite(); return { key, deleted:true, shared:false }; }
  if(storageMode==='cloud'){ try{ return await window.storage.delete(key); }catch(e){ return null; } }
  localStorage.removeItem('godo::'+key);
  return { key, deleted:true, shared:false };
}

/* ---------------- CALC ---------------- */
function lineUnitPrice(item){
  if(item.useCalc){
    const lp = parseFloat(item.listPrice)||0;
    const disc = parseFloat(item.discount)||0;
    return lp * (1 - disc/100);
  }
  return parseFloat(item.unitPrice)||0;
}
function lineBuyPrice(item){
  if(item.useCalc && item.listPrice && item.buyDiscount!==''){
    const lp = parseFloat(item.listPrice)||0;
    const bd = parseFloat(item.buyDiscount)||0;
    return lp * (1 - bd/100);
  }
  return null;
}
function lineMarginPct(item){
  const sell = lineUnitPrice(item);
  const buy = lineBuyPrice(item);
  if(buy===null || !sell) return null;
  return ((sell-buy)/sell)*100;
}
function lineProfit(item){
  const buy = lineBuyPrice(item);
  if(buy===null) return null;
  return (lineUnitPrice(item)-buy) * (parseFloat(item.qty)||0);
}
function lineTotal(item){ return lineUnitPrice(item) * (parseFloat(item.qty)||0); }
function computeTotals(q){
  const sub = q.items.reduce((s,it)=>s+lineTotal(it),0);
  const vat = q.vatEnabled ? sub * (parseFloat(q.vatRate)||0)/100 : 0;
  const profit = q.items.reduce((s,it)=>{ const p=lineProfit(it); return s+(p===null?0:p); },0);
  return { sub, vat, grand: sub+vat, profit };
}
const VAT_NOTE_TEXT = 'Fatura tarihinde KDV ilave edilerek fatura edilecektir.';
function paymentTermsWithVat(q){
  // KDV teklif toplamına eklenmediyse, ödeme planının sonuna faturalamada KDV eklenecek notu düşer
  let t = (q.terms && q.terms.payment) || '';
  if(!q.vatEnabled && qLang(q)!=='en' && !/KDV/i.test(t)) t = (t.trim() ? t.replace(/\s+$/,'') + '\n' : '') + VAT_NOTE_TEXT;
  return t;
}

const DOC_STR_PAIRS = [

  ['Vergi Dairesi / No','Tax Office / ID'], ['Yetkili / İletişim','Contact'], ['Ürün Kodu ve Açıklama','Item Code &amp; Description'],

  if(lang!=='en') return str;

const EN_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDateL(dateStr, lang){
  if(lang!=='en') return formatDate(dateStr);
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return `${d} ${EN_MONTHS[(parseInt(m,10)||1)-1]} ${y}`;
}
function fmtL(n, lang){
  if(lang==='en') return (n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return fmt(n);
}
function leadTimeL(s, lang){
  s = String(s||'');
  if(lang!=='en') return s;
  const rng = '(\\d+(?:\\s*[-–]\\s*\\d+)?)';
  const one = n => n.trim()==='1';
  return s
    .replace(new RegExp(rng+'\\s*[İi]ş\\s*[Gg]ün[üu]?','g'), (m,n)=>`${n} Business ${one(n)?'Day':'Days'}`)
    .replace(new RegExp(rng+'\\s*[Hh]afta','g'), (m,n)=>`${n} ${one(n)?'Week':'Weeks'}`)
    .replace(new RegExp(rng+'\\s*[Gg]ün(?![A-Za-zÇĞİÖŞÜçğıöşü])','g'), (m,n)=>`${n} ${one(n)?'Day':'Days'}`)
    .replace(new RegExp(rng+'\\s*[Aa]y(?![A-Za-zÇĞİÖŞÜçğıöşü])','g'), (m,n)=>`${n} ${one(n)?'Month':'Months'}`)
    .replace(/\bStokta\b/gi,'In stock').replace(/\bStoktan\b/gi,'Ex stock').replace(/\bStok\b/gi,'Ex stock');
}
function setQuoteLang(lang){
  // Dili değiştirir; değiştirilmemiş şartları karşı dildeki metne çevirir, elle düzenlenmişleri korur
  const prev = qLang(quote);
  quote.lang = lang;
  const kept = [];
  if(prev===lang) return kept;
  const labels = {payment:'Ödeme Planı', delivery:'Teslimat Koşulları', shipping:'Kargo Koşulları', legal:'Geçerlilik ve Genel Şartlar'};
  ['payment','delivery','shipping','legal'].forEach(cat=>{
    const cur = ((quote.terms||{})[cat]||'').trim();
    if(!cur) return;
    const tpl = (termTemplates[cat]||[]).find(t=>(t.text||'').trim()===cur || (t.textEN||'').trim()===cur);
    if(tpl){
      const nt = lang==='en' ? tpl.textEN : tpl.text;
      if(nt){ quote.terms[cat] = nt; } else kept.push(labels[cat]);
      return;
    }
    if(lang==='en' && cur===(defaultTerms[cat]||'').trim() && defaultTermsEN[cat]){ quote.terms[cat]=defaultTermsEN[cat]; return; }
    if(lang==='tr' && cur===(defaultTermsEN[cat]||'').trim() && defaultTerms[cat]){ quote.terms[cat]=defaultTerms[cat]; return; }
    kept.push(labels[cat]);
  });
  return kept;
}

function fmt(n){ return (n||0).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function parseTRNumber(str){
  // Excel'den yapıştırılan "1.234,56" (TR) ya da "1234.56" (US) biçimlerini güvenle sayıya çevirir.
  if(!str) return '';
  let s = String(str).trim();
  if(!s) return '';
  if(s.includes(',') && s.includes('.')){
    // Hangisi son geliyorsa ondalık ayraç odur
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? '' : String(n);
}

function validateQuoteForSend(){
  const issues = [];
  if(!quote.quoteNo || !quote.quoteNo.trim()) issues.push('Teklif numarası boş.');
  if(!quote.customer.name || !quote.customer.name.trim()) issues.push('Müşteri adı boş.');
  const validItems = quote.items.filter(it=>it.code||it.desc);
  if(!validItems.length) issues.push('Hiç ürün kalemi eklenmemiş.');
  const emptyPriceItems = validItems.filter(it=>!lineUnitPrice(it));
  if(emptyPriceItems.length) issues.push(`${emptyPriceItems.length} kalemde birim fiyat 0 veya boş.`);
  const t = computeTotals(quote);
  if(t.grand<=0) issues.push('Genel toplam 0 veya negatif.');
  return issues;
}

    { key:'finans', label:'Finans', items:[
      { tab:'invoices', label:'Faturalar', on: activeTab==='invoices' },
      { tab:'finance', label:'Alacak / Borç', on: activeTab==='finance' },
      { tab:'accounting', label:'Muhasebe', on: activeTab==='accounting' },
      { tab:'reports', label:'Raporlar', on: activeTab==='reports' } ]}
  ];
}
function renderSidebarPrimaryNav(){
  const settingsActive = isSettingsTab(activeTab);
  const settingsTarget = settingsActive ? activeTab : 'settingsCompany';
  const today = new Date().toISOString().slice(0,10);
  const dueCount = tasks.filter(t=>!t.done && t.dueDate && t.dueDate<=today).length;
  const badge = n=>n ? `<span class="nav-badge">${n}</span>` : '';
  const col = navCollapsed();
  return `
    <div class="side-primary-nav">
      <div class="tab ${activeTab==='dashboard'?'active':''}" data-tab="dashboard">Pano ${badge(dueCount)}</div>
      ${navGroups().map(g=>{
        const hasActive = g.items.some(i=>i.on), closed = !!col[g.key] && !hasActive, sum = g.items.reduce((t,i)=>t+(i.n||0),0);
        return `<div class="nav-group${closed?' closed':''}${hasActive?' has-active':''}">
          <div class="nav-group-head${hasActive?' locked':''}" data-nav-group="${g.key}"><span class="nav-group-label">${g.label}</span>${closed ? badge(sum) : ''}${hasActive ? '' : `<span class="chev">${closed?'▸':'▾'}</span>`}</div>
          ${closed ? '' : `<div class="nav-group-items">${g.items.map(i=>`<div class="tab ${i.on?'active':''}" data-tab="${i.tab}">${i.label} ${badge(i.n)}</div>`).join('')}</div>`}
        </div>`;
      }).join('')}
      <div class="tab nav-settings ${settingsActive?'active':''}" data-tab="${settingsTarget}">Ayarlar</div>
    </div>`;
}
function bindNavHandlers(){
  const w = document.getElementById('primaryNavWrap'); if(!w) return;
  w.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ activeTab = t.dataset.tab; render(); }; });
  w.querySelectorAll('[data-nav-group]').forEach(h=>{ h.onclick = ()=>{
    if(h.classList.contains('locked')) return;                        // açık sayfanın grubu kapanmaz
    setNavCollapsed(h.dataset.navGroup, !navCollapsed()[h.dataset.navGroup]);
    w.innerHTML = renderSidebarPrimaryNav(); bindNavHandlers();       // yalnız menü yenilenir, sayfa olduğu gibi kalır
  }; });
}

        <div class="tab ${activeTab==='settingsCompany'?'active':''}" data-tab="settingsCompany">Şirket Profili</div>

function renderDashProfitKPIs(data){
  const curr = (quotesIndex[0]&&quotesIndex[0].currency) || '€';
  const salesTotal = data.monthlyArr.reduce((s,m)=>s+m[1],0);
  const marginPct = salesTotal ? (data.totalProfitAll/salesTotal)*100 : 0;
  return `
    <div class="kpi-card"><div class="kpi-label">Kârlılık Oranı</div><div class="kpi-value">%${marginPct.toFixed(1)}</div><div class="kpi-sub">Siparişe Dönüştü teklifler üzerinden</div></div>
    <div class="kpi-card"><div class="kpi-label">Kârlılık Tutarı</div><div class="kpi-value">${curr} ${fmt(data.totalProfitAll)}</div><div class="kpi-sub">Alış/satış iskonto farkından</div></div>
  `;
}

  const primaryCurrency = (quotesIndex[0] && quotesIndex[0].currency) || '€';

  const statusCounts = {};
  STATUS_OPTIONS.forEach(s=>statusCounts[s]=0);

      <div class="kpi-card"><div class="kpi-label">Siparişe Dönüşen</div><div class="kpi-value">${primaryCurrency} ${fmt(wonTotal)}</div><div class="kpi-sub">Kazanılan tutar</div></div>

      <div class="kpi-card"><div class="kpi-label">Ortalama Teklif</div><div class="kpi-value">${primaryCurrency} ${fmt(avgTotal)}</div><div class="kpi-sub">${totalQuotes} tekliften</div></div>
    </div>

    <div class="kpi-grid" id="dashProfitKPIs" style="grid-template-columns:repeat(2,1fr);">

      <div class="kpi-card"><div class="kpi-label">Kârlılık Tutarı</div><div class="kpi-value">…</div><div class="kpi-sub">Hesaplanıyor</div></div>
    </div>

    <div id="readyShipWidget"></div>
    <div id="payablesWidget"></div>

    ${duePayments.length ? `
    <div class="subhead" style="margin-top:0;">Vadesi Yaklaşan / Geçen Ödemeler</div>
    <div style="margin-bottom:28px;">
      ${duePayments.map(s=>`
        <div class="dash-quote-row payment-due-row" data-id="${s.orderId}" style="padding:10px 4px;">
          <div>
            <div class="dqr-cust" style="font-size:12.5px;">${escapeHtml(s.customer.name||'İsimsiz Müşteri')}</div>
            <div class="dqr-meta">${escapeHtml(s.orderNo||'')} · Fatura: ${escapeHtml(s.invoiceNo||'—')}</div>
          </div>
          <div style="text-align:right;">
            <div class="mono" style="font-size:12px;">${s.currency||'€'} ${fmt(Math.max(0, shipTotal(s)-shipPaid(s)))}</div>
            ${dueBadgeHtml(shipDueDate(s), false)}
          </div>
        </div>`).join('')}
    </div>` : ''}

    ${dueTasks.length ? `
    <div class="subhead" style="margin-top:0;">Bugün &amp; Gecikmiş Görevler</div>
    <div style="margin-bottom:28px;">
      ${dueTasks.map(t=>`
        <div class="dash-quote-row task-due-row" data-cust="${t.customerId||''}" style="padding:10px 4px;">
          <div>
            <div class="dqr-cust" style="font-size:12.5px;">${escapeHtml(t.title)}</div>
            <div class="dqr-meta">${escapeHtml(t.customerName||'')}${t.dueDate<today?' · Gecikti':''}</div>

            <div style="text-align:right;">
              <div class="mono dqr-total">${q.currency||'€'} ${fmt(q.total)}</div>
              <div class="dqr-status status-${(q.status||'').replace(/\s/g,'')}">${q.status||'Taslak'}</div>

      </div>
    </div>
  </div>`;

function renderQuotesList(){
  let rows = quotesIndex.slice();
  if(listFilters.search){
    const s = foldTR(listFilters.search.trim());
    rows = rows.filter(q => foldTR(q.customerName||'').includes(s) || foldTR(q.quoteNo||'').includes(s));
  }
  if(listFilters.status) rows = rows.filter(q=>q.status===listFilters.status);
  if(listFilters.from) rows = rows.filter(q=>(q.date||'') >= listFilters.from);
  if(listFilters.to) rows = rows.filter(q=>(q.date||'') <= listFilters.to);
  const totalSum = rows.reduce((s,q)=>s+(q.total||0),0);
  const curr = (rows[0]&&rows[0].currency) || (quotesIndex[0]&&quotesIndex[0].currency) || '€';

  return `
  <div class="panel" style="max-width:${quotesViewMode==='kanban'?'none':'1040px'};">
    <div class="subhead-row" style="margin-bottom:4px;">
      <h2 style="margin:0;">Teklifler</h2>
      <div style="display:flex;gap:2px;">
        <button class="view-toggle-btn ${quotesViewMode==='list'?'active':''}" data-view="list">Liste</button>
        <button class="view-toggle-btn ${quotesViewMode==='kanban'?'active':''}" data-view="kanban">Kanban</button>
      </div>
    </div>
    <p class="hint">${rows.length} teklif · Toplam ${curr} ${fmt(totalSum)}</p>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;margin-bottom:20px;">
      <div class="field" style="margin:0;"><label>Ara</label><input id="lf-search" placeholder="Müşteri veya teklif no" value="${escapeAttr(listFilters.search)}"></div>
      <div class="field" style="margin:0;"><label>Durum</label><select id="lf-status" ${quotesViewMode==='kanban'?'disabled':''}><option value="">Tümü</option>${STATUS_OPTIONS.map(s=>`<option ${listFilters.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="field" style="margin:0;"><label>Başlangıç</label><input type="date" id="lf-from" value="${listFilters.from}"></div>
      <div class="field" style="margin:0;"><label>Bitiş</label><input type="date" id="lf-to" value="${listFilters.to}"></div>
    </div>
    ${quotesViewMode==='kanban' ? renderQuotesKanban(rows) : (rows.length ? rows.map(q=>`
      <div class="dash-quote-row" data-id="${q.id}">
        <div><div class="dqr-cust">${escapeHtml(upperCompanyName(q.customerName||'İsimsiz Müşteri'))}</div><div class="dqr-meta">${escapeHtml(q.quoteNo||'')} · ${escapeHtml(q.date||'')}</div></div>
        <div style="text-align:right;"><div class="mono dqr-total">${q.currency||'€'} ${fmt(q.total)}</div><div class="dqr-status status-${(q.status||'').replace(/\s/g,'')}">${q.status||''}</div></div>
      </div>`).join('') : '<p class="hint">Filtreyle eşleşen teklif yok.</p>')}
  </div>`;
}

function renderQuotesKanban(rows){
  return `
  <div class="kanban-board">
    ${STATUS_OPTIONS.map(status=>{
      const col = rows.filter(q=>q.status===status);
      const colSum = col.reduce((s,q)=>s+(q.total||0),0);
      const curr = (col[0]&&col[0].currency) || '€';
      return `
      <div class="kanban-col" data-status="${status}">
        <div class="kanban-col-head">
          <span>${status}</span>
          <span class="mono" style="color:var(--gray-300);">${col.length}</span>
        </div>
        <div class="kanban-col-sum">${curr} ${fmt(colSum)}</div>
        <div class="kanban-col-body" data-status="${status}">
          ${col.map(q=>`
            <div class="kanban-card" draggable="true" data-id="${q.id}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                <div class="kc-cust">${escapeHtml(upperCompanyName(q.customerName||'İsimsiz Müşteri'))}</div>
                <span class="kc-drag-handle" title="Sürükle">⠿</span>

              <div class="kc-meta">${escapeHtml(q.quoteNo||'')}${q.version>1?' · v'+q.version:''}</div>
              <div class="kc-total mono">${q.currency||'€'} ${fmt(q.total)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function emptyPO(){
  return { id:null, poNo:'', date:new Date().toISOString().slice(0,10), supplierId:'', status:'Taslak', currency:'€', paymentTermDays:'', lang:'tr',
           salesOrderId:'', salesOrderNo:'', salesOrderCustomer:'', notes:'', items:[] };
}
function blankPoItem(){ return { id:crypto.randomUUID(), productId:null, code:'', desc:'', qty:'1', unitCost:'', listPrice:'', buyDiscount:'', salePrice:'', saleDiscount:'', quoteItemId:'' }; }
async function savePurchaseOrders(){ await stSet('godo:purchase-orders', JSON.stringify(purchaseOrders)); }
function nextPoNo(){
  const year = new Date().getFullYear();
  let n = purchaseOrders.filter(p=>(p.poNo||'').includes('-'+year+'-')).length + 1;
  const used = new Set(purchaseOrders.map(p=>p.poNo));
  let no; do { no = `SAS-${year}-${String(n).padStart(3,'0')}`; n++; } while(used.has(no));
  return no;
}
function poTotal(po){ return (po.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.unitCost)||0),0); }
function supplierName(id){ const s = suppliers.find(x=>x.id===id); return s ? s.name : ''; }
function poCountForOrder(quoteId){ return purchaseOrders.filter(p=>p.salesOrderId===quoteId && p.status!=='İptal').length; }

// Siparişe bağlı gerçek maliyet: SAS satırındaki birim maliyet (aynı para biriminde), tahmini maliyetin yerine geçer
function actualCostForQuoteItem(quoteId, itemId, currency){
  let qty = 0, sum = 0;
  purchaseOrders.forEach(po=>{
    if(po.salesOrderId!==quoteId || po.status==='İptal' || (po.currency||'€')!==(currency||'€')) return;
    (po.items||[]).forEach(l=>{
      if(l.quoteItemId!==itemId) return;
      const q = parseFloat(l.qty)||0, c = parseFloat(l.unitCost);
      if(q>0 && !isNaN(c) && c>=0){ qty += q; sum += q*c; }
    });
  });
  return qty>0 ? sum/qty : null;
}

/* ---- Siparişten SAS oluşturma ---- */
// Fiyat yardımcıları: liste fiyatı sabitken alış iskontosu ↔ alış birim fiyatı çift yönlü (teklif ekranıyla aynı mantık)
function poCalcCost(list, bd){ const lp = parseFloat(list), d = parseFloat(bd); return (lp > 0 && !isNaN(d)) ? Math.round(lp*(1-d/100)*100)/100 : null; }
function poCalcDisc(list, cost){ const lp = parseFloat(list), c = parseFloat(cost); return (lp > 0 && !isNaN(c)) ? Math.round((1 - c/lp)*10000)/100 : null; }
function poMarginPct(sale, cost){ const s = parseFloat(sale), c = parseFloat(cost); return (s > 0 && !isNaN(c) && String(cost)!=='') ? ((s-c)/s)*100 : null; }   // satış fiyatı üzerinden, tekliftekiyle aynı
function poNum(v){ return v==null ? '' : String(v); }
// Teklif kaleminden (yoksa ürün kartından) liste fiyatı ve alış iskontosu; satış bilgisi yalnızca referans
function poPriceInfo(it, p){
  let list = '', bd = '';
  if(it.useCalc && parseFloat(it.listPrice) > 0){ list = poNum(it.listPrice); if(it.buyDiscount!=='' && it.buyDiscount!=null) bd = poNum(it.buyDiscount); }
  else if(p && parseFloat(p.listPrice) > 0){ list = poNum(p.listPrice); }
  if(list && bd==='' && p && p.buyDiscount!=='' && p.buyDiscount!=null) bd = poNum(p.buyDiscount);
  return { listPrice:list, buyDiscount:bd, salePrice:String(round2(lineUnitPrice(it))), saleDiscount: (it.useCalc && it.discount!=='' && it.discount!=null) ? poNum(it.discount) : '' };
}
async function buildPoPlanFromOrder(quoteId){
  const r = await stGet('godo:quote:'+quoteId);
  if(!r || !r.value) return null;
  let full; try{ full = JSON.parse(r.value); }catch(e){ return null; }
  const codes = productCodeMap();
  const ordered = {};
  purchaseOrders.filter(po=>po.salesOrderId===quoteId && po.status!=='İptal').forEach(po=>(po.items||[]).forEach(it=>{
    if(it.quoteItemId) ordered[it.quoteItemId] = (ordered[it.quoteItemId]||0) + (parseFloat(it.qty)||0);
  }));
  const lines = [];
  (full.items||[]).filter(it=>it.code||it.desc).forEach(it=>{
    const p = (it.productId && products.find(x=>x.id===it.productId)) || codes.get(foldTR((it.code||'').trim()));
    const remaining = (parseFloat(it.qty)||0) - (ordered[it.id]||0);
    if(remaining <= 1e-9) return;
    const info = poPriceInfo(it, p), c = (info.listPrice && info.buyDiscount!=='') ? poCalcCost(info.listPrice, info.buyDiscount) : null;
    lines.push(Object.assign({ quoteItemId:it.id, productId:p?p.id:(it.productId||null), code:it.code||'', desc:it.desc||'', qty:remaining, unitCost: c===null ? '' : String(c) }, info));
  });
  return { full, currency: full.currency||'€', lines };
}

async function enrichPoFromOrder(po){
  if(!po.salesOrderId) return false;
  const need = po.items.some(it=>it.quoteItemId && (it.salePrice===undefined || it.listPrice===undefined));
  if(!need) return false;
  const r = await stGet('godo:quote:'+po.salesOrderId); if(!(r && r.value)) return false;
  let full; try{ full = JSON.parse(r.value); }catch(e){ return false; }
  const codes = productCodeMap(); let changed = false;
  po.items.forEach(it=>{
    if(!it.quoteItemId || (it.salePrice!==undefined && it.listPrice!==undefined)) return;
    const qi = (full.items||[]).find(x=>x.id===it.quoteItemId); if(!qi) return;
    const p = (qi.productId && products.find(x=>x.id===qi.productId)) || codes.get(foldTR((qi.code||'').trim())), info = poPriceInfo(qi, p);
    it.salePrice = info.salePrice; it.saleDiscount = info.saleDiscount; it.listPrice = info.listPrice; it.buyDiscount = info.buyDiscount;
    if(it.listPrice!=='' && poNum(it.unitCost)!==''){ const d = poCalcDisc(it.listPrice, it.unitCost); if(d!==null) it.buyDiscount = String(d); }   // kayıtlı alış fiyatı esastır (pazarlık sonrası değişmiş olabilir); iskonto ona göre hesaplanır
    changed = true;
  });
  return changed;
}
function openPoEditor(id){

async function savePoEditing(){
  const po = poEditing;

  po.items = po.items.filter(it=>(it.code||'').trim() || (it.desc||'').trim());
  if(!po.id) po.id = crypto.randomUUID();
  const idx = purchaseOrders.findIndex(p=>p.id===po.id);
  if(idx>=0) purchaseOrders[idx] = po; else purchaseOrders.push(po);
  await savePurchaseOrders();
  return true;
}

/* ---------------- SEVKİYAT · FATURA · TAHSİLAT · SİPARİŞ AŞAMASI ---------------- */
let shipments = [];
let shipPrintId = null;
let orderSearch = '';
let orderFilter = '';
const PAY_STATE_LABEL = { noinvoice:'Fatura bekliyor', waiting:'Ödeme bekleniyor', partial:'Kısmi ödeme', paid:'Ödendi', overdue:'Vadesi geçti' };

async function saveShipments(){ await stSet('godo:shipments', JSON.stringify(shipments)); }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDaysStr(dateStr, n){ const d = new Date(dateStr+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diffDaysStr(a, b){ return Math.round((Date.parse(a+'T00:00:00Z') - Date.parse(b+'T00:00:00Z'))/86400000); }
function shipsOf(orderId){ return shipments.filter(s=>s.orderId===orderId); }
function nextShipmentIrsaliyeNo(){
  const year = new Date().getFullYear();
  const used = new Set(shipments.map(s=>s.irsaliyeNo).concat(quotesIndex.map(q=>q.irsaliyeNo)).filter(Boolean));
  let n = [...used].filter(x=>String(x).includes('-'+year+'-')).length + 1, no;
  do { no = `İRS-${year}-${String(n).padStart(3,'0')}`; n++; } while(used.has(no));
  return no;
}

/* ---- Tutarlar ve durum ---- */
function shipQty(s){ return (s.lines||[]).reduce((t,l)=>t+(parseFloat(l.qty)||0),0); }
function shipNet(s){ return (s.lines||[]).reduce((t,l)=>t+(parseFloat(l.qty)||0)*(parseFloat(l.unitPrice)||0),0); }
function shipIsInvoiced(s){ return !!(s.invoiceNo || s.invoiceDate); }
function shipTotal(s){ const v = shipIsInvoiced(s) ? (parseFloat(s.vatRate)||0) : 0; return shipNet(s) * (1 + v/100); }
function shipPaid(s){ return (s.payments||[]).reduce((t,p)=>t+(parseFloat(p.amount)||0),0); }
function shipDueDate(s){
  if(!shipIsInvoiced(s)) return '';
  if(s.dueDateOverride) return s.dueDateOverride;
  const t = parseInt(s.termDays);
  if(isNaN(t) || !s.invoiceDate) return '';
  return addDaysStr(s.invoiceDate, t);
}
function shipPayState(s){
  if(!shipIsInvoiced(s)) return 'noinvoice';
  const total = shipTotal(s), paid = shipPaid(s);
  if(total > 0 && paid >= total - 0.01) return 'paid';
  const due = shipDueDate(s);
  if(due && due < todayStr()) return 'overdue';
  return paid > 0 ? 'partial' : 'waiting';
}
function dueBadgeHtml(due, paid){
  if(paid) return '';
  if(!due) return '<span style="font-size:10.5px;color:var(--gray-300);">Vade tanımsız</span>';
  const d = diffDaysStr(due, todayStr());
  if(d < 0) return `<span style="font-size:10.5px;font-weight:700;color:var(--danger);">${Math.abs(d)} gün gecikti</span>`;
  if(d === 0) return `<span style="font-size:10.5px;font-weight:700;color:var(--danger);">Bugün doluyor</span>`;
  if(d <= 3) return `<span style="font-size:10.5px;font-weight:700;color:#8A6B22;">${d} gün kaldı</span>`;
  return `<span style="font-size:10.5px;color:var(--gray-500);">${d} gün kaldı</span>`;
}
function sumByCur(list, fn){ const m = {}; list.forEach(x=>{ const c = x.currency||'€'; m[c] = (m[c]||0) + fn(x); }); return m; }
function curText(m){ const parts = Object.entries(m).filter(([,v])=>Math.abs(v)>0.005).map(([c,v])=>c+' '+fmt(v)); return parts.length ? parts.join(' · ') : '—'; }

/* ---- Sipariş toplamları ve aşama ---- */
function orderQtyTotal(q){ return parseFloat(q.qtyTotal)||0; }
function orderAgg(q){
  const ships = shipsOf(q.id);
  let shippedQty = 0, invoicedQty = 0;
  const shpByItem = {};
  ships.forEach(s=>(s.lines||[]).forEach(l=>{
    const v = parseFloat(l.qty)||0; shippedQty += v; if(shipIsInvoiced(s)) invoicedQty += v;
    const k = l.quoteItemId || l.code; shpByItem[k] = (shpByItem[k]||0) + v;
  }));
  let purchased = 0, received = 0; const recvByItem = {};
  purchaseOrders.forEach(po=>{
    if(po.salesOrderId!==q.id || po.status==='İptal') return;
    (po.items||[]).forEach(it=>{
      const pq = parseFloat(it.qty)||0, rq = parseFloat(it.receivedQty)||0;
      purchased += pq; received += rq;
      if(it.quoteItemId) recvByItem[it.quoteItemId] = (recvByItem[it.quoteItemId]||0) + rq;
    });
  });
  let ready = 0; Object.keys(recvByItem).forEach(k=>{ ready += Math.max(0, recvByItem[k] - (shpByItem[k]||0)); });
  const invShips = ships.filter(shipIsInvoiced);
  const invoicedTotal = invShips.reduce((t,s)=>t+shipTotal(s),0);
  const paidTotal = invShips.reduce((t,s)=>t+shipPaid(s),0);
  const unpaidShips = invShips.filter(s=>shipPayState(s)!=='paid');
  return { N:orderQtyTotal(q), ships, shippedQty, invoicedQty, purchased, received, ready, invoicedTotal, paidTotal, unpaidShips };
}
function orderStage(q, a){
  a = a || orderAgg(q); const N = a.N;
  const eps = 1e-9;
  if(N > 0 && a.invoicedQty >= N - eps) return a.unpaidShips.length ? { key:'tahsilat', label:'Faturalandı · tahsilat bekliyor' } : { key:'tamam', label:'Tamamlandı' };
  if(N > 0 && a.shippedQty >= N - eps) return { key:'faturalanacak', label: a.invoicedQty>0 ? 'Sevk edildi · kalan fatura bekliyor' : 'Sevk edildi · fatura bekliyor' };
  if(a.shippedQty > 0){
    if(a.shippedQty - a.invoicedQty > eps) return { key:'faturalanacak', label:'Kısmen sevk edildi · fatura bekliyor' };
    return { key:'sevk', label: a.ready>0 ? 'Kısmen sevk edildi · kalan sevke hazır' : 'Kısmen sevk edildi' };
  }
  if(a.ready > 0) return { key:'hazir', label:'Sevke hazır' };
  if(a.purchased > 0) return { key:'mal', label:'Mal bekleniyor' };
  return { key:'tedarik', label:'Tedarik bekliyor' };
}
function orderMatchesFilter(q, a, f){
  if(!f) return true;
  const eps = 1e-9;
  if(f==='hazir') return a.ready > eps;
  if(f==='bekleyen') return a.ready <= eps && (a.N<=0 || a.shippedQty < a.N - eps) && ((a.purchased - a.received) > eps || a.purchased === 0);
  if(f==='faturalanacak') return a.shippedQty - a.invoicedQty > eps;
  if(f==='tahsilat') return a.unpaidShips.length > 0;
  if(f==='tamam') return a.N > 0 && a.invoicedQty >= a.N - eps && a.unpaidShips.length === 0;
  return true;
}
function readyLinesForOrder(orderId){
  const shp = {}; shipsOf(orderId).forEach(s=>(s.lines||[]).forEach(l=>{ const k = l.quoteItemId||l.code; shp[k] = (shp[k]||0) + (parseFloat(l.qty)||0); }));
  const recv = {}, info = {};
  purchaseOrders.forEach(po=>{
    if(po.salesOrderId!==orderId || po.status==='İptal') return;
    (po.items||[]).forEach(it=>{ if(!it.quoteItemId) return; recv[it.quoteItemId] = (recv[it.quoteItemId]||0) + (parseFloat(it.receivedQty)||0); info[it.quoteItemId] = { code:it.code, desc:it.desc }; });
  });
  return Object.keys(recv).map(k=>({ code:info[k].code, desc:info[k].desc, qty: recv[k] - (shp[k]||0) })).filter(x=>x.qty > 1e-9);
}
function readyOrders(){
  return quotesIndex.filter(q=>isOrderStatus(q.status)).map(q=>({ q, lines:readyLinesForOrder(q.id) })).filter(x=>x.lines.length);
}
function dueShipments(cutoff){
  return shipments.filter(s=>shipIsInvoiced(s) && shipPayState(s)!=='paid' && shipDueDate(s) && shipDueDate(s) <= cutoff)
    .sort((a,b)=>shipDueDate(a).localeCompare(shipDueDate(b)));
}

/* ---- Durum eşitleme (Teklifler hattı: Fatura Kesildi yalnızca tüm kalemler faturalanınca) ---- */
async function setQuoteStatusById(id, status){
  const r = await stGet('godo:quote:'+id); if(!(r && r.value)) return;
  const full = JSON.parse(r.value); full.status = status;
  await stSet('godo:quote:'+id, JSON.stringify(full));
  const idx = quotesIndex.findIndex(q=>q.id===id); if(idx>=0) quotesIndex[idx].status = status;
  await saveIndex();
  if(quote && quote.id===id) quote.status = status;
}
async function syncOrderPipelineStatus(orderId){
  const q = quotesIndex.find(x=>x.id===orderId);
  if(!q || !isOrderStatus(q.status)) return;
  const ships = shipsOf(orderId); if(!ships.length) return;
  const N = orderQtyTotal(q); if(!(N > 0)) return;
  const invoiced = ships.filter(shipIsInvoiced).reduce((t,s)=>t+shipQty(s),0);
  const target = invoiced >= N - 1e-9 ? 'Fatura Kesildi' : 'Siparişe Dönüştü';
  if(q.status !== target) await setQuoteStatusById(orderId, target);
}
function canSetFaturaKesildi(orderId){
  const ships = shipsOf(orderId);
  const q = quotesIndex.find(x=>x.id===orderId);
  if(!ships.length) return { ok:false, msg:'"Fatura Kesildi" durumu otomatiktir: Siparişler sayfasında sevkiyat oluşturup fatura no gir, tüm kalemler faturalanınca bu duruma kendiliğinden geçer.' };
  const N = q ? orderQtyTotal(q) : 0, inv = ships.filter(shipIsInvoiced).reduce((t,s)=>t+shipQty(s),0);
  if(N > 0 && inv < N - 1e-9) return { ok:false, msg:'Bu siparişin faturalanmamış kalemleri var ('+fmtQty(inv)+'/'+fmtQty(N)+'). Tüm kalemler faturalanınca durum kendiliğinden "Fatura Kesildi" olur.' };
  return { ok:true };
}

/* ---- Açılışta: eski sipariş verisini sevkiyata taşı, adet toplamlarını doldur ---- */
async function backfillOrderQty(){
  let changed = false;
  for(const q of quotesIndex){
    if(!isOrderStatus(q.status) || q.qtyTotal !== undefined) continue;
    const r = await stGet('godo:quote:'+q.id); if(!(r && r.value)) continue;
    let full; try{ full = JSON.parse(r.value); }catch(e){ continue; }
    q.qtyTotal = (full.items||[]).filter(it=>it.code||it.desc).reduce((s,it)=>s+(parseFloat(it.qty)||0),0);
    changed = true;
  }
  if(changed) await saveIndex();
}
async function migrateOrdersToShipments(){
  let changed = false;
  for(const q of quotesIndex.filter(x=>isOrderStatus(x.status))){
    if(shipments.some(s=>s.orderId===q.id)) continue;
    const legacy = q.irsaliyeNo || q.invoiceNo || q.paymentDueDate || (q.paymentStatus && q.paymentStatus!=='Fatura Kesilmedi') || q.status==='Fatura Kesildi' || q.orderStatus==='Sevk Edildi' || q.orderStatus==='Teslim Edildi';
    if(!legacy) continue;
    const r = await stGet('godo:quote:'+q.id); if(!(r && r.value)) continue;
    let full; try{ full = JSON.parse(r.value); }catch(e){ continue; }
    const lines = (full.items||[]).filter(it=>it.code||it.desc).map(it=>({ quoteItemId:it.id, productId:it.productId||null, code:it.code||'', desc:it.desc||'', qty:parseFloat(it.qty)||0, unitPrice:lineUnitPrice(it) }));
    if(!lines.length) continue;
    const invoiced = !!(full.invoiceNo || full.status==='Fatura Kesildi' || (full.paymentStatus && full.paymentStatus!=='Fatura Kesilmedi'));
    const vat = full.vatEnabled ? (parseFloat(full.vatRate)||0) : 0;
    const date = full.irsaliyeDate || full.date || todayStr();
    const net = lines.reduce((t,l)=>t+l.qty*l.unitPrice,0), total = net*(1+vat/100);
    let paid = parseFloat(full.paidAmount)||0;
    if(full.paymentStatus==='Tamamen Ödendi' && paid < total - 0.01) paid = total;
    const cu = full.customer||{};
    shipments.push({
      id:crypto.randomUUID(), orderId:q.id, orderNo:full.quoteNo||q.quoteNo||'',
      customer:{ name:upperCompanyName(cu.name||q.customerName||''), taxOffice:cu.taxOffice||'', taxNo:cu.taxNo||'', address:cu.address||'', contactName:cu.contactName||'', phone:cu.contactPhone||'' },
      currency:full.currency||q.currency||'€', date, irsaliyeNo:full.irsaliyeNo||'', irsaliyeNote:full.irsaliyeNote||'', officialIrsaliyeNo:'',
      lines, termDays:full.paymentTermDays||'', vatDefault:vat, vatRate: invoiced ? vat : '', invoiceNo:full.invoiceNo||'', invoiceDate: invoiced ? date : '',
      dueDateOverride:full.paymentDueDate||'', payments: paid>0 ? [{ id:crypto.randomUUID(), date, amount:Math.round(paid*100)/100, note:'Önceki sistemden aktarıldı' }] : [], migrated:true
    });
    changed = true;
  }
  if(changed) await saveShipments();
}

/* ---- Stok çıkışı: yalnızca resmi irsaliye no girilince ---- */
function applyShipmentStock(s){
  stockMoves = stockMoves.filter(m=>m.shipmentId!==s.id);
  if((s.officialIrsaliyeNo||'').trim()){
    const codes = productCodeMap();
    (s.lines||[]).forEach(l=>{
      const p = (l.productId && products.find(x=>x.id===l.productId)) || codes.get(foldTR((l.code||'').trim()));
      const q = parseFloat(l.qty)||0;
      if(!p || q<=0 || !stockMoves.some(m=>m.productId===p.id)) return;
      stockMoves.push({ id:crypto.randomUUID(), productId:p.id, code:p.code, date:s.date, type:'cikis', qty:-q, unitCost:0, currency:'€', srcDoc:s.officialIrsaliyeNo, note:'Sevkiyat '+(s.irsaliyeNo||''), shipmentId:s.id, createdAt:new Date().toISOString() });
    });
  }
  stockReservedCache = null;
}
function shipStockPending(s){
  if((s.officialIrsaliyeNo||'').trim()) return false;
  const codes = productCodeMap();
  return (s.lines||[]).some(l=>{ const p = (l.productId && products.find(x=>x.id===l.productId)) || codes.get(foldTR((l.code||'').trim())); return p && stockMoves.some(m=>m.productId===p.id); });
}
async function afterShipmentChange(orderId){
  stockReservedCache = null;
  await saveShipments(); await saveStockMoves();
  await syncOrderPipelineStatus(orderId);
}

/* ---- Modal yardımcısı ---- */
function openSimpleModal(innerHtml, width){
  const old = document.getElementById('modalOverlay'); if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'modalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  overlay.innerHTML = `<div class="modal-box" style="width:${width||620}px;max-width:96vw;max-height:92vh;overflow-y:auto;">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });
  return overlay;
}

async function openShipmentModal(orderId){
  const q = quotesIndex.find(x=>x.id===orderId);
  const r = await stGet('godo:quote:'+orderId);
  if(!q || !(r && r.value)){ alert('Sipariş verisi okunamadı.'); return; }
  const full = JSON.parse(r.value);
  const shp = {}; shipsOf(orderId).forEach(s=>(s.lines||[]).forEach(l=>{ const k = l.quoteItemId||l.code; shp[k] = (shp[k]||0) + (parseFloat(l.qty)||0); }));
  const recv = {}, bought = {};
  purchaseOrders.forEach(po=>{ if(po.salesOrderId!==orderId || po.status==='İptal') return; (po.items||[]).forEach(it=>{ if(!it.quoteItemId) return; bought[it.quoteItemId] = (bought[it.quoteItemId]||0) + (parseFloat(it.qty)||0); recv[it.quoteItemId] = (recv[it.quoteItemId]||0) + (parseFloat(it.receivedQty)||0); }); });
  const lines = (full.items||[]).filter(it=>it.code||it.desc).map(it=>{
    const ordered = parseFloat(it.qty)||0, shipped = shp[it.id]||0, remaining = ordered - shipped;
    const hasPO = (bought[it.id]||0) > 0, got = recv[it.id]||0, ready = Math.max(0, got - shipped);
    const def = hasPO ? Math.min(remaining, ready) : remaining;
    return { it, ordered, shipped, remaining, hasPO, got, def: Math.max(0, def) };
  }).filter(l=>l.remaining > 1e-9);
  if(!lines.length){ alert('Bu siparişin tüm kalemleri zaten sevk edilmiş.'); return; }
  const ov = openSimpleModal(`
    <h2>Sevkiyat Oluştur</h2>
    <p class="hint"><b>${escapeHtml(full.quoteNo||'')}</b> · ${escapeHtml(upperCompanyName(full.customer.name||''))}. Bu sevkiyata giren kalemleri ve miktarları seç; irsaliye numarası otomatik verilir. Mal kabulü yapılmış kalemler dolu gelir, mal bekleyenler 0 gelir.</p>
    <table class="items-table"><thead><tr><th style="width:28px;"></th><th>Ürün</th><th class="num">Sipariş</th><th class="num">Sevk edilen</th><th class="num">Gelen (mal kabul)</th><th class="num" style="width:110px;">Bu sevkiyatta</th></tr></thead><tbody>
      ${lines.map((l,i)=>`<tr data-i="${i}">
        <td><input type="checkbox" class="sl-on" ${l.def>0?'checked':''}></td>
        <td><div class="mono" style="font-size:12px;">${escapeHtml(l.it.code||'')}</div><div style="font-size:11px;color:var(--gray-500);">${escapeHtml(l.it.desc||'')}</div></td>
        <td class="num mono">${fmtQty(l.ordered)}</td><td class="num mono">${fmtQty(l.shipped)}</td>
        <td class="num mono" style="color:${l.hasPO?(l.got>=l.remaining?'var(--ink)':'var(--danger)'):'var(--gray-300)'};">${l.hasPO?fmtQty(l.got):'SAS yok'}</td>
        <td class="num"><input class="sl-qty mono" type="number" min="0" step="1" value="${l.def}" style="width:90px;text-align:right;font-size:12px;"></td></tr>`).join('')}
    </tbody></table>
    <div class="grid2" style="margin-top:14px;">
      <div class="field"><label>Sevk Tarihi</label><input id="sl-date" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Not (araç plaka, şoför vb. — opsiyonel)</label><input id="sl-note"></div>
    </div>
    <div class="field"><label>Resmi e-irsaliye no (opsiyonel — girilince stoktan düşülür)</label><input id="sl-official" placeholder="Portalda kestiysen numarasını yaz"></div>
    <div class="actions-row" style="margin-top:14px;">
      <button class="btn btn-primary" id="sl-create">Sevkiyat Oluştur</button>
      <button class="btn btn-ghost" id="sl-cancel">Vazgeç</button>
    </div>`, 880);
  ov.querySelector('#sl-cancel').onclick = ()=>ov.remove();
  ov.querySelector('#sl-create').onclick = async ()=>{
    const out = [];
    for(const tr of ov.querySelectorAll('tbody tr')){
      if(!tr.querySelector('.sl-on').checked) continue;
      const l = lines[+tr.dataset.i]; const qty = parseFloat(tr.querySelector('.sl-qty').value);
      if(!(qty > 0)) continue;
      if(qty > l.remaining + 1e-9){ alert((l.it.code||'Kalem')+' için kalan miktardan ('+fmtQty(l.remaining)+') fazla girdin.'); return; }
      out.push({ quoteItemId:l.it.id, productId:l.it.productId||null, code:l.it.code||'', desc:l.it.desc||'', qty, unitPrice:lineUnitPrice(l.it) });
    }
    if(!out.length){ alert('Sevk edilecek miktar girilmedi.'); return; }
    const cu = full.customer||{};
    const lang = full.lang==='en';
    const vatDefault = full.vatEnabled ? (parseFloat(full.vatRate)||0) : (lang ? 0 : (parseFloat(full.vatRate)||20));
    const s = {
      id:crypto.randomUUID(), orderId, orderNo:full.quoteNo||'',
      customer:{ name:upperCompanyName(cu.name||''), taxOffice:cu.taxOffice||'', taxNo:cu.taxNo||'', address:cu.address||'', contactName:cu.contactName||'', phone:cu.contactPhone||'' },
      currency:full.currency||'€', date:ov.querySelector('#sl-date').value||todayStr(), irsaliyeNo:nextShipmentIrsaliyeNo(), irsaliyeNote:ov.querySelector('#sl-note').value.trim(),
      officialIrsaliyeNo:ov.querySelector('#sl-official').value.trim(), lines:out, termDays:q.paymentTermDays||full.paymentTermDays||'',
      vatDefault, vatRate:'', invoiceNo:'', invoiceDate:'', dueDateOverride:'', payments:[]
    };
    shipments.push(s); applyShipmentStock(s);
    await afterShipmentChange(orderId);
    ov.remove(); shipPrintId = s.id; activeTab = 'irsaliyePrint'; render();

        ${s.payments.map(p=>`<tr><td class="mono" style="font-size:12px;">${formatDate(p.date)}</td><td class="num mono">${cur} ${fmt(parseFloat(p.amount)||0)}</td><td style="font-size:12px;color:var(--gray-500);">${escapeHtml(p.note||'')}</td><td><span class="row-remove" data-del-pay="${p.id}">✕</span></td></tr>`).join('')}</tbody></table>` : '<p class="hint">Henüz tahsilat kaydı yok.</p>'}
      ${rest > 0.005 ? `<div class="subhead" style="margin-top:16px;">Tahsilat Ekle</div>
      <div class="grid3">
        <div class="field mono"><label>Tutar (${cur})</label><input id="py-amt" type="number" step="0.01" min="0" value="${Math.round(rest*100)/100}"></div>
        <div class="field"><label>Tarih</label><input id="py-date" type="date" value="${todayStr()}"></div>
        <div class="field"><label>Not</label><input id="py-note" placeholder="havale, çek..."></div>
      </div>` : ''}
      <div class="actions-row" style="margin-top:10px;">
        ${rest > 0.005 ? '<button class="btn btn-primary" id="py-add">Tahsilatı Kaydet</button>' : ''}
        <button class="btn btn-ghost" id="py-close">Kapat</button>
      </div>`;
    ov.querySelector('#py-close').onclick = ()=>{ ov.remove(); render(); };
    const add = ov.querySelector('#py-add');
    if(add) add.onclick = async ()=>{
      const amt = parseFloat(ov.querySelector('#py-amt').value);
      if(!(amt > 0)){ alert('Geçerli bir tutar gir.'); return; }
      s.payments = (s.payments||[]).concat([{ id:crypto.randomUUID(), date:ov.querySelector('#py-date').value||todayStr(), amount:Math.round(amt*100)/100, note:ov.querySelector('#py-note').value.trim() }]);
      await afterShipmentChange(s.orderId); draw();
    };
    ov.querySelectorAll('[data-del-pay]').forEach(b=>{
      b.onclick = async ()=>{ if(!confirm('Bu tahsilat kaydı silinsin mi?')) return; s.payments = s.payments.filter(p=>p.id!==b.dataset.delPay); await afterShipmentChange(s.orderId); draw(); };
    });
  };
  if(!shipIsInvoiced(s)){ alert('Önce sevkiyatın fatura numarasını gir.'); return; }
  const ov = openSimpleModal('', 700);
  draw();
}

  const pct = total > 0 ? Math.min(100, Math.round(done/total*100)) : 0;

}

/* ---------------- MAL KABUL (gelen irsaliye → stok girişi → sevke hazır bildirimi) ---------------- */
function recalcPoReceived(po){
  (po.items||[]).forEach(it=>{
    it.receivedQty = (po.receipts||[]).reduce((s,r)=>s+(r.lines||[]).filter(l=>l.poItemId===it.id).reduce((t,l)=>t+(parseFloat(l.qty)||0),0),0);
  });
  if(po.status==='İptal') return;
  const ord = (po.items||[]).reduce((s,it)=>s+(parseFloat(it.qty)||0),0);
  const rec = (po.items||[]).reduce((s,it)=>s+Math.min(parseFloat(it.receivedQty)||0, parseFloat(it.qty)||0),0);
  if((po.receipts||[]).length){
    if(ord > 0 && rec >= ord - 1e-9) po.status = 'Teslim Alındı';
    else if(rec > 1e-9) po.status = 'Kısmen Teslim Alındı';
  }
}
function ensureProductForPoItem(it){
  const codes = productCodeMap();
  let p = (it.productId && products.find(x=>x.id===it.productId)) || codes.get(foldTR((it.code||'').trim()));

];

/* ---- Kur: TCMB günlük kurları (belge tarihindeki kur; hafta sonu/tatilde önceki iş günü) ---- */
function currencyCode(sym){ return sym==='€' ? 'EUR' : sym==='$' ? 'USD' : 'TRY'; }
function fxKind(direction){
  const m = (acctSettings && acctSettings.fxMode) || 'auto';
  if(m==='buy' || m==='sell') return m;
  return direction==='sale' ? 'buy' : 'sell';          // alacak = döviz alış, borç = döviz satış
}
function rateFor(sym, date, kind){
  const code = currencyCode(sym);
  if(code==='TRY') return { rate:1, date };
  if(!date) return null;
  for(let i=0; i<=7; i++){
    const d = addDaysStr(date, -i), r = fxRates[d] && fxRates[d][code];
    if(r && r[kind] > 0) return { rate:r[kind], date:d };
  }
  return null;
}
function parseRate(s){
  let t = String(s==null?'':s).trim(); if(!t) return NaN;
  t = t.includes(',') ? t.replace(/\./g,'').replace(',','.') : t;
  const n = parseFloat(t);
  return (n > 0.05 && n < 1000) ? n : NaN;
}
function normDateInput(s){
  const t = String(s||'').trim(); let m;
  if((m = t.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return t;
  if((m = t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/))) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
async function fetchTcmbRange(from, to){
  if(typeof sb === 'undefined' || !sb || !sb.functions) throw new Error('kur servisi kullanılamıyor (oturum yok)');
  const { data, error } = await sb.functions.invoke('tcmb-rates', { body:{ from, to } });
  if(error) throw new Error(error.message || 'kur servisi hatası');
  if(data && data.error) throw new Error(data.error);
  return { rates:data.rates||{}, missing:data.missing||[], skipped:data.skipped||[], failed:data.failed||[] };
}
async function fetchTcmbRates(dateStr){
  const d = await fetchTcmbRange(dateStr, dateStr);
  if(d.rates[dateStr]) return d.rates[dateStr];
  if(d.skipped.includes(dateStr)) throw new Error('hafta sonu: TCMB kur yayımlamaz, önceki iş günü kuru kullanılır');
  if(d.missing.includes(dateStr)) throw new Error('bu tarih için TCMB kuru yok (resmi tatil ya da henüz yayımlanmadı)');
  throw new Error('kur alınamadı, daha sonra tekrar dene');
}

/* ---- Otomatik kur güncelleme: belgelerin ihtiyaç duyduğu iş günlerinin kurlarını TCMB'den tamamlar ---- */
let fxSync = { running:false, at:0, ok:null, msg:'', added:0 };
function foreignDocDates(){
  const set = new Set(), add = (cur, d)=>{ if(cur && cur!=='₺' && d) set.add(d); };
  shipments.forEach(s=>{ add(s.currency||'€', s.date); if(shipIsInvoiced(s)) add(s.currency||'€', s.invoiceDate); (s.payments||[]).forEach(p=>add(s.currency||'€', p.date)); });
  purchaseInvoices.forEach(pi=>{ add(pi.currency||'€', pi.date); (pi.payments||[]).forEach(p=>add(pi.currency||'€', p.date)); });
  stockMoves.forEach(m=>{ if((Number(m.qty)||0) > 0) add(m.currency||'€', m.date); });
  return [...set].sort();
}
function neededRateDays(){
  const docs = foreignDocDates(); if(!docs.length) return [];
  const noRate = new Set((acctSettings && acctSettings.fxNoRate) || []), end = todayStr(), days = [];
  for(let d = addDaysStr(docs[0], -7); d <= end; d = addDaysStr(d, 1)){
    const wd = new Date(d+'T00:00:00Z').getUTCDay();
    if(wd===0 || wd===6 || noRate.has(d)) continue;
    const r = fxRates[d]; if(r && r.USD && r.EUR) continue;
    days.push(d);
  }
  return days.slice(-400);
}
async function autoSyncFxRates(force){
  if(fxSync.running) return;
  if(!force && fxSync.at && Date.now() - fxSync.at < 10*60*1000) return;
  if(!acctSettings) acctSettings = defaultAcctSettings();
  const days = neededRateDays();
  if(!days.length){ fxSync = { running:false, at:Date.now(), ok:true, msg:'Tüm kurlar güncel', added:0 }; return; }
  fxSync = { running:true, at:Date.now(), ok:null, msg:'', added:0 };
  let added = 0, failed = 0;
  try{
    let i = 0; const noRate = new Set(acctSettings.fxNoRate || []);
    while(i < days.length){
      const from = days[i], limit = addDaysStr(from, 45); let j = i; while(j < days.length && days[j] <= limit) j++;
      const res = await fetchTcmbRange(from, days[j-1]);
      Object.keys(res.rates).forEach(d=>{ fxRates[d] = Object.assign({}, res.rates[d], fxRates[d]||{}); added++; });   // elle girilmiş kur varsa o kalır
      res.missing.forEach(d=>{ if(d < todayStr()) noRate.add(d); });                                                 // yalnız geçmiş tatiller kalıcı işaretlenir
      failed += res.failed.length; i = j;
    }
    acctSettings.fxNoRate = [...noRate].sort().slice(-800);
    await saveFxRates(); await saveAcctSettings();
    fxSync = { running:false, at:Date.now(), ok:failed===0, added,
      msg:(added ? added+' günün kuru TCMB\'den alındı' : 'Yeni kur yok')+(failed ? ' · '+failed+' gün geçici olarak alınamadı, sonra tekrar denenecek' : '') };
  }catch(e){
    fxSync = { running:false, at:Date.now(), ok:false, added, msg:'Kur servisine ulaşılamadı: '+e.message };
  }
  if(activeTab==='accounting' || activeTab==='finance') render();
}

function parseRatesPaste(text){
  const rows = parseDelimited(text, detectDelimiter(text)), out = {}; let bad = 0;
  rows.forEach(r=>{
    const d = normDateInput(r[0]); if(!d){ if(/\d/.test(r[0]||'')) bad++; return; }
    const usdB = parseRate(r[1]), usdS = parseRate(r[2]), eurB = parseRate(r[3]), eurS = parseRate(r[4]);
    const e = {}; if(usdB && usdS) e.USD = { buy:usdB, sell:usdS }; if(eurB && eurS) e.EUR = { buy:eurB, sell:eurS };
    if(Object.keys(e).length) out[d] = Object.assign(out[d]||{}, e); else bad++;
  });
  return { rates:out, bad };
}

/* ---- FIFO maliyeti: çıkış hareketinin maliyeti (orijinal para birimi + TL) ---- */
function fifoMoveCosts(productId){
  const moves = stockMoves.filter(m=>m.productId===productId).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
  const layers = [], out = new Map(); let shortage = 0;
  moves.forEach(m=>{
    let q = Number(m.qty)||0;
    if(q > 0){
      if(shortage > 0){ const used = Math.min(shortage, q); shortage -= used; q -= used; }
      if(q > 0) layers.push({ qty:q, unitCost:Number(m.unitCost)||0, currency:m.currency||'€', date:m.date });
    } else if(q < 0){
      let need = -q, tl = 0, missing = false; const byCur = {};
      while(need > 1e-9 && layers.length){
        const L = layers[0], take = Math.min(L.qty, need), amt = take*L.unitCost;
        byCur[L.currency] = (byCur[L.currency]||0) + amt;
        const r = rateFor(L.currency, L.date, fxKind('purchase')); if(r) tl += amt*r.rate; else missing = true;
        L.qty -= take; need -= take; if(L.qty <= 1e-9) layers.shift();
      }
      if(need > 1e-9) shortage += need;
      out.set(m.id, { byCur, tl: missing ? null : round2(tl) });
    }
  });
  return out;
}

/* ---- Tedarikçi faturası ---- */
function piNet(pi){ return (pi.lines||[]).reduce((t,l)=>t+(parseFloat(l.qty)||0)*(parseFloat(l.unitCost)||0),0); }
function piTotal(pi){ return piNet(pi) * (1 + (parseFloat(pi.vatRate)||0)/100); }
function piPaid(pi){ return (pi.payments||[]).reduce((t,p)=>t+(parseFloat(p.amount)||0),0); }
function piDueDate(pi){
  if(pi.dueDateOverride) return pi.dueDateOverride;
  const t = parseInt(pi.termDays);
  return (isNaN(t) || !pi.date) ? '' : addDaysStr(pi.date, t);
}
function piPayState(pi){
  const total = piTotal(pi), paid = piPaid(pi);
  if(total > 0 && paid >= total - 0.01) return 'paid';
  const due = piDueDate(pi);
  if(due && due < todayStr()) return 'overdue';
  return paid > 0 ? 'partial' : 'waiting';
}
