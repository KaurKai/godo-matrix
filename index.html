function fmtTL(n){ return '₺ '+fmt(n); }
function shipBooked(s){
  if(!shipIsInvoiced(s)) return null;
  const r = rateFor(s.currency||'€', s.invoiceDate, fxKind('sale')); if(!r) return null;
  const v = parseFloat(s.vatRate)||0, net = shipNet(s), netTL = round2(net*r.rate), vatTL = round2(net*r.rate*v/100);
  return { rate:r.rate, rateDate:r.date, netTL, vatTL, totalTL:round2(netTL+vatTL), vat:v };
}
function piBooked(pi){
  const r = rateFor(pi.currency||'€', pi.date, fxKind('purchase')); if(!r) return null;
  const v = parseFloat(pi.vatRate)||0, net = piNet(pi), netTL = round2(net*r.rate), vatTL = round2(net*r.rate*v/100);
  return { rate:r.rate, rateDate:r.date, netTL, vatTL, totalTL:round2(netTL+vatTL), vat:v };
}
function saleItems(){
  return shipments.filter(shipIsInvoiced).map(s=>{
    const total = shipTotal(s), paid = shipPaid(s), q = quotesIndex.find(x=>x.id===s.orderId);
    return { kind:'sale', id:s.id, partyKey:(q&&q.customerId)||('n:'+foldTR(s.customer.name||'')), partyName:upperCompanyName(s.customer.name||'İsimsiz Müşteri'),
      docNo:s.invoiceNo||s.irsaliyeNo||'', date:s.invoiceDate, due:shipDueDate(s), cur:s.currency||'€', total, paid, remaining:Math.max(0,total-paid), state:shipPayState(s), booked:shipBooked(s), obj:s };
  });
}
function purchaseItems(){
  return purchaseInvoices.map(pi=>{
    const total = piTotal(pi), paid = piPaid(pi);
    return { kind:'purchase', id:pi.id, partyKey:pi.supplierId, partyName:supplierName(pi.supplierId)||'Tedarikçi seçilmedi',
      docNo:pi.invoiceNo, date:pi.date, due:piDueDate(pi), cur:pi.currency||'€', total, paid, remaining:Math.max(0,total-paid), state:piPayState(pi), booked:piBooked(pi), obj:pi };
  });
}
function bucketOf(due){ if(!due) return 'none'; const d = diffDaysStr(due, todayStr()); return d < 0 ? 'overdue' : (d <= 30 ? 'soon' : 'later'); }
function itemRate(i){ return i.cur==='₺' ? 1 : (i.booked ? i.booked.rate : null); }
function groupParties(items){
  const map = new Map();
  items.forEach(i=>{
    let g = map.get(i.partyKey);
    if(!g){ g = { partyKey:i.partyKey, name:i.partyName, items:[], count:0, totalTL:0, paidTL:0, remainingTL:0, buckets:{overdue:0,soon:0,later:0,none:0}, missing:0, byCur:{} }; map.set(i.partyKey, g); }
    g.items.push(i); g.count++;
    const c = g.byCur[i.cur] = g.byCur[i.cur] || { total:0, paid:0, remaining:0 };
    c.total += i.total; c.paid += i.paid; c.remaining += i.remaining;
    const r = itemRate(i); if(r===null){ g.missing++; return; }
    g.totalTL += i.total*r; g.paidTL += i.paid*r;
    const rem = i.remaining*r; g.remainingTL += rem;
    if(i.remaining > 0.005) g.buckets[bucketOf(i.due)] += rem;
  });
  return [...map.values()].sort((a,b)=>b.remainingTL-a.remainingTL);
}
function allocatePayment(items, amount){
  const sorted = items.slice().sort((a,b)=>(a.due||'9999-99-99').localeCompare(b.due||'9999-99-99') || (a.date||'').localeCompare(b.date||''));
  let left = round2(amount); const out = [];
  sorted.forEach(i=>{
    if(left <= 0.004) return;
    const a = Math.min(i.remaining, left);
    if(a > 0.004){ out.push({ item:i, amount:round2(a) }); left = round2(left - a); }
  });
  return { allocations:out, left };
}

/* ---------------- YEVMİYE MOTORU (belgelerden otomatik) ---------------- */
function shipCogs(s){
  const codes = productCodeMap(), cur = s.currency||'€'; let tl = 0, missing = false, unknown = false;
  (s.lines||[]).forEach(l=>{
    const p = (l.productId && products.find(x=>x.id===l.productId)) || codes.get(foldTR((l.code||'').trim())), q = parseFloat(l.qty)||0;
    const outMoves = p ? stockMoves.filter(m=>m.shipmentId===s.id && m.productId===p.id) : [];
    if(outMoves.length){
      const costs = fifoMoveCosts(p.id);
      outMoves.forEach(m=>{ const c = costs.get(m.id); if(!c){ unknown = true; return; } if(c.tl===null) missing = true; else tl += c.tl; });
      return;
    }
    const act = actualCostForQuoteItem(s.orderId, l.quoteItemId, cur);
    if(act === null){ unknown = true; return; }
    const r = rateFor(cur, s.date, fxKind('purchase')); if(!r){ missing = true; return; }
    tl += act*q*r.rate;
  });
  return { tl:round2(tl), missing, unknown };
}
function buildJournal(from, to){
  const entries = [], stmt = [], fxMissing = new Map(), cogsUnknown = [];
  const inRange = d=>!!d && d >= from && d <= to;
  const ln = (role, debit, credit)=>({ acc:acct(role), name:acctName(role), debit:round2(debit), credit:round2(credit) });
  const miss = (cur, date)=>{ if(cur && cur!=='₺') fxMissing.set(cur+'|'+date, { cur, date }); };
  const fxNote = (rateDate, date)=> (rateDate && rateDate!==date) ? ' · TCMB kuru '+formatDate(rateDate) : '';
  const payEntry = (kind, doc, p, i, party, book, cur, docDate, no)=>{
    const direction = kind==='sale' ? 'sale' : 'purchase', amt = parseFloat(p.amount)||0;
    const rp = rateFor(cur, p.date, fxKind(direction));
    if(!rp){ miss(cur, p.date); return; }
    const payTL = round2(amt*rp.rate), bookedTL = round2(amt*book.rate), diff = round2(payTL - bookedTL);
    const lines = kind==='sale'
      ? [ ln('bankalar', payTL, 0), ln('alicilar', 0, bookedTL) ].concat(diff > 0 ? [ln('kurGelir', 0, diff)] : diff < 0 ? [ln('kurGider', -diff, 0)] : [])
      : [ ln('saticilar', bookedTL, 0), ln('bankalar', 0, payTL) ].concat(diff > 0 ? [ln('kurGider', diff, 0)] : diff < 0 ? [ln('kurGelir', 0, -diff)] : []);
    lines.sort((x,y)=>(y.debit>0) - (x.debit>0));      // önce borç satırları
    entries.push({ date:p.date, no:(kind==='sale'?'TH-':'OD-')+no+'-'+(i+1), source:no, desc:party+(kind==='sale'?' — tahsilat':' — ödeme')+(p.note?' ('+p.note+')':'')+fxNote(rp.date, p.date), kind:kind==='sale'?'Tahsilat':'Ödeme', lines });
    stmt.push({ partyType:kind==='sale'?'Müşteri':'Tedarikçi', party, date:p.date, docType:kind==='sale'?'Tahsilat':'Ödeme', docNo:no, cur, fx:amt, rate:rp.rate, debit:kind==='sale'?0:bookedTL, credit:kind==='sale'?bookedTL:0 });
  };
  shipments.filter(shipIsInvoiced).forEach(s=>{
    const party = upperCompanyName(s.customer.name||''), cur = s.currency||'€', bk = shipBooked(s), no = s.invoiceNo||s.irsaliyeNo||'—';
    if(inRange(s.invoiceDate)){
      if(!bk) miss(cur, s.invoiceDate);
      else {
        entries.push({ date:s.invoiceDate, no:'SF-'+no, source:no, desc:party+' — satış faturası'+fxNote(bk.rateDate, s.invoiceDate), kind:'Satış Faturası',
          lines:[ ln('alicilar', bk.totalTL, 0), ln('satislar', 0, bk.netTL) ].concat(bk.vatTL ? [ln('hesaplananKdv', 0, bk.vatTL)] : []) });
        stmt.push({ partyType:'Müşteri', party, date:s.invoiceDate, docType:'Satış Faturası', docNo:no, cur, fx:shipTotal(s), rate:bk.rate, debit:bk.totalTL, credit:0 });
      }
    }
    (s.payments||[]).forEach((p,i)=>{ if(!inRange(p.date)) return; if(!bk){ miss(cur, s.invoiceDate); return; } payEntry('sale', s, p, i, party, bk, cur, s.invoiceDate, no); });
  });
  shipments.forEach(s=>{
    if(!inRange(s.date)) return;
    const c = shipCogs(s), cur = s.currency||'€', no = s.officialIrsaliyeNo || s.irsaliyeNo || '—';
    if(c.missing) miss(cur, s.date);
    if(c.unknown) cogsUnknown.push({ shipment:s.irsaliyeNo||'', order:s.orderNo||'', party:s.customer.name||'' });
    if(c.tl > 0) entries.push({ date:s.date, no:'MF-'+no, source:no, desc:upperCompanyName(s.customer.name||'')+' — satış maliyeti ('+(s.irsaliyeNo||'')+')', kind:'Satış Maliyeti', lines:[ ln('maliyet', c.tl, 0), ln('ticariMallar', 0, c.tl) ] });
  });
  purchaseInvoices.forEach(pi=>{
    const party = supplierName(pi.supplierId) || 'Tedarikçi', cur = pi.currency||'€', bk = piBooked(pi);
    if(inRange(pi.date)){
      if(!bk) miss(cur, pi.date);
      else {
        entries.push({ date:pi.date, no:'AF-'+pi.invoiceNo, source:pi.invoiceNo, desc:party+' — alış faturası'+fxNote(bk.rateDate, pi.date), kind:'Alış Faturası',
          lines:[ ln('ticariMallar', bk.netTL, 0) ].concat(bk.vatTL ? [ln('indirilecekKdv', bk.vatTL, 0)] : []).concat([ ln('saticilar', 0, bk.totalTL) ]) });
        stmt.push({ partyType:'Tedarikçi', party, date:pi.date, docType:'Alış Faturası', docNo:pi.invoiceNo, cur, fx:piTotal(pi), rate:bk.rate, debit:0, credit:bk.totalTL });
      }
    }
    (pi.payments||[]).forEach((p,i)=>{ if(!inRange(p.date)) return; if(!bk){ miss(cur, pi.date); return; } payEntry('purchase', pi, p, i, party, bk, cur, pi.date, pi.invoiceNo); });
  });
  entries.sort((a,b)=>a.date.localeCompare(b.date) || a.no.localeCompare(b.no));
  let debit = 0, credit = 0; entries.forEach(e=>e.lines.forEach(l=>{ debit += l.debit; credit += l.credit; }));
  return { entries, stmt, warnings:{ fx:[...fxMissing.values()].sort((a,b)=>a.date.localeCompare(b.date)), cogsUnknown }, totals:{ debit:round2(debit), credit:round2(credit) } };
}

/* ---------------- CSV ÇIKTILARI (müşavire) ---------------- */
function csvCell(v){ const s = v==null ? '' : String(v); return /[;"\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function csvNum(n){ return (Math.round((Number(n)||0)*100)/100).toFixed(2).replace('.', ','); }
function csvText(rows){ return '\uFEFF' + rows.map(r=>r.map(csvCell).join(';')).join('\r\n'); }
function downloadCsv(name, rows){
  const blob = new Blob([csvText(rows)], { type:'text/csv;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function journalCsvRows(entries){
  const rows = [['Tarih','Fiş No','Hesap Kodu','Hesap Adı','Borç','Alacak','Açıklama','Kaynak Belge No']];
  entries.forEach(e=>e.lines.forEach(l=>rows.push([formatDate(e.date), e.no, l.acc, l.name, csvNum(l.debit), csvNum(l.credit), e.desc, e.source])));
  return rows;
}
function statementCsvRows(stmt){
  const rows = [['Cari Türü','Cari','Tarih','Belge Türü','Belge No','Para Birimi','Döviz Tutarı','Kur','Borç (TL)','Alacak (TL)','Bakiye (TL)']];
  const groups = new Map();
  stmt.forEach(x=>{ const k = x.partyType+'|'+x.party; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
  [...groups.keys()].sort((a,b)=>a.localeCompare(b,'tr')).forEach(k=>{
    let bal = 0;
    groups.get(k).sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
      bal += x.partyType==='Müşteri' ? x.debit - x.credit : x.credit - x.debit;
      rows.push([x.partyType, x.party, formatDate(x.date), x.docType, x.docNo, x.cur, csvNum(x.fx), String(x.rate).replace('.',','), csvNum(x.debit), csvNum(x.credit), csvNum(bal)]);
    });
  });
  return rows;
}
function vatCsvRows(from, to){
  const rows = [['Dönem','Tür','Tarih','Belge No','Cari','Matrah (TL)','KDV Oranı (%)','KDV (TL)']], sum = {};
  const add = (period, type, d, no, party, bk)=>{
    rows.push([period, type, formatDate(d), no, party, csvNum(bk.netTL), String(bk.vat), csvNum(bk.vatTL)]);
    sum[period] = sum[period] || { calc:0, ded:0 }; if(type==='Hesaplanan') sum[period].calc += bk.vatTL; else sum[period].ded += bk.vatTL;
  };
  shipments.filter(s=>shipIsInvoiced(s) && s.invoiceDate>=from && s.invoiceDate<=to).sort((a,b)=>a.invoiceDate.localeCompare(b.invoiceDate)).forEach(s=>{ const bk = shipBooked(s); if(bk) add(s.invoiceDate.slice(0,7), 'Hesaplanan', s.invoiceDate, s.invoiceNo||s.irsaliyeNo, upperCompanyName(s.customer.name||''), bk); });
  purchaseInvoices.filter(pi=>pi.date>=from && pi.date<=to).sort((a,b)=>a.date.localeCompare(b.date)).forEach(pi=>{ const bk = piBooked(pi); if(bk) add(pi.date.slice(0,7), 'İndirilecek', pi.date, pi.invoiceNo, supplierName(pi.supplierId), bk); });
  rows.push([]);
  rows.push(['Dönem','Hesaplanan KDV (TL)','İndirilecek KDV (TL)','Ödenecek / Devreden KDV (TL)']);
  Object.keys(sum).sort().forEach(p=>rows.push([p, csvNum(sum[p].calc), csvNum(sum[p].ded), csvNum(sum[p].calc - sum[p].ded)]));
  return rows;
}
function stockValueCsvRows(){
  const rows = [['Ürün Kodu','Açıklama','Miktar','Değer (orijinal)','Para Birimi','Değer (TL)']];
  products.filter(isStockTracked).sort((a,b)=>(a.code||'').localeCompare(b.code||'','tr')).forEach(p=>{
    const st = fifoState(p.id); if(Math.abs(st.onHand) < 1e-9 && !st.layers.length) return;
    const byCur = {}; let tl = 0, missing = false;
    st.layers.forEach(l=>{ const amt = l.qty*l.unitCost; byCur[l.currency] = (byCur[l.currency]||0) + amt; const r = rateFor(l.currency, l.date, fxKind('purchase')); if(r) tl += amt*r.rate; else missing = true; });
    rows.push([p.code, p.desc||'', csvNum(st.onHand), Object.entries(byCur).map(([c,v])=>csvNum(v)).join(' + '), Object.keys(byCur).join(' + '), missing ? '' : csvNum(tl)]);
  });
  return rows;
}

function periodRange(key){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), pad = n=>String(n).padStart(2,'0'), last = (yy,mm)=>new Date(yy,mm+1,0).getDate();
  if(key==='month') return [`${y}-${pad(m+1)}-01`, `${y}-${pad(m+1)}-${pad(last(y,m))}`];
  if(key==='lastmonth'){ const d = new Date(y, m-1, 1), yy = d.getFullYear(), mm = d.getMonth(); return [`${yy}-${pad(mm+1)}-01`, `${yy}-${pad(mm+1)}-${pad(last(yy,mm))}`]; }
  if(key==='quarter'){ const sm = Math.floor(m/3)*3; return [`${y}-${pad(sm+1)}-01`, `${y}-${pad(sm+3)}-${pad(last(y,sm+2))}`]; }
  if(key==='year') return [`${y}-01-01`, `${y}-12-31`];
  return [acctFrom || `${y}-01-01`, acctTo || `${y}-12-31`];
}

function shipInvoiceInfoHtml(s){

function uninvoicedReceipts(){
  return purchaseOrders.filter(po=>po.status!=='İptal').map(po=>{
    const done = {}; purchaseInvoices.filter(x=>x.poId===po.id).forEach(x=>(x.lines||[]).forEach(l=>{ done[l.poItemId] = (done[l.poItemId]||0) + (parseFloat(l.qty)||0); }));
    const lines = (po.items||[]).map(it=>({ it, qty:(parseFloat(it.receivedQty)||0) - (done[it.id]||0) })).filter(l=>l.qty > 1e-9);
    return lines.length ? { po, lines } : null;
  }).filter(Boolean);
}

/* ---------------- AÇIK SİPARİŞLER (sevk edilmemiş kalemler, müşteri bazında) ---------------- */
let openSearch = '', openFilter = '', openSort = 'ad';
let openOrderCache = { at:0, bodies:{} };

async function loadOpenOrderBodies(force){
  if(!force && openOrderCache.at && Date.now() - openOrderCache.at < 20000) return;
  const bodies = {};
  for(const q of quotesIndex.filter(x=>isOrderStatus(x.status))){
    const r = await stGet('godo:quote:'+q.id); if(!(r && r.value)) continue;
    try{ bodies[q.id] = JSON.parse(r.value); }catch(e){}
  }
  openOrderCache = { at:Date.now(), bodies };
}
function openLineState(l){
  if(l.ready > 1e-9) return { key:'hazir', label:'Sevke hazır'+(l.ready < l.open - 1e-9 ? ' ('+fmtQty(l.ready)+'/'+fmtQty(l.open)+')' : '') };
  if(l.purchased < l.ordered - 1e-9) return { key:'sas', label: l.purchased > 1e-9 ? 'SAS eksik ('+fmtQty(l.purchased)+'/'+fmtQty(l.ordered)+')' : 'SAS açılmadı' };
  return { key:'mal', label:'Mal bekleniyor' };
}
function openOrderLines(){
  const out = [], codes = productCodeMap();
  quotesIndex.filter(q=>isOrderStatus(q.status)).forEach(q=>{
    const full = openOrderCache.bodies[q.id]; if(!full) return;
    const shp = {}; shipsOf(q.id).forEach(s=>(s.lines||[]).forEach(l=>{ const k = l.quoteItemId||l.code; shp[k] = (shp[k]||0) + (parseFloat(l.qty)||0); }));
    const pur = {}, rec = {}, pos = {};
    purchaseOrders.forEach(po=>{
      if(po.salesOrderId!==q.id || po.status==='İptal') return;
      (po.items||[]).forEach(it=>{
        if(!it.quoteItemId) return;
        const pq = parseFloat(it.qty)||0, rq = parseFloat(it.receivedQty)||0;
        pur[it.quoteItemId] = (pur[it.quoteItemId]||0) + pq; rec[it.quoteItemId] = (rec[it.quoteItemId]||0) + rq;
        (pos[it.quoteItemId] = pos[it.quoteItemId]||[]).push({ no:po.poNo, sup:supplierName(po.supplierId), got:rq, qty:pq });
      });
    });
    (full.items||[]).filter(it=>it.code||it.desc).forEach(it=>{
      const ordered = parseFloat(it.qty)||0, shipped = shp[it.id]||0, open = ordered - shipped;
      if(open <= 1e-9) return;
      const purchased = pur[it.id]||0, received = rec[it.id]||0, ready = Math.max(0, received - shipped), unit = lineUnitPrice(it);
      const p = codes.get(foldTR((it.code||'').trim())); const stock = p && isStockTracked(p) ? fifoState(p.id).onHand : null;
      const line = { q, it, ordered, shipped, open, purchased, received, ready, pos:pos[it.id]||[], unit, amount:open*unit, cur:q.currency||full.currency||'€', stock };
      line.state = openLineState(line);
      out.push(line);
    });
  });
  return out;
}

  return `

let backupState = { loading:true, list:[], err:'', msg:'', ok:true, meta:null, busy:false };
const BACKUP_KIND = { daily:'Günlük (otomatik)', manual:'Elle', 'pre-restore':'Geri yükleme öncesi' };
const BACKUP_REMIND_DAYS = 7;
function fmtBytes(n){ n = Number(n)||0; return n < 1024 ? n+' B' : n < 1048576 ? Math.round(n/1024)+' kB' : (n/1048576).toFixed(1)+' MB'; }
function fmtDateTimeTR(iso){ try{ return new Date(iso).toLocaleString('tr-TR', { timeZone:'Europe/Istanbul', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }catch(e){ return String(iso||''); } }
function daysSince(iso){ if(!iso) return null; const t = new Date(iso).getTime(); return isNaN(t) ? null : Math.floor((Date.now() - t)/86400000); }
async function loadBackupMeta(){ try{ const r = await stGet('godo:backup-meta'); return (r && r.value) ? JSON.parse(r.value) : {}; }catch(e){ return {}; } }
async function markBackupDownloaded(){
  const meta = Object.assign({}, backupState.meta || await loadBackupMeta(), { lastDownloadAt:new Date().toISOString() });
  backupState.meta = meta;
  try{ await stSet('godo:backup-meta', JSON.stringify(meta)); }catch(e){}
}
function downloadJsonFile(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type:'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function backupFileName(iso){ const d = new Date(iso||Date.now()), p = n=>String(n).padStart(2,'0'); return `godo-matrix-yedek-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }
function confirmRestore(what){
  const v = prompt(what+'\n\nMevcut verinin tamamı bu yedekle DEĞİŞTİRİLECEK. Değiştirilmeden önce mevcut hâlin ayrıca yedeği alınır.\nDevam etmek için GERİ YÜKLE yaz:');
  return v!==null && v.trim().toLocaleUpperCase('tr-TR') === 'GERİ YÜKLE';
}
async function finishRestore(){
  alert('Geri yükleme tamamlandı. Önceki durum "Geri yükleme öncesi" yedeği olarak saklandı. Sayfa yenileniyor.');
  clearLocalCaches(); location.reload();
}

function refreshBackupBody(){
  const el = document.getElementById('bkBody'); if(!el) return;
  el.innerHTML = renderBackupBody();
  const setMsg = (m, ok)=>{ backupState.msg = m; backupState.ok = ok; };
  const nowBtn = document.getElementById('bk-now');
  if(nowBtn) nowBtn.onclick = async ()=>{
    backupState.busy = true; refreshBackupBody();
    const { error } = await sb.rpc('backup_now');
    backupState.busy = false;
    setMsg(error ? 'Yedek alınamadı: '+error.message : 'Yedek alındı.', !error);
    await loadBackups();
  };
  el.querySelectorAll('[data-bk-dl]').forEach(b=>{ b.onclick = async ()=>{
    const id = Number(b.dataset.bkDl), info = backupState.list.find(x=>Number(x.id)===id) || {};
    const { data, error } = await sb.rpc('backup_get', { p_id:id });
    if(error || !data){ setMsg('İndirilemedi: '+((error&&error.message)||'boş yanıt'), false); refreshBackupBody(); return; }
    downloadJsonFile(backupFileName(info.created_at), { format:'godo-matrix-backup', version:1, createdAt:info.created_at||null, kind:info.kind||null, rowCount:Object.keys(data).length, data });
    await markBackupDownloaded();
    setMsg('Yedek bilgisayarına indirildi. Dosyayı güvenli bir yerde (ör. iCloud / Google Drive) sakla; içinde tüm iş verin var.', true); refreshBackupBody();
  }; });
  el.querySelectorAll('[data-bk-restore]').forEach(b=>{ b.onclick = async ()=>{
    if(!confirmRestore(b.dataset.bkWhen+' tarihli yedek geri yüklenecek.')) return;
    const { error } = await sb.rpc('backup_restore', { p_id:Number(b.dataset.bkRestore) });
    if(error){ setMsg('Geri yüklenemedi: '+error.message, false); refreshBackupBody(); return; }
    await finishRestore();
  }; });
  const file = document.getElementById('bk-file');
  if(file) file.onchange = e=>{
    const f = e.target.files && e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let obj; try{ obj = JSON.parse(reader.result); }catch(err){ setMsg('Dosya okunamadı: geçerli bir yedek dosyası değil.', false); refreshBackupBody(); return; }
      if(!obj || obj.format!=='godo-matrix-backup' || !obj.data || typeof obj.data!=='object'){ setMsg('Bu dosya Yedekler sayfasından indirilmiş bir Godo Matrix yedeği değil. (Kenar çubuğundaki eski "Yedek Al" dosyaları o menüdeki "Geri Yükle" ile açılır.)', false); refreshBackupBody(); return; }
      const n = Object.keys(obj.data).length;
      if(!confirmRestore('Dosya: '+f.name+'\nYedek tarihi: '+(obj.createdAt ? fmtDateTimeTR(obj.createdAt) : 'bilinmiyor')+' · '+n+' kayıt')) return;
      const { error } = await sb.rpc('backup_restore_json', { p_data:obj.data });
      if(error){ setMsg('Geri yüklenemedi: '+error.message, false); refreshBackupBody(); return; }
      await finishRestore();
    };
    reader.readAsText(f);
  };
}
async function loadBackups(){
  backupState.loading = true;
  try{ const { data, error } = await sb.rpc('backup_list'); if(error) throw error; backupState.list = data || []; backupState.err = ''; }
  catch(e){ backupState.err = (e && e.message) || 'bilinmeyen hata'; }
  backupState.meta = await loadBackupMeta();
  backupState.loading = false; refreshBackupBody();
}

/* ---------------- KAMPANYA (tanıtım maili dizisi: 0 → 3 → 7 → 15 → 35. gün, 42. gün cevap yoksa pasif) ---------------- */
let outreachRows = [], outreachErr = '', campFilter = 'aktif', campSearch = '';
const CAMP_STEP_LABEL = ['Henüz gönderilmedi','Tanıtım gönderildi','1. hatırlatma gönderildi','2. hatırlatma gönderildi','3. hatırlatma gönderildi','Son hatırlatma gönderildi'];
const CAMP_NEXT_LABEL = ['Tanıtım maili','1. hatırlatma (3. gün)','2. hatırlatma (7. gün)','3. hatırlatma (15. gün)','Son hatırlatma (35. gün)','Pasife alınacak (42. gün)'];
const CAMP_STATUS = { aktif:'Dizide', yanit:'Yanıt verdi', pasif:'Pasif · cevap vermiyor', cikis:'Çıkış istedi', iptal:'İptal' };
const CAMP_HIST = { tanitim:'Tanıtım maili', hatirlatma1:'1. hatırlatma', hatirlatma2:'2. hatırlatma', hatirlatma3:'3. hatırlatma', son_hatirlatma:'Son hatırlatma', cevap:'Cevap geldi', pasif:'Pasife alındı', cikis:'Çıkış istedi', aktif:'Yeniden aktif', not:'Not' };

function campIsDue(r){ return r.status==='aktif' && (r.step===0 || (r.next_due_at && r.next_due_at <= todayStr())); }
async function loadOutreach(){
  await loadCampaigns();
  try{ const { data, error } = await sb.from('outreach').select('*').order('created_at', { ascending:false }); if(error) throw error; outreachRows = data || []; outreachErr = ''; }
  catch(e){ outreachErr = (e && e.message) || 'okunamadı'; }
  if(!outreachErr) await syncOutreachCustomers();
}
// Kampanya kaydı ↔ Matrix carisi: aday cariyi aç/bağla, aşamayı ve son temas tarihini güncel tut
async function syncOutreachCustomers(){
  let changed = false; const links = [];
  const byEmail = new Map(); customers.forEach(c=>(c.contacts||[]).forEach(ct=>{ if(ct.email) byEmail.set(String(ct.email).toLowerCase(), c); }));
  for(const r of outreachRows){
    let c = r.customer_id ? customers.find(x=>x.id===r.customer_id) : null;
    if(!c) c = byEmail.get(String(r.email).toLowerCase()) || customers.find(x=>foldTR(x.name||'')===foldTR(r.company||''));
    if(!c){
      c = Object.assign(emptyCustomer(), { id:crypto.randomUUID(), name:upperCompanyName(r.company||''), stage:'Aday', source:'Apollo · Kampanya', tags:['Kampanya'], contacts:[] });
      customers.push(c); changed = true;
    }
    if(!(c.contacts||[]).some(ct=>String(ct.email||'').toLowerCase()===String(r.email).toLowerCase())){
      c.contacts = (c.contacts||[]).concat([{ id:crypto.randomUUID(), name:r.name||'', title:r.title||'', phone:r.phone||'', email:r.email, linkedin:r.linkedin||'' }]); changed = true;
    }
    const want = r.status==='cikis' ? 'Aranmayacak' : r.status==='yanit' ? 'İletişimde' : r.status==='pasif' ? 'Pasif' : 'Aday';
    const soft = ['', 'Aday', 'Pasif'];                                   // ileri aşamadaki (İlgili, Teklif, Müşteri…) cari geri çekilmez
    if(c.stage!==want && (r.status==='cikis' || soft.includes(c.stage||''))){ c.stage = want; changed = true; }
    const last = r.last_sent_at ? String(r.last_sent_at).slice(0,10) : '';
    if(last && (!c.lastContactDate || c.lastContactDate < last)){ c.lastContactDate = last; changed = true; }
    if(r.customer_id!==c.id){ r.customer_id = c.id; links.push(r); }
  }
  if(changed) await saveCustomers();
  for(const r of links){ try{ await sb.from('outreach').update({ customer_id:r.customer_id, updated_at:new Date().toISOString() }).eq('id', r.id); }catch(e){} }
}
async function campUpdate(r, patch, hist){
  const history = (r.history||[]).concat(hist ? [Object.assign({ at:new Date().toISOString() }, hist)] : []);
  const { error } = await sb.from('outreach').update(Object.assign({}, patch, { history, updated_at:new Date().toISOString() })).eq('id', r.id);
  if(error){ alert('Kaydedilemedi: '+error.message); return false; }
  await loadOutreach(); refreshCampBody(); return true;
}

function renderCampaignBody(){
  if(outreachErr) return `<p class="hint" style="color:var(--danger);">Kampanya kayıtları okunamadı: ${escapeHtml(outreachErr)}</p>`;
  const all = outreachRows, sent = all.filter(r=>r.step>=1), cnt = {
    aktif:all.filter(r=>r.status==='aktif').length, vade:all.filter(campIsDue).length, yanit:all.filter(r=>r.status==='yanit').length,
    pasif:all.filter(r=>r.status==='pasif').length, cikis:all.filter(r=>r.status==='cikis').length, '':all.length };
  const rate = sent.length ? Math.round(cnt.yanit / sent.length * 100) : 0;
  let list = all.filter(r=> campFilter==='' ? true : campFilter==='vade' ? campIsDue(r) : r.status===campFilter);
  if(campCampaignFilter) list = list.filter(r=>r.campaign_id===campCampaignFilter);
  if(campSearch){ const q = foldTR(campSearch.trim()); list = list.filter(r=>foldTR([r.name,r.company,r.email,r.title].join(' ')).includes(q)); }
  list = list.slice().sort((a,b)=> (campIsDue(b)-campIsDue(a)) || String(a.next_due_at||'9999').localeCompare(String(b.next_due_at||'9999')) || String(b.created_at).localeCompare(String(a.created_at)));
  const funnel = [1,2,3,4,5].map(s=>all.filter(r=>r.status==='aktif' && r.step===s).length);
  const FILTERS = [['aktif','Dizide'],['vade','Bugün vadesi gelen'],['yanit','Yanıt verdi'],['pasif','Pasif'],['cikis','Çıkış istedi'],['','Tümü']];
  const chip = st=>`<span class="stage-chip st-${st==='yanit'?'hazir':st==='aktif'?'sevk':'tedarik'}">${escapeHtml(CAMP_STATUS[st]||st)}</span>`;
  return renderCampaignCards() + `
    <div class="subhead" style="margin-top:4px;">Kişiler</div>
    <div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin:0 0 16px;">
      <div class="kpi-card"><div class="kpi-label">Dizide</div><div class="kpi-value">${cnt.aktif}</div><div class="kpi-sub">aktif kişi</div></div>
      <div class="kpi-card"><div class="kpi-label">Bugün Vadesi Gelen</div><div class="kpi-value" style="color:${cnt.vade?'var(--danger)':'var(--ink)'};">${cnt.vade}</div><div class="kpi-sub">gönderim / pasife alma</div></div>
      <div class="kpi-card"><div class="kpi-label">Yanıt Verdi</div><div class="kpi-value">${cnt.yanit}</div><div class="kpi-sub">yanıt oranı %${rate} (${sent.length} kişiye mail gitti)</div></div>
      <div class="kpi-card"><div class="kpi-label">Pasif / Çıkış</div><div class="kpi-value">${cnt.pasif} / ${cnt.cikis}</div><div class="kpi-sub">cevap vermiyor / almak istemiyor</div></div>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;font-size:11.5px;color:var(--gray-500);">Dizideki dağılım:
      ${['Tanıtım','1. hatırlatma','2. hatırlatma','3. hatırlatma','Son hatırlatma'].map((l,i)=>`<span class="mono" style="padding:2px 8px;border:1px solid var(--hairline-strong);border-radius:10px;">${l}: <b>${funnel[i]}</b></span>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">${FILTERS.map(([k,l])=>`<span class="version-pill ${campFilter===k?'active':''}" data-camp-filter="${k}">${l} (${cnt[k]||0})</span>`).join('')}
      ${campaigns.length>1 ? `<select id="campCampaignSel" style="padding:5px 8px;font-size:12px;margin-left:auto;"><option value="">Tüm kampanyalar</option>${campaigns.map(c=>`<option value="${c.id}" ${campCampaignFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select>` : ''}</div>
    ${list.length ? `<table class="items-table"><thead><tr><th>Kişi</th><th>Firma</th><th>E-posta</th><th>Aşama</th><th>Sonraki adım</th><th>Durum</th><th></th></tr></thead><tbody>
      ${list.map(r=>`<tr>
        <td><b style="font-size:12.5px;">${escapeHtml(r.name||'')}</b><div style="font-size:11px;color:var(--gray-500);">${escapeHtml(r.title||'')}</div></td>
        <td style="font-size:12px;">${escapeHtml(upperCompanyName(r.company||''))}</td>
        <td class="mono" style="font-size:11.5px;">${escapeHtml(r.email||'')}</td>
        <td style="font-size:11.5px;">${escapeHtml(CAMP_STEP_LABEL[r.step]||'')}${r.first_sent_at?`<div style="font-size:10.5px;color:var(--gray-500);">ilk mail ${escapeHtml(formatDate(String(r.first_sent_at).slice(0,10)))}</div>`:''}</td>
        <td style="font-size:11.5px;">${r.status==='aktif' ? `${escapeHtml(CAMP_NEXT_LABEL[r.step]||'')}${r.next_due_at?`<div style="font-size:10.5px;">${escapeHtml(formatDate(r.next_due_at))} ${dueBadgeHtml(r.next_due_at,false)}</div>`:'<div style="font-size:10.5px;color:var(--danger);">gönderilmeyi bekliyor</div>'}` : '<span style="color:var(--gray-300);">—</span>'}</td>
        <td>${chip(r.status)}</td>
        <td style="white-space:nowrap;text-align:right;">
          <span data-camp-hist="${r.id}" class="camp-act">Geçmiş</span>
          ${r.status==='aktif' ? `<span data-camp-reply="${r.id}" class="camp-act">Cevap geldi</span>` : ''}
          ${r.status==='aktif' ? `<span data-camp-passive="${r.id}" class="camp-act">Pasife al</span>` : r.status==='pasif' ? `<span data-camp-reactivate="${r.id}" class="camp-act">Aktife al</span>` : ''}
          ${r.status!=='cikis' ? `<span data-camp-optout="${r.id}" class="camp-act" style="color:var(--danger);">Çıkış</span>` : ''}
          ${r.customer_id ? `<span data-camp-cust="${escapeAttr(r.customer_id)}" class="camp-act" style="color:var(--ink);">Cari</span>` : ''}
        </td></tr>`).join('')}
    </tbody></table>` : `<p class="hint">${(campSearch||campFilter) ? 'Filtreyle eşleşen kayıt yok.' : 'Henüz kampanyaya eklenmiş kişi yok. Kişiler kampanya sohbetinde Apollo\'dan bulunup eklenir.'}</p>`}`;
}
function refreshCampBody(){
  const el = document.getElementById('campBody'); if(!el) return;
  el.innerHTML = renderCampaignBody();
  const byId = id=>outreachRows.find(r=>r.id===id);
  el.querySelectorAll('[data-camp-filter]').forEach(p=>{ p.onclick = ()=>{ campFilter = p.dataset.campFilter; refreshCampBody(); }; });
  bindCampaignCards(el);
  const csel = el.querySelector('#campCampaignSel'); if(csel) csel.onchange = e=>{ campCampaignFilter = e.target.value; refreshCampBody(); };
  el.querySelectorAll('[data-camp-hist]').forEach(b=>{ b.onclick = ()=>openCampHistory(byId(b.dataset.campHist)); });
  el.querySelectorAll('[data-camp-reply]').forEach(b=>{ b.onclick = async ()=>{ const r = byId(b.dataset.campReply); if(!confirm(r.name+' cevap verdi olarak işaretlensin mi? Dizi durur.')) return; await campUpdate(r, { status:'yanit', replied_at:new Date().toISOString(), next_due_at:null }, { kind:'cevap', note:'Elle işaretlendi' }); }; });
  el.querySelectorAll('[data-camp-passive]').forEach(b=>{ b.onclick = async ()=>{ const r = byId(b.dataset.campPassive); if(!confirm(r.name+' pasife alınsın mı? Hatırlatmalar durur.')) return; await campUpdate(r, { status:'pasif', next_due_at:null }, { kind:'pasif', note:'Elle pasife alındı' }); }; });
  el.querySelectorAll('[data-camp-reactivate]').forEach(b=>{ b.onclick = async ()=>{ const r = byId(b.dataset.campReactivate); if(!confirm(r.name+' yeniden diziye alınsın mı? Sıradaki adım bugün vadeli olur.')) return; await campUpdate(r, { status:'aktif', next_due_at:todayStr() }, { kind:'aktif' }); }; });
  el.querySelectorAll('[data-camp-optout]').forEach(b=>{ b.onclick = async ()=>{ const r = byId(b.dataset.campOptout); if(!confirm(r.name+' bir daha mail almak istemiyor olarak işaretlensin mi? Bu kişiye kampanyadan mail gitmez, cari "Aranmayacak" olur.')) return; await campUpdate(r, { status:'cikis', next_due_at:null }, { kind:'cikis' }); }; });
  el.querySelectorAll('[data-camp-cust]').forEach(b=>{ b.onclick = ()=>{ selectedCustomerId = b.dataset.campCust; activeTab = 'customerDetail'; render(); }; });
}
function openCampHistory(r){
  if(!r) return;
  const h = (r.history||[]).slice().reverse();
  const ov = openSimpleModal(`<h2>${escapeHtml(r.name||'')} — ${escapeHtml(upperCompanyName(r.company||''))}</h2>
    <p class="hint">${escapeHtml(r.email||'')} · ${escapeHtml(CAMP_STATUS[r.status]||r.status)} · ${escapeHtml(CAMP_STEP_LABEL[r.step]||'')}</p>
    ${h.length ? `<table class="items-table"><thead><tr><th>Tarih</th><th>Olay</th><th>Ayrıntı</th></tr></thead><tbody>
      ${h.map(e=>`<tr><td class="mono" style="font-size:11.5px;white-space:nowrap;">${escapeHtml(fmtDateTimeTR(e.at))}</td><td style="font-size:12px;">${escapeHtml(CAMP_HIST[e.kind]||e.kind||'')}</td><td style="font-size:11.5px;color:var(--gray-500);">${escapeHtml(e.subject||e.snippet||e.note||'')}</td></tr>`).join('')}
    </tbody></table>` : '<p class="hint">Henüz gönderim yok.</p>'}
    <div class="actions-row" style="margin-top:14px;"><button class="btn btn-ghost" id="ch-close">Kapat</button></div>`, 760);
  ov.querySelector('#ch-close').onclick = ()=>ov.remove();
}
function attachCampaignShell(){
  const s = document.getElementById('campSearch');
  if(s) s.oninput = e=>{ campSearch = e.target.value; refreshCampBody(); };
}

/* ---------------- KAMPANYA TANIMLARI (şablonlar, imza, ek dosya) ---------------- */
let campaigns = [], campaignsErr = '', campCampaignFilter = '';
const CAMP_OPTOUT = 'Bu konuda yeniden iletişime geçmemizi istemezseniz bu e-postayı "istemiyorum" diye yanıtlamanız yeterli.';
const CAMP_STEP_NAMES = ['Tanıtım maili','1. hatırlatma','2. hatırlatma','3. hatırlatma','Son hatırlatma'];
const CAMP_STATUS_LABEL = { taslak:'Taslak', aktif:'Aktif', durduruldu:'Durduruldu' };
const CAMP_SAMPLE = { name:'Cafer Usta', company:'Ustaoğlu Holding', greeting:'Merhaba Cafer Bey' };
async function loadCampaigns(){
  try{ const { data, error } = await sb.from('campaigns').select('*').order('created_at', { ascending:true }); if(error) throw error; campaigns = data || []; campaignsErr = ''; }
  catch(e){ campaignsErr = (e && e.message) || 'okunamadı'; }
}
// Şablon metnini kişiye göre doldurur ve e-posta HTML'ine çevirir (gönderim tarafı da aynı kurala uyacak)
function campFillText(text, c){
  const first = String((c && c.name) || '').trim().split(/\s+/)[0] || '';
  return String(text||'').replace(/\{Selamlama\}/g, (c && c.greeting) || ('Merhaba '+first).trim()).replace(/\{Ad\}/g, first).replace(/\{Firma\}/g, (c && c.company) || '');
}
function campTextToHtml(text){
  return String(text||'').split(/\n{2,}/).map(p=>`<p style="margin:0 0 14px 0;">${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}
function campEmailHtml(campaign, step, contact){
  return `<div style="font-family:Arial, Helvetica, sans-serif;font-size:14px;line-height:1.6;color:#12151a;">${campTextToHtml(campFillText(step.body, contact))}</div>`
    + (campaign.signature_html ? `<div style="margin-top:18px;">${campaign.signature_html}</div>` : '')
    + (step.optout ? `<p style="font-family:Arial, Helvetica, sans-serif;font-size:11px;color:#9aa2b0;margin:22px 0 0 0;">${escapeHtml(CAMP_OPTOUT)}</p>` : '');
}
function campStats(cid){
  const rows = outreachRows.filter(r=>r.campaign_id===cid);
  return { total:rows.length, aktif:rows.filter(r=>r.status==='aktif').length, yanit:rows.filter(r=>r.status==='yanit').length, pasif:rows.filter(r=>r.status==='pasif').length };
}
function renderCampaignCards(){
  if(campaignsErr) return `<p class="hint" style="color:var(--danger);">Kampanyalar okunamadı: ${escapeHtml(campaignsErr)}</p>`;
  return `<div class="subhead-row" style="margin-bottom:8px;"><div class="subhead" style="margin:0;">Kampanyalar</div><button class="btn btn-ghost" id="campNew" style="padding:6px 12px;font-size:12px;">+ Yeni Kampanya</button></div>
    ${campaigns.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:24px;">${campaigns.map(c=>{ const st = campStats(c.id), steps = Array.isArray(c.steps) ? c.steps : [];
      const needsFile = steps.some(s=>s.attach) && !c.attachment_path;
      return `<div class="kpi-card" style="text-align:left;">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;"><b style="font-size:13.5px;">${escapeHtml(c.name)}</b>
          <span class="stage-chip st-${c.status==='aktif'?'hazir':c.status==='taslak'?'tedarik':'sevk'}">${escapeHtml(CAMP_STATUS_LABEL[c.status]||c.status)}</span></div>
        ${c.description ? `<div style="font-size:11.5px;color:var(--gray-500);margin:6px 0;line-height:1.5;">${escapeHtml(c.description)}</div>` : ''}
        <div style="font-size:11.5px;margin-top:6px;">${steps.length} adım (${steps.map(s=>s.day).join(' · ')}. gün) · günde en çok <b>${c.daily_limit}</b> yeni kişi</div>
        <div style="font-size:11.5px;margin-top:4px;color:${needsFile?'var(--danger)':'var(--gray-500)'};">${c.attachment_path ? 'Ek: '+escapeHtml(c.attachment_name||'')+' ('+fmtBytes(c.attachment_size||0)+')' : needsFile ? 'Tanıtım maili ek istiyor ama PDF yüklenmedi' : 'Ek yok'}</div>
        <div style="font-size:11.5px;margin-top:4px;">Kişi: <b>${st.total}</b> · dizide ${st.aktif} · yanıt ${st.yanit} · pasif ${st.pasif}</div>
        <div style="margin-top:10px;"><span class="camp-act" style="margin-left:0;" data-camp-edit="${c.id}">Düzenle</span>
          ${c.status!=='aktif' ? `<span class="camp-act" data-camp-status="${c.id}|aktif" style="color:var(--ink);">Başlat</span>` : `<span class="camp-act" data-camp-status="${c.id}|durduruldu">Durdur</span>`}
          ${st.total ? '' : `<span class="camp-act" data-camp-del="${c.id}" style="color:var(--danger);">Sil</span>`}</div>
      </div>`; }).join('')}</div>` : '<p class="hint">Henüz kampanya yok.</p>'}`;
}
function bindCampaignCards(el){
  const q = s=>el.querySelectorAll(s);
  const nb = el.querySelector('#campNew'); if(nb) nb.onclick = ()=>openCampaignEditor(null);
  q('[data-camp-edit]').forEach(b=>{ b.onclick = ()=>openCampaignEditor(campaigns.find(c=>c.id===b.dataset.campEdit)); });
  q('[data-camp-status]').forEach(b=>{ b.onclick = async ()=>{
    const [id, st] = b.dataset.campStatus.split('|'), c = campaigns.find(x=>x.id===id);
    if(st==='aktif' && (c.steps||[]).some(s=>s.attach) && !c.attachment_path){ alert('Tanıtım maili ek istiyor ama PDF yüklenmedi. Önce Düzenle\'den PDF\'i yükle.'); return; }
    if(!confirm(c.name+(st==='aktif' ? ' başlatılsın mı? Günlük oturumlarda bu kampanyaya kişi eklenmeye başlanır.' : ' durdurulsun mu? Yeni kişi eklenmez; dizideki kişilerin hatırlatmaları da bekletilir.'))) return;
    const { error } = await sb.from('campaigns').update({ status:st, updated_at:new Date().toISOString() }).eq('id', id);
    if(error){ alert('Kaydedilemedi: '+error.message); return; }
    await loadCampaigns(); refreshCampBody();
  }; });
  q('[data-camp-del]').forEach(b=>{ b.onclick = async ()=>{
    const c = campaigns.find(x=>x.id===b.dataset.campDel); if(!confirm(c.name+' silinsin mi?')) return;
    if(c.attachment_path){ try{ await sb.storage.from('campaign-files').remove([c.attachment_path]); }catch(e){} }
    const { error } = await sb.from('campaigns').delete().eq('id', c.id); if(error){ alert('Silinemedi: '+error.message); return; }
    await loadCampaigns(); refreshCampBody();
  }; });
}
function openCampaignEditor(src){
  const isNew = !src;
  const c = JSON.parse(JSON.stringify(src || { name:'', description:'', status:'taslak', daily_limit:5, signature_html:'', steps:[0,3,7,15,35].map((d,i)=>({ day:d, subject:i===0?'':'', body:'{Selamlama},\n\n', attach:i===0, optout:i<4 })) }));
  if(!Array.isArray(c.steps)) c.steps = [];
  let cur = 0, pendingFile = null;
  const ov = openSimpleModal('', 1180);
  const draw = ()=>{
    const s = c.steps[cur] || {};
    ov.firstElementChild.innerHTML = `
      <h2>${isNew ? 'Yeni Kampanya' : 'Kampanyayı Düzenle'}</h2>
      <div class="grid3">
        <div class="field"><label>Kampanya adı</label><input id="ce-name" value="${escapeAttr(c.name||'')}"></div>
        <div class="field"><label>Günde en çok yeni kişi</label><input id="ce-limit" type="number" min="1" max="50" value="${escapeAttr(String(c.daily_limit||5))}"></div>
        <div class="field"><label>Durum</label><select id="ce-status">${['taslak','aktif','durduruldu'].map(k=>`<option value="${k}" ${c.status===k?'selected':''}>${CAMP_STATUS_LABEL[k]}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Hedef kitle / açıklama</label><input id="ce-desc" value="${escapeAttr(c.description||'')}" placeholder="Ör. Ege bölgesi gıda üreticileri; bakım ve satınalma müdürleri"></div>
      <div style="display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap;">${c.steps.map((st,i)=>`<span class="version-pill ${i===cur?'active':''}" data-ce-step="${i}">${st.day}. gün · ${CAMP_STEP_NAMES[i]||'Adım '+(i+1)}</span>`).join('')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;">
        <div>
          <div class="field"><label>Konu</label>${cur===0 ? `<input id="ce-subject" value="${escapeAttr(s.subject||'')}">` : `<input value="Re: ${escapeAttr((c.steps[0]||{}).subject||'')}" disabled title="Hatırlatmalar aynı dizinin cevabı olarak gider">`}</div>
          <div class="field"><label>Metin <span style="font-weight:400;color:var(--gray-500);">— {Selamlama} = "Merhaba Cafer Bey" / "Sayın Deniz Yılmaz"; {Ad}, {Firma} de kullanılabilir</span></label>
            <textarea id="ce-body" rows="16" style="width:100%;font-family:inherit;font-size:13px;line-height:1.55;">${escapeHtml(s.body||'')}</textarea></div>
          <label style="font-size:12px;display:block;margin:4px 0;"><input type="checkbox" id="ce-optout" ${s.optout?'checked':''}> Sonuna "almak istemiyorum" satırını ekle</label>
          ${cur===0 ? `<label style="font-size:12px;display:block;margin:4px 0;"><input type="checkbox" id="ce-attach" ${s.attach?'checked':''}> Bu maile PDF eki ekle</label>
            <div class="field" style="margin-top:8px;"><label>Ek dosya (PDF)</label>
              <div style="font-size:12px;margin-bottom:6px;">${pendingFile ? 'Yüklenecek: <b>'+escapeHtml(pendingFile.name)+'</b> ('+fmtBytes(pendingFile.size)+')' : c.attachment_path ? 'Yüklü: <b>'+escapeHtml(c.attachment_name||'')+'</b> ('+fmtBytes(c.attachment_size||0)+')' : '<span style="color:var(--danger);">Henüz yüklenmedi</span>'}</div>
              <input type="file" id="ce-file" accept="application/pdf,.pdf"></div>` : ''}
          <details style="margin-top:10px;"><summary style="font-size:12px;cursor:pointer;color:var(--gray-500);">İmza (HTML)</summary><textarea id="ce-sig" rows="6" class="code-editor" style="width:100%;margin-top:6px;font-size:11px;">${escapeHtml(c.signature_html||'')}</textarea></details>
        </div>
        <div><div style="font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">Önizleme · ${escapeHtml(CAMP_SAMPLE.name)} (${escapeHtml(CAMP_SAMPLE.company)})</div>
          <iframe id="ce-preview" sandbox="" style="width:100%;height:560px;border:1px solid var(--hairline-strong);border-radius:4px;background:#fff;"></iframe>
          <div style="font-size:10.5px;color:var(--gray-500);margin-top:4px;">Önizlemede logo güvenlik ayarı nedeniyle gösterilmeyebilir; gerçek mailde görünür.</div></div>
      </div>
      <div class="actions-row" style="margin-top:16px;"><button class="btn btn-primary" id="ce-save">Kaydet</button><button class="btn btn-ghost" id="ce-cancel">Vazgeç</button></div>`;
    const $ = id=>ov.querySelector('#'+id);
    const pull = ()=>{
      c.name = $('ce-name').value.trim(); c.description = $('ce-desc').value.trim(); c.status = $('ce-status').value;
      c.daily_limit = Math.max(1, Math.min(50, parseInt($('ce-limit').value)||5)); c.signature_html = $('ce-sig').value;
      const st = c.steps[cur]; if(!st) return;
      st.body = $('ce-body').value; st.optout = $('ce-optout').checked;
      if(cur===0){ st.subject = $('ce-subject').value; st.attach = $('ce-attach').checked; }
    };
    const preview = ()=>{ pull(); $('ce-preview').srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:14px;">'+campEmailHtml(c, c.steps[cur], CAMP_SAMPLE)+'</body>'; };
    ov.querySelectorAll('input,textarea,select').forEach(i=>i.addEventListener('input', preview));
    ov.querySelectorAll('[data-ce-step]').forEach(p=>{ p.onclick = ()=>{ pull(); cur = +p.dataset.ceStep; draw(); }; });
    const f = $('ce-file'); if(f) f.onchange = e=>{ const file = e.target.files[0]; if(!file) return;
      if(file.type!=='application/pdf' && !/\.pdf$/i.test(file.name)){ alert('Yalnızca PDF yüklenebilir.'); return; }
      if(file.size > 10*1024*1024){ alert('PDF en fazla 10 MB olabilir.'); return; }
      pull(); pendingFile = file; draw(); };
    $('ce-cancel').onclick = ()=>ov.remove();
    $('ce-save').onclick = async ()=>{
      pull();
      if(!c.name){ alert('Kampanya adı gerekli.'); return; }
      if(!(c.steps[0]||{}).subject){ alert('Tanıtım mailinin konusu gerekli.'); return; }
      if(c.steps.some(st=>!/\{Selamlama\}/.test(st.body||''))){ alert('Her adımın metninde {Selamlama} geçmeli (hitap oradan gelir).'); return; }
      const payload = { name:c.name, description:c.description||null, status:c.status, daily_limit:c.daily_limit, steps:c.steps, signature_html:c.signature_html||null, updated_at:new Date().toISOString() };
      let id = c.id;
      if(isNew){ const { data, error } = await sb.from('campaigns').insert(payload).select('id').single(); if(error){ alert('Kaydedilemedi: '+error.message); return; } id = data.id; }
      else { const { error } = await sb.from('campaigns').update(payload).eq('id', id); if(error){ alert('Kaydedilemedi: '+error.message); return; } }
      if(pendingFile){
        const safe = pendingFile.name.normalize('NFKD').replace(/[^\w.\-]+/g,'_').slice(-80);
        const path = currentUser.id+'/'+id+'/'+safe;
        const up = await sb.storage.from('campaign-files').upload(path, pendingFile, { upsert:true, contentType:'application/pdf' });
        if(up.error){ alert('PDF yüklenemedi: '+up.error.message); return; }
        if(c.attachment_path && c.attachment_path!==path){ try{ await sb.storage.from('campaign-files').remove([c.attachment_path]); }catch(e){} }
        const { error } = await sb.from('campaigns').update({ attachment_path:path, attachment_name:pendingFile.name, attachment_size:pendingFile.size }).eq('id', id);
        if(error){ alert('Ek bilgisi kaydedilemedi: '+error.message); return; }
      }
      ov.remove(); await loadCampaigns(); refreshCampBody();
    };
    preview();
  };
  draw();
}

let stockMoves = [];
let lastStockImport = null;
let stockSearch = '';
let stockOnlyAlerts = false;
let stockShowZero = false;
let stockReservedCache = null;      // { at, map }
const STOCK_TYPE_LABEL = { acilis:'Açılış', giris:'Giriş', cikis:'Çıkış', sayim:'Sayım düzeltme' };
const STOCK_HEADER_RULES = [
  [/^(urunkodu|stokkodu|malzemekodu|kod|code|sku|partno|partnumber|mlfb|urunno|referans)$/, 'code'],
  [/^(miktar|adet|stok|stokmiktari|stokadedi|quantity|qty|acilisstoku|bakiye|mevcut)$/, 'qty'],
  [/^(birimmaliyet|maliyet|alisfiyati|alisbirimfiyati|birimfiyat|cost|unitcost|unitprice|price|fiyat)$/, 'cost'],
  [/^(parabirimi|doviz|currency|pb|para)$/, 'currency'],
  [/^(minimum|minstok|minimumstok|minseviye|min|minimumseviye|emniyetstogu)$/, 'min'],
  [/^(aciklama|description|desc|urunadi|urunaciklamasi|ad|tanim)$/, 'desc']
];
const STOCK_FIELDS = [{key:'code',label:'Ürün Kodu'},{key:'qty',label:'Miktar'},{key:'cost',label:'Birim Maliyet'},{key:'currency',label:'Para Birimi'},{key:'min',label:'Minimum Stok'},{key:'desc',label:'Açıklama'}];

async function saveStockMoves(){ await stSet('godo:stock-moves', JSON.stringify(stockMoves)); }
function parseQty(s){
  let t = String(s==null?'':s).trim();
  if(!t) return NaN;
  if(/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g,'');     // 1.000 → 1000 (Türkçe binlik)
  const n = parseFloat(parseTRNumber(t));
  return isNaN(n) ? NaN : n;
}
function normCurrency(s, fallback){
  const k = foldKey(s);
  if(['eur','euro','e'].includes(k) || String(s).includes('€')) return '€';
  if(['usd','dolar','dollar'].includes(k) || String(s).includes('$')) return '$';
  if(['try','tl','trl','lira'].includes(k) || String(s).includes('₺')) return '₺';
  return fallback || '€';
}
function fmtQty(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('tr-TR'); }
function productCodeMap(){
  const m = new Map();
  products.forEach(p=>{ const k = foldTR((p.code||'').trim()); if(k && !m.has(k)) m.set(k, p); });
  return m;
}
function isStockTracked(p){ return stockMoves.some(m=>m.productId===p.id) || (parseFloat(p.minStock)||0) > 0; }

// FIFO: girişler katman olur, çıkışlar en eski katmandan düşer; stok eksiye inerse açık kalır
function fifoState(productId){
  const moves = stockMoves.filter(m=>m.productId===productId).slice().sort((a,b)=>
    (a.date||'').localeCompare(b.date||'') || (a.createdAt||'').localeCompare(b.createdAt||''));
  const layers = []; let shortage = 0;
  moves.forEach(m=>{
    let q = Number(m.qty)||0;
    if(q > 0){
      if(shortage > 0){ const used = Math.min(shortage, q); shortage -= used; q -= used; }
      if(q > 0) layers.push({ qty:q, unitCost:Number(m.unitCost)||0, currency:m.currency||'€', date:m.date });
    } else if(q < 0){
      let need = -q;
      while(need > 1e-9 && layers.length){
        const L = layers[0]; const take = Math.min(L.qty, need);
        L.qty -= take; need -= take;
        if(L.qty <= 1e-9) layers.shift();
      }
      if(need > 1e-9) shortage += need;
    }
  });
  const onHand = layers.reduce((s,l)=>s+l.qty,0) - shortage;
  const value = {};
  layers.forEach(l=>{ value[l.currency] = (value[l.currency]||0) + l.qty*l.unitCost; });
  return { onHand, value, layers, shortage };
}
function valueText(valueByCur){
  const parts = Object.entries(valueByCur).filter(([,v])=>Math.abs(v)>0.005).map(([c,v])=>c+' '+fmt(v));
  return parts.length ? parts.join(' · ') : '—';
}

// Rezerve: siparişe dönüşmüş, henüz sevk edilmemiş siparişlerin kalem miktarları
async function computeReservedMap(force){
  if(!force && stockReservedCache && Date.now()-stockReservedCache.at < 30000) return stockReservedCache.map;
  const map = {};
  const codes = productCodeMap();
  const open = quotesIndex.filter(q=>q.status==='Siparişe Dönüştü');
  for(const q of open){
    const r = await stGet('godo:quote:'+q.id);
    if(!r || !r.value) continue;
    let full; try{ full = JSON.parse(r.value); }catch(e){ continue; }
    const shp = {}; shipsOf(q.id).forEach(s=>(s.lines||[]).forEach(l=>{ const k = l.quoteItemId||l.code; shp[k] = (shp[k]||0) + (parseFloat(l.qty)||0); }));
    (full.items||[]).forEach(it=>{
      const p = (it.productId && products.find(x=>x.id===it.productId)) || codes.get(foldTR((it.code||'').trim()));
      const rem = (parseFloat(it.qty)||0) - (shp[it.id]||0);
      if(p && rem > 0) map[p.id] = (map[p.id]||0) + rem;
    });
  }
  stockReservedCache = { at: Date.now(), map };
  return map;
}
function stockRows(reserved){
  return products.filter(isStockTracked).map(p=>{
    const st = fifoState(p.id);
    const res = reserved ? (reserved[p.id]||0) : null;
    const free = res===null ? null : st.onHand - res;
    const min = parseFloat(p.minStock)||0;
    const level = free===null ? st.onHand : free;
    return { p, st, res, free, min, alert: min>0 && level < min };
  }).sort((a,b)=> (b.alert-a.alert) || (a.p.code||'').localeCompare(b.p.code||'','tr'));
}

    const cost = parseFloat($('se-cost').value); const cur = $('se-cur').value;
    const note = $('se-note').value.trim();
    const st = fifoState(p.id);
    let move;
    if(type==='acilis'){

      if(qtyIn <= 0){ alert('Açılış miktarı 0\'dan büyük olmalı.'); return; }
      move = { type:'acilis', qty:qtyIn, unitCost: isNaN(cost)?0:cost, currency:cur };
    } else {
      const diff = qtyIn - st.onHand;
      if(Math.abs(diff) < 1e-9){ alert('Sayılan miktar sistemdekiyle aynı, düzeltme gerekmiyor.'); return; }
      if(!note){ alert('Sayım düzeltmesi için not zorunlu.'); return; }
      const lastLayer = st.layers[st.layers.length-1];
      move = { type:'sayim', qty:diff, unitCost: diff>0 ? (isNaN(cost) ? (lastLayer?lastLayer.unitCost:0) : cost) : 0, currency: diff>0 && isNaN(cost) && lastLayer ? lastLayer.currency : cur };
    }
    stockMoves.push(Object.assign({ id:crypto.randomUUID(), productId:p.id, code:p.code, date, srcDoc:'', note, createdAt:new Date().toISOString() }, move));
    await saveStockMoves(); stockReservedCache = null;
    overlay.remove(); render();
  };
}

/* ---- Excel / Sheets'ten açılış stoku ---- */
function guessStockMap(headers){
  return headers.map(h=>{ const k = foldKey(h); for(const [re,f] of STOCK_HEADER_RULES){ if(re.test(k)) return f; } return 'skip'; });
}
function buildStockImportPlan(rows, map, opts){
  const codes = productCodeMap(); const byCode = new Map(); let invalid = 0;
  rows.forEach(cells=>{
    const rec = {};
    map.forEach((f,i)=>{ if(f && f!=='skip'){ const v = String(cells[i]==null?'':cells[i]).trim(); if(v && rec[f]===undefined) rec[f] = v; } });
    const code = (rec.code||'').trim(); if(!code) return;
    const qty = parseQty(rec.qty);
    if(!(qty > 0)){ invalid++; return; }
    const key = foldTR(code);
    let e = byCode.get(key);
    if(!e){ e = { code, desc:rec.desc||'', qty:0, costSum:0, costQty:0, min:'', currency:'' }; byCode.set(key, e); }
    e.qty += qty;
    const cost = parseQty(rec.cost);
    if(cost > 0){ e.costSum += cost*qty; e.costQty += qty; e.currency = normCurrency(rec.currency||'', opts.currency); }
    const mn = parseQty(rec.min); if(!isNaN(mn) && mn >= 0 && rec.min!==undefined) e.min = String(mn);
  });
  const entries = [];
  byCode.forEach((e,key)=>{
    e.unitCost = e.costQty > 0 ? e.costSum/e.costQty : 0;
    if(!e.currency) e.currency = opts.currency || '€';
    const p = codes.get(key);
    e.product = p || null;
    if(p) e.status = stockMoves.some(m=>m.productId===p.id) ? 'skip' : 'new';
    else e.status = opts.createProducts ? 'create' : 'nomatch';
    entries.push(e);
  });
  return { entries, invalid };
}
async function applyStockImportPlan(plan, opts){
  const batchId = crypto.randomUUID(); const moveIds = [], productIds = [], minBefore = {};
  let n = 0;
  plan.entries.forEach(e=>{
    if(e.status!=='new' && e.status!=='create') return;
    let p = e.product;
    if(!p){
      p = Object.assign(emptyProduct(), { id:crypto.randomUUID(), code:e.code, desc:e.desc||'' });
      products.push(p); productIds.push(p.id);
    }
    if(e.min!==''){ minBefore[p.id] = p.minStock||''; p.minStock = e.min; }
    const m = { id:crypto.randomUUID(), productId:p.id, code:p.code, date:opts.date, type:'acilis', qty:e.qty, unitCost:e.unitCost, currency:e.currency, srcDoc:'', note:'', batchId, createdAt:new Date().toISOString() };
    stockMoves.push(m); moveIds.push(m.id); n++;
  });
  await saveStockMoves(); await saveProducts();
  lastStockImport = { id:batchId, at:new Date().toISOString(), moveIds, productIds, minBefore };
  await stSet('godo:last-stock-import', JSON.stringify(lastStockImport));
  stockReservedCache = null;
  return { moves:n, createdProducts:productIds.length };
}
async function undoLastStockImport(){
  if(!lastStockImport) return;
  const li = lastStockImport;
  if(!confirm(`Son açılış stoku içe aktarması geri alınsın mı?\n\n• ${li.moveIds.length} stok kaydı silinecek\n• ${li.productIds.length} yeni eklenen ürün silinecek`)) return;
  const mv = new Set(li.moveIds), pr = new Set(li.productIds);
  stockMoves = stockMoves.filter(m=>!mv.has(m.id));
  products = products.filter(p=>!pr.has(p.id));
  products.forEach(p=>{ if(li.minBefore && li.minBefore[p.id]!==undefined) p.minStock = li.minBefore[p.id]; });
  await saveStockMoves(); await saveProducts();
  lastStockImport = null; await stSet('godo:last-stock-import', ''); stockReservedCache = null;
  render();
}

/* ---------------- FİRMA ADI BÜYÜK HARF + CARİ ARAMA KUTUSU ---------------- */
function upperCompanyName(name){
  // Firma adı hep büyük harf. Türkçe (i→İ) varsayılan; yabancı yasal ek (Inc, GmbH, AG...) varsa İngilizce kuralı (i→I).
  const s = String(name==null?'':name).replace(/\s+/g,' ').trim();
  if(!s) return '';
  const folded = foldTR(s);
  const turkish = /[çğıöşüÇĞİÖŞÜ]/.test(s) ||
    /\b(a\.?\s?s|sti|san|tic|sanayi|ticaret|sirketi|anonim|ve|otomasyon|makina|makine|elektrik|elektronik|insaat|gida|tekstil|muhendislik|pazarlama|danismanlik|ithalat|ihracat|mobilya|plastik|kimya|metal)\b/.test(folded);
  const foreign = /\b(inc|llc|gmbh|corp|corporation|plc|pty|bv|srl|spa|kg|ag|co|company)\b/.test(folded);
  return s.toLocaleUpperCase(!turkish && foreign ? 'en-US' : 'tr-TR');
}
async function normalizeCustomerNames(){
  // Mevcut cari adlarını bir kez büyük harfe çevirir; bağlı tekliflerin ve görevlerin ad kopyalarını da eşitler
  const renamed = new Map();
  customers.forEach(c=>{ const n = upperCompanyName(c.name); if(n && n!==c.name){ renamed.set(c.id, n); c.name = n; } });
  if(!renamed.size) return;
  await saveCustomers();
  let idxChanged = false;
  quotesIndex.forEach(q=>{ if(q.customerId && renamed.has(q.customerId) && q.customerName!==renamed.get(q.customerId)){ q.customerName = renamed.get(q.customerId); idxChanged = true; } });
  if(idxChanged) await saveIndex();
  let tasksChanged = false;
  tasks.forEach(t=>{ if(t.customerId && renamed.has(t.customerId) && t.customerName!==renamed.get(t.customerId)){ t.customerName = renamed.get(t.customerId); tasksChanged = true; } });
  if(tasksChanged) await saveTasks();
}

function attachCustomerPicker(inputId, getSelectedId, onPick){
  const input = document.getElementById(inputId);
  const list = document.getElementById(inputId+'-list');
  const clearBtn = document.getElementById(inputId+'-clear');
  if(!input || !list) return;
  let items = [], active = 0;
  const selectedName = ()=>{ const c = customers.find(x=>x.id===getSelectedId()); return c ? c.name : ''; };
  function find(q){
    const s = foldTR(q.trim());
    const cold = c=>(c.stage==='Aday'||c.stage==='Aranmayacak')?1:0;
    const starts = c=> s && foldTR(c.name||'').startsWith(s) ? 0 : 1;
    return customers.filter(c=>!s || customerMatchesSearch(c, s))
      .sort((a,b)=> starts(a)-starts(b) || cold(a)-cold(b) || (a.name||'').localeCompare(b.name||'','tr'))
      .slice(0, 8);
  }
  function show(q){
    items = find(q); active = 0;
    list.innerHTML = items.length ? items.map((c,i)=>{
      const meta = [(c.contacts||[]).length+' yetkili', [c.city,c.country].filter(Boolean).join(', ')].filter(Boolean).join(' · ');
      return `<div class="cust-picker-item ${i===0?'active':''}" data-id="${escapeAttr(c.id)}">
        <div class="cp-name">${escapeHtml(c.name)}${c.stage?` <span class="stage-pill ${STAGE_CLASS[c.stage]||''}">${escapeHtml(c.stage)}</span>`:''}</div>
        <div class="cp-meta">${escapeHtml(meta)}</div></div>`;
    }).join('') : `<div class="cust-picker-empty">Eşleşen firma yok — Cariler'den ekleyebilirsin.</div>`;
    list.style.display = 'block';
  }
  function hide(){ list.style.display = 'none'; }
  function pick(id){ hide(); onPick(id); }
  input.addEventListener('focus', ()=>{ input.select(); if(!input.value) show(''); else if(input.value!==selectedName()) show(input.value); });
  input.addEventListener('input', ()=>show(input.value));
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      if(list.style.display==='none'){ show(input.value); return; }
      active = (active + (e.key==='ArrowDown'?1:-1) + items.length) % Math.max(items.length,1);
      [...list.children].forEach((el,i)=>el.classList.toggle('active', i===active));
    } else if(e.key==='Enter'){
      e.preventDefault();
      if(list.style.display!=='none' && items[active]) pick(items[active].id);
    } else if(e.key==='Escape'){
      hide(); input.value = selectedName(); input.blur();
    }
  });
  input.addEventListener('blur', ()=>{ setTimeout(()=>{ hide(); input.value = selectedName(); }, 150); });
  list.addEventListener('mousedown', e=>{
    const it = e.target.closest('.cust-picker-item');
    if(it){ e.preventDefault(); pick(it.dataset.id); }
  });
  if(clearBtn) clearBtn.onclick = ()=>onPick('');
}

function customerMatchesSearch(c, s){

  return foldTR(hay).includes(s);
}

const MONTH_NAMES = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function monthLabel(ym){ const [y,m]=ym.split('-'); return MONTH_NAMES[parseInt(m,10)-1]+" '"+y.slice(2); }

async function ensureReportsData(){
  const monthly = {};
  const monthlyProfit = {};
  quotesIndex.forEach(q=>{
    if(isOrderStatus(q.status)){
      const ym=(q.date||'').slice(0,7);
      if(ym) monthly[ym]=(monthly[ym]||0)+(q.total||0);
    }
  });
  const productAgg = {};
  const customerAgg = {};
  let totalProfitAll = 0;
  for(const qEntry of quotesIndex){
    const r = await stGet('godo:quote:'+qEntry.id);
    if(!r || !r.value) continue;
    let full; try{ full = JSON.parse(r.value); }catch(e){ continue; }
    const isOrder = isOrderStatus(full.status);
    const ym = (full.date||'').slice(0,7);
    let quoteRevenue = 0, quoteProfit = 0, quoteHasCost = false;
    (full.items||[]).forEach(it=>{
      if(!it.code && !it.desc) return;
      const key = (it.code||'')+'|'+(it.desc||'');
      if(!productAgg[key]) productAgg[key] = { code:it.code, desc:it.desc, qty:0, revenue:0, cost:0, hasCost:false, discSum:0, discCount:0 };
      const p = productAgg[key];
      p.qty += parseFloat(it.qty)||0;
      p.revenue += lineTotal(it);
      if(it.useCalc){ p.discSum += parseFloat(it.discount)||0; p.discCount++; }
      const actual = isOrder ? actualCostForQuoteItem(full.id, it.id, full.currency) : null;
      const buy = actual!==null ? actual : lineBuyPrice(it);
      if(buy!==null){ p.cost += buy*(parseFloat(it.qty)||0); p.hasCost = true; }
      if(isOrder){
        quoteRevenue += lineTotal(it);
        if(buy!==null){
          const profit = (lineUnitPrice(it)-buy)*(parseFloat(it.qty)||0);
          quoteProfit += profit; quoteHasCost = true;
          totalProfitAll += profit;
          if(ym) monthlyProfit[ym] = (monthlyProfit[ym]||0) + profit;
        }
      }
    });
    if(isOrder){
      const linked = customers.find(x=>x.id===(full.customer||{}).customerId);
      const custKey = linked ? linked.name : (upperCompanyName(full.customer.name||'') || 'İSİMSİZ MÜŞTERİ');
      if(!customerAgg[custKey]) customerAgg[custKey] = { name:custKey, revenue:0, cost:0, profit:0, hasCost:false, orders:0 };
      const c = customerAgg[custKey];
      c.revenue += quoteRevenue;
      c.profit += quoteProfit;
      c.cost += (quoteRevenue - quoteProfit);
      if(quoteHasCost) c.hasCost = true;
      c.orders++;
    }
  }
  const monthlyArr = Object.entries(monthly).sort((a,b)=> a[0]<b[0]?-1:1).slice(-12);
  const productArr = Object.values(productAgg).sort((a,b)=>b.revenue-a.revenue);
  const customerArr = Object.values(customerAgg).sort((a,b)=>b.profit-a.profit);

  const funnelCounts = {};
  STATUS_OPTIONS.forEach(s=>funnelCounts[s]=0);
  quotesIndex.forEach(q=>{ funnelCounts[q.status] = (funnelCounts[q.status]||0)+1; });

  return { monthlyArr, productArr, customerArr, totalProfitAll, monthlyProfit, funnelCounts, totalQuoteCount: quotesIndex.length };
}

function buildBarChartSVG(monthlyArr, curr){
  if(!monthlyArr.length) return '<p class="hint">Henüz "Siparişe Dönüştü" durumunda teklif yok — grafik bu duruma göre hesaplanıyor.</p>';
  const w=680, h=200, padB=26, padT=10, gap=14;
  const barW = (w - gap*(monthlyArr.length+1)) / monthlyArr.length;
  const maxVal = Math.max(1, ...monthlyArr.map(m=>m[1]));
  const bars = monthlyArr.map(([ym,val],i)=>{
    const bh = (val/maxVal) * (h-padB-padT);
    const x = gap + i*(barW+gap);
    const y = h - padB - bh;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#0E0E0E" rx="2"></rect>
      <text x="${x+barW/2}" y="${h-8}" font-size="9.5" font-family="Inter, sans-serif" fill="#77766F" text-anchor="middle">${monthLabel(ym)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:680px;height:auto;">${bars}</svg>`;
}

function buildFunnelHTML(counts, total){
  if(!total) return '<p class="hint">Henüz teklif yok.</p>';
  const stages = ['Taslak','Gönderildi','Onaylandı','Siparişe Dönüştü','Fatura Kesildi'];
  const maxCount = Math.max(1, ...stages.map(s=>counts[s]||0));
  const rows = stages.map(s=>{
    const c = counts[s]||0;
    const pct = total ? (c/total*100) : 0;
    return `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <span style="width:120px;font-size:11.5px;color:var(--gray-500);flex:none;">${s}</span>
        <div style="flex:1;background:var(--paper-2);border-radius:4px;height:22px;overflow:hidden;">

      </div>`;
  }).join('');
  const rejected = counts['Reddedildi']||0;
  return rows + (rejected ? `<p class="hint" style="margin-top:6px;">Ayrıca ${rejected} teklif "Reddedildi" durumunda (%${(rejected/total*100).toFixed(0)}).</p>` : '');

function openItemBulkImportModal(){
  const old = document.getElementById('modalOverlay'); if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  overlay.innerHTML = `<div class="modal-box" style="width:640px;max-width:94vw;">
    <h2>Excel'den / Yapıştır ile Kalem Ekle</h2>
    <p class="hint">Excel'de <b>Ürün Kodu</b> ve <b>Adet</b> sütunlarını sırayla seç, kopyala, aşağıya yapıştır. Kod, kayıtlı ürünlerle eşleşirse açıklama/fiyat/iskonto otomatik gelir — sonrasında dilediğin gibi düzenleyebilirsin.</p>
    <textarea id="ibi-paste" rows="8" class="code-editor" style="width:100%;" placeholder="6ES7214-1AG40-0XB0	3"></textarea>
    <div class="subhead" style="margin-top:16px;">Önizleme</div>
    <div id="ibi-preview" style="max-height:220px;overflow-y:auto;font-size:12px;"><p class="hint">Yapıştırdığında burada önizleme görünecek.</p></div>
    <div class="actions-row" style="margin-top:14px;">
      <button class="btn btn-primary" id="ibi-import">Kalemleri Ekle</button>
      <button class="btn btn-ghost" id="ibi-cancel">Vazgeç</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });

  const ta = overlay.querySelector('#ibi-paste');
  const previewEl = overlay.querySelector('#ibi-preview');
  function getRows(){
    return ta.value.split(/\r?\n/).filter(l=>l.trim().length).map(l=> l.split('\t').length>1 ? l.split('\t') : l.split(','));
  }
  function updatePreview(){
    const rows = getRows();
    if(!rows.length){ previewEl.innerHTML = '<p class="hint">Yapıştırdığında burada önizleme görünecek.</p>'; return; }
    previewEl.innerHTML = `<table class="items-table"><thead><tr><th>Kod</th><th class="num">Adet</th><th>Eşleşme</th></tr></thead><tbody>${
      rows.map(r=>{
        const code = (r[0]||'').trim();
        const match = products.find(p=>(p.code||'').trim().toLowerCase()===code.toLowerCase());
        return `<tr><td class="mono">${escapeHtml(code)}</td><td class="num">${escapeHtml((r[1]||'1').trim())}</td><td style="color:${match?'var(--ink)':'var(--danger)'};">${match?escapeHtml(match.desc||'Eşleşti'):'Bulunamadı — manuel doldurulacak'}</td></tr>`;
      }).join('')
    }</tbody></table><p class="hint" style="margin-top:6px;">${rows.length} satır bulundu.</p>`;
  }
  ta.oninput = updatePreview;
  overlay.querySelector('#ibi-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#ibi-import').onclick = ()=>{
    const rows = getRows();
    if(!rows.length){ alert('İçe aktarılacak veri yok.'); return; }
    let matched=0, unmatched=0;
    const newItems = rows.map(r=>{
      const code = (r[0]||'').trim();
      const qty = (r[1]||'1').trim();
      const p = products.find(pr=>(pr.code||'').trim().toLowerCase()===code.toLowerCase());
      if(p){
        matched++;
        return { id:crypto.randomUUID(), productId:p.id, code:p.code, desc:p.desc, delivery:p.delivery, qty,
                  listPrice:p.listPrice, buyDiscount:p.buyDiscount||'', discount:p.discount, unitPrice:'', useCalc:!!p.listPrice };
      }
      unmatched++;
      return { id:crypto.randomUUID(), productId:null, code, desc:'', delivery:'', qty, listPrice:'', buyDiscount:'', discount:'', unitPrice:'', useCalc:false };
    });
    // İlk satır tamamen boşsa onun yerine geçsin
    if(quote.items.length===1 && !quote.items[0].code && !quote.items[0].desc) quote.items = newItems;
    else quote.items = quote.items.concat(newItems);
    scheduleSave();
    overlay.remove();
    alert(`${matched} kalem kayıtlı üründen dolduruldu, ${unmatched} kalem eşleşmedi (manuel doldurman gerekecek).`);
    render();
  };
}

/* Minimal varyasyon */
.doc-rule{ display:none; }

function applyTemplate(str, tokens){
  return str.replace(/\{\{(\w+)\}\}/g, (m,k)=> tokens[k]!==undefined ? tokens[k] : '');
}

function buildDocTokens(){
  const L = qLang(quote), EN = L==='en';
  const F = n=>fmtL(n,L);
  const t = computeTotals(quote);
  const validUntil = addBusinessDays(quote.date, quote.validityDays);
  const filteredItems = quote.items.filter(it=>it.code||it.desc);
  const itemsRows = filteredItems.map((it,idx)=>`
    <tr>
      <td class="num pos">${idx+1}</td>
      <td>
        <div class="item-code">${escapeHtml(it.code)}</div>
        ${it.desc ? `<div class="item-desc">${escapeHtml(it.desc)}</div>` : ''}
      </td>
      <td class="center">${it.qty} ${EN?(parseFloat(it.qty)===1?'pc':'pcs'):'AD'}</td>
      <td>${escapeHtml(leadTimeL(it.delivery,L))}</td>
      <td class="num">${quote.currency} ${F(lineUnitPrice(it))}</td>
      <td class="num">${quote.currency} ${F(lineTotal(it))}</td>
    </tr>
  `).join('') || `<tr><td colspan="6" style="color:var(--gray-300);text-align:center;padding:20px 0;">${EN?'No items added yet':'Henüz ürün kalemi eklenmedi'}</td></tr>`;

  const custContact = quote.customer.contactName ? escapeHtml(quote.customer.contactName)+(quote.customer.contactPhone?' · '+escapeHtml(quote.customer.contactPhone):'') : (quote.customer.contactPhone?escapeHtml(quote.customer.contactPhone):'—');
  const custTaxLine = (quote.customer.taxOffice||quote.customer.taxNo) ? escapeHtml((quote.customer.taxOffice||'—')+' · '+(quote.customer.taxNo?(EN?'Tax ID ':'VN ')+quote.customer.taxNo:'')) : '—';
  const addressBlock = quote.customer.address ? `<div class="dc-address">${escapeHtml(quote.customer.address)}</div>` : '';
  const taglineBlock = company.tagline ? `<div class="doc-tagline">${escapeHtml(company.tagline)}</div>` : '';

  return {
    DOC_TITLE: EN ? 'Quotation' : 'Fiyat Teklifi',
    COMPANY_NAME: escapeHtml(company.name || 'GODO'),
    COMPANY_NAME_UPPER: escapeHtml((company.name||'GODO').toUpperCase()),
    COMPANY_TAGLINE_BLOCK: taglineBlock,
    COMPANY_TAGLINE: escapeHtml(company.tagline||''),
    COMPANY_WEBSITE: escapeHtml(company.website||'godo.tr'),
    QUOTE_NO: escapeHtml(quote.quoteNo),
    DATE: formatDateL(quote.date, L),
    VALID_UNTIL: formatDateL(validUntil, L),
    CUSTOMER_NAME: escapeHtml(quote.customer.name||'—'),
    CUSTOMER_TAX: custTaxLine,
    CUSTOMER_CONTACT: custContact,
    CUSTOMER_ADDRESS_BLOCK: addressBlock,
    ITEMS_ROWS: itemsRows,
    SUBTOTAL: `${quote.currency} ${F(t.sub)}`,
    VAT_LABEL: quote.vatEnabled ? (EN ? `VAT (${quote.vatRate}%)` : `KDV (%${quote.vatRate})`) : (EN ? 'VAT' : 'KDV'),
    VAT_VALUE: quote.vatEnabled ? `${quote.currency} ${F(t.vat)}` : (EN ? 'Excluded' : 'Hariçtir'),
    GRAND_TOTAL: `${quote.currency} ${F(t.grand)}`,
    PAYMENT_TERMS: escapeHtml(paymentTermsWithVat(quote)),
    DELIVERY_TERMS: escapeHtml(quote.terms.delivery),
    SHIPPING_BLOCK: quote.terms.shipping ? `<div class="blk"><div class="h">${EN?'Shipping Terms':'Kargo Koşulları'}</div><div class="t">${escapeHtml(quote.terms.shipping)}</div></div>` : '',
    LEGAL_TERMS: escapeHtml(quote.terms.legal),

}

/* ---------------- HELPERS ---------------- */
function proseHtml(text){
  // Satırları korur; art arda gelen boş satırları tek bir küçük boşluğa indirir
  let out = '', gap = false;
  String(text||'').replace(/\r/g,'').split('\n').forEach(l=>{
    if(!l.trim()){ gap = true; return; }
    if(gap && out) out += '<div class="prose-gap"></div>';
    gap = false;
    out += '<div>'+escapeHtml(l)+'</div>';
  });
  return out;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function addBusinessDays(dateStr, days){
  let d = new Date(dateStr);
  let added = 0;
  const total = parseInt(days)||0;
  while(added < total){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day!==0 && day!==6) added++;
  }
  return d.toISOString().slice(0,10);
}
function formatDate(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}
function buildMailtoLink(to){
  const EN = qLang(quote)==='en';
  const validUntil = addBusinessDays(quote.date, quote.validityDays);
  const subject = EN ? `${company.name||'Godo'} Quotation — ${quote.quoteNo}` : `${company.name||'Godo'} Teklifi — ${quote.quoteNo}`;
  const body = (EN ? [
    `Dear ${quote.customer.contactName||''}`.trim()+ ',',
    '',
    `Please find our quotation no. ${quote.quoteNo} attached.`,
    `Quotation valid until: ${formatDateL(validUntil,'en')}`,
    '',
    'Please do not hesitate to contact us if you have any questions.',
    '',
    'Best regards,',
    company.name || 'Godo'
  ] : [
    `Merhaba ${quote.customer.contactName||''}`.trim()+ ',',
    '',
    `${quote.quoteNo} numaralı teklifimizi ilişikte bulabilirsiniz.`,
    `Teklif geçerlilik tarihi: ${formatDate(validUntil)}`,
    '',
    'Sorularınız için her zaman ulaşabilirsiniz.',
    '',
    'İyi çalışmalar,',
    company.name || 'Godo'
  ]).join('\n');
  return `mailto:${to||''}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function refreshTotalsOnly(){
  const rows = document.querySelectorAll('#itemsBody tr[data-idx]');
  rows.forEach((tr,idx)=>{
    const it = quote.items[idx];
    if(!it) return;
    const totalCell = tr.querySelector('.col-total');
    if(totalCell) totalCell.textContent = fmt(lineTotal(it));
    const marginCell = tr.querySelector('.col-margin');
    if(marginCell){ const m=lineMarginPct(it); marginCell.textContent = m===null?'—':(m>=0?'+':'')+m.toFixed(1)+'%'; }
    if(it.useCalc){
      const unitInp = tr.querySelector('.it-unit');
      if(unitInp && document.activeElement!==unitInp) unitInp.value = lineUnitPrice(it).toFixed(2);
      const buyPriceInp = tr.querySelector('.it-buyprice');
      if(buyPriceInp && document.activeElement!==buyPriceInp){ const bp=lineBuyPrice(it); buyPriceInp.value = bp===null?'':bp.toFixed(2); }
    }
  });
  const t = computeTotals(quote);
  const box = document.querySelector('.totals-box');
  if(box){
    const rowsT = box.querySelectorAll('.totals-row');
    if(rowsT[0]) rowsT[0].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.sub)}`;
    if(rowsT[1]) rowsT[1].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.vat)}`;
    if(rowsT[2]) rowsT[2].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.grand)}`;
    if(rowsT[3]) rowsT[3].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.profit)}`;
  }
}

    const it = proposal.items[idx];
    if(!it) return;
    const cells = tr.querySelectorAll('td');
    const totalCell = cells[3];
    if(totalCell) totalCell.textContent = fmt((parseFloat(it.unitPrice)||0)*(parseFloat(it.qty)||0));
  });
  const t = computeProposalTotals(proposal);
  const box = document.querySelector('.totals-box');
  if(box){
    const rowsT = box.querySelectorAll('.totals-row');
    if(rowsT[0]) rowsT[0].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.sub)}`;
    if(rowsT[1]) rowsT[1].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.vat)}`;
    if(rowsT[2]) rowsT[2].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.grand)}`;
  }
}
