<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Godo Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --ink:#0E0E0E;
    --paper:#F4F4F2;
    --paper-2:#E8E8E5;
    --white:#FFFFFF;
    --gray-700:#454540;
    --gray-500:#77766F;
    --gray-300:#CFCEC7;
    --hairline:#DEDDD7;
    --hairline-strong:#C6C5BD;
    --danger:#8A2E22;
    --font-display:'Orbitron', 'Inter', sans-serif;
    --font-sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex;height:100vh;overflow:hidden;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:260px;flex:none;background:var(--ink);color:var(--paper);
    display:flex;flex-direction:column;
  }
  .sidebar-brand{
    padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);
  }
  .sidebar-brand .word{
    font-family:var(--font-display);font-size:21px;letter-spacing:.08em;font-weight:700;color:#fff;
  }
  .sidebar-brand .word-suffix{
    font-size:10px;letter-spacing:.14em;font-weight:600;color:var(--gray-300);
    border:1px solid rgba(255,255,255,.28);padding:2px 5px;border-radius:3px;margin-left:6px;vertical-align:middle;
  }
  .sidebar-brand .rule{width:28px;height:2px;background:#fff;margin:10px 0 6px;}
  .sidebar-brand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-300);}
  .sidebar-new{
    margin:16px 16px 4px;padding:10px 12px;background:#fff;border:1px solid #fff;
    color:var(--ink);font-family:var(--font-sans);font-size:13px;font-weight:700;border-radius:var(--radius);
    cursor:pointer;text-align:left;letter-spacing:.01em;
  }
  .sidebar-new:hover{background:var(--paper);}
  .sidebar-nav{margin:10px 16px 8px;display:flex;flex-direction:column;gap:1px;}
  .sidebar-nav button{
    background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--paper);
    font-family:var(--font-sans);font-size:12px;font-weight:600;padding:8px 10px;border-radius:var(--radius);
    cursor:pointer;text-align:left;
  }
  .sidebar-nav button:hover{border-color:#fff;}
  .sidebar-list{flex:1;overflow-y:auto;padding:10px 8px 8px;}
  .sidebar-list::-webkit-scrollbar{width:6px;}
  .sidebar-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}
  .quote-item{
    padding:10px 12px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;
    border:1px solid transparent;
  }
  .quote-item:hover{background:rgba(255,255,255,.07);}
  .quote-item.active{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.2);}
  .quote-item .qno{font-family:var(--font-mono);font-size:11px;color:var(--gray-300);letter-spacing:.02em;}
  .quote-item .qcust{font-size:13px;margin-top:3px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;}
  .quote-item .qmeta{font-size:11px;color:#8B8A82;margin-top:2px;display:flex;justify-content:space-between;}
  .sidebar-empty{padding:20px 14px;font-size:12.5px;color:#8B8A82;line-height:1.5;}
  .sidebar-footer{
    padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8B8A82;
  }

  /* ---------- MAIN ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .tabs{
    display:flex;gap:2px;padding:14px 28px 0;background:var(--paper);border-bottom:1px solid var(--hairline);
  }
  .tab{
    padding:10px 16px;font-size:12.5px;font-weight:700;color:var(--gray-500);cursor:pointer;
    border-bottom:2px solid transparent;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font-sans);
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--ink);}
  .tab:hover{color:var(--ink);}
  .subtabs{padding:0 28px;background:var(--paper-2);border-bottom:1px solid var(--hairline);}
  .subtabs .tab{font-size:11.5px;padding:9px 14px;}
  .side-primary-nav{display:flex;flex-direction:column;gap:1px;margin:14px 16px 4px;}
  .side-primary-nav .tab{
    padding:9px 10px;font-size:11.5px;font-weight:700;color:var(--gray-300);cursor:pointer;
    border-radius:3px;text-transform:uppercase;letter-spacing:.04em;border-bottom:none;border-left:2px solid transparent;
  }
  .side-primary-nav .tab:hover{background:rgba(255,255,255,.06);color:#fff;}
  .side-primary-nav .tab.active{background:rgba(255,255,255,.11);border-left-color:#fff;color:#fff;}
  .nav-badge{
    display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;
    background:var(--danger);color:#fff;border-radius:8px;font-size:9.5px;font-weight:700;
    padding:0 4px;margin-left:4px;vertical-align:middle;
  }

  .subtabs-context{padding:12px 28px 0;background:var(--paper-2);font-size:11px;font-family:var(--font-mono);color:var(--gray-500);letter-spacing:.02em;}
  .content{flex:1;overflow-y:auto;}
  .content::-webkit-scrollbar{width:8px;}
  .content::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:4px;}

  .panel{max-width:920px;margin:0 auto;padding:36px 28px 80px;}
  .panel h2{font-family:var(--font-display);font-weight:700;font-size:19px;margin:0 0 4px;letter-spacing:.02em;}
  .panel .hint{font-size:12.5px;color:var(--gray-500);margin:0 0 26px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;padding:9px 11px;border:1px solid var(--hairline-strong);border-radius:var(--radius);
    font-family:var(--font-sans);font-size:13.5px;background:var(--white);color:var(--ink);
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--ink);}
  .field textarea{resize:vertical;min-height:90px;line-height:1.55;}
  .field textarea.code-editor{font-family:var(--font-mono);font-size:11.5px;line-height:1.6;background:#1a1a18;color:#d8d6cc;border-color:#1a1a18;tab-size:2;}
  .field textarea.code-editor:focus{border-color:var(--ink);}
  .field.mono input{font-family:var(--font-mono);}
  .section-div{height:1px;background:var(--hairline);margin:26px 0;}
  .subhead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-500);margin:0 0 14px;font-family:var(--font-display);}
  .subhead-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .link-btn{background:none;border:none;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;text-decoration:underline;padding:0;text-transform:uppercase;letter-spacing:.04em;}

  /* items table */
  .items-table{width:100%;border-collapse:collapse;}
  .items-table th{
    text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);
    padding:0 8px 8px;font-weight:700;border-bottom:1px solid var(--hairline-strong);
  }
  .items-table td{padding:6px 8px;vertical-align:top;border-bottom:1px solid var(--hairline);}
  .items-table input,.items-table select{
    width:100%;border:1px solid transparent;background:transparent;padding:6px 6px;font-size:13px;
    font-family:var(--font-sans);border-radius:3px;
  }
  .items-table input:focus,.items-table select:focus{outline:none;border-color:var(--ink);background:var(--white);}
  .items-table input.mono{font-family:var(--font-mono);font-size:12.5px;}
  .items-table .num{text-align:right;}
  .col-code{width:110px;} .col-delivery{width:100px;} .col-qty{width:60px;}
  .col-list{width:80px;} .col-disc{width:70px;} .col-unit{width:90px;} .col-margin{width:70px;} .col-total{width:100px;}
  .row-remove{cursor:pointer;color:var(--gray-300);font-size:15px;padding:6px 4px;text-align:center;width:26px;}
  .row-remove:hover{color:var(--danger);}
  .calc-toggle{font-size:10.5px;color:var(--ink);cursor:pointer;font-weight:700;letter-spacing:.02em;user-select:none;text-decoration:underline;}
  .add-row-btn{
    margin-top:12px;padding:8px 14px;font-size:12.5px;font-weight:700;border:1px dashed var(--hairline-strong);
    background:transparent;border-radius:var(--radius);cursor:pointer;color:var(--gray-500);
  }
  .add-row-btn:hover{border-color:var(--ink);color:var(--ink);}

  .totals-box{margin-top:22px;margin-left:auto;width:290px;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--gray-500);}
  .totals-row.grand{
    border-top:1px solid var(--hairline-strong);margin-top:6px;padding-top:10px;
    font-size:16px;font-weight:700;color:var(--ink);font-family:var(--font-mono);
  }
  .vat-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gray-500);margin:10px 0 2px;}
  .vat-row input[type=checkbox]{width:auto;}
  .vat-row input[type=number]{width:52px;padding:4px 6px;font-size:12px;}

  /* buttons */
  .btn{
    padding:10px 18px;font-size:12.5px;font-weight:700;border-radius:var(--radius);cursor:pointer;
    font-family:var(--font-sans);letter-spacing:.02em;border:1px solid var(--ink);text-transform:uppercase;
  }
  .btn-primary{background:var(--ink);color:var(--white);}
  .btn-primary:hover{background:#2b2b28;}
  .btn-ghost{background:transparent;color:var(--ink);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .actions-row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;align-items:center;}

  .save-indicator{font-size:11px;color:var(--gray-300);margin-left:auto;text-transform:uppercase;letter-spacing:.04em;}
  .version-pill{font-family:var(--font-mono);font-size:11px;padding:5px 10px;border:1px solid var(--hairline-strong);border-radius:12px;cursor:pointer;color:var(--gray-500);}
  .version-pill:hover{border-color:var(--ink);color:var(--ink);}
  .version-pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tag-pill{font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:3px 8px;border-radius:10px;background:var(--paper-2);color:var(--gray-500);margin-right:5px;display:inline-block;}
  .tag-pill.hot{background:#F3E4E0;color:#8A2E22;}
  .tag-pill.warm{background:#F3EEDD;color:#8A6B22;}
  .tag-pill.cold{background:#E4E9F0;color:#2E4E8A;}

  /* ---------- PREVIEW / PRINT DOC ---------- */
  .preview-wrap{background:var(--paper-2);padding:40px 20px;min-height:100%;}
  #printArea{
    background:#fff;max-width:900px;margin:0 auto;padding:46px 46px 54px;
    box-shadow:0 6px 30px rgba(0,0,0,.10);color:var(--ink);
  }
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .doc-word{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:.08em;color:var(--ink);}
  .doc-rule{width:36px;height:2px;background:var(--ink);margin:9px 0 5px;}
  .doc-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gray-500);}
  .doc-tagline{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-500);margin-bottom:6px;}
  .doc-meta{text-align:right;font-size:12px;color:var(--gray-500);line-height:1.7;}
  .doc-meta .qn{font-family:var(--font-mono);font-size:13px;color:var(--ink);font-weight:600;}
  .doc-title{
    font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;
    margin:34px 0 18px;color:var(--ink);border-bottom:1.5px solid var(--ink);padding-bottom:10px;
  }
  .doc-customer{
    border-bottom:1px solid var(--hairline);
    padding:0 0 18px; margin-bottom:6px;
  }
  .dc-name{font-weight:700;font-size:15px;margin-bottom:10px;}
  .dc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:8px;}
  .dc-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:2px;}
  .dc-value{display:block;font-size:13px;color:var(--ink);font-weight:700;}
  .dc-address{font-size:12px;color:var(--gray-500);line-height:1.5;white-space:pre-line;}

  table.doc-items{width:100%;border-collapse:collapse;margin-top:22px;table-layout:fixed;}
  table.doc-items thead th{
    text-align:left;font-size:8.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-500);
    padding:0 6px 8px;border-bottom:1.5px solid var(--ink);font-weight:700;vertical-align:bottom;white-space:nowrap;
  }
  table.doc-items td{padding:9px 6px;font-size:12.5px;border-bottom:1px solid var(--hairline);vertical-align:middle;word-wrap:break-word;}
  table.doc-items td.num,table.doc-items th.num{text-align:right;font-family:var(--font-mono);}
  table.doc-items td.center,table.doc-items th.center{text-align:center;}
  table.doc-items td.pos{color:var(--ink);font-weight:700;font-size:13px;}

  .doc-totals{margin-left:auto;width:260px;margin-top:6px;}
  .doc-totals .r{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;color:var(--gray-500);}
  .doc-totals .r.grand{
    border-top:1.5px solid var(--ink);margin-top:5px;padding-top:9px;font-weight:700;font-size:15px;
    color:var(--ink);font-family:var(--font-mono);
  }
  .doc-terms{margin-top:38px;}
  .doc-terms .blk{margin-bottom:18px;}
  .doc-terms .blk .h{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink);font-weight:700;margin-bottom:6px;font-family:var(--font-display);}
  .doc-terms .blk .t{font-size:11.5px;line-height:1.7;color:var(--gray-500);white-space:pre-line;}
  .doc-foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--hairline);display:flex;justify-content:space-between;font-size:10px;color:var(--gray-300);letter-spacing:.03em;font-family:var(--font-mono);}

  /* ---------- PROJE TEKLİFİ (PROPOSAL) DOKÜMAN ---------- */
  .doc-cover-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:.02em;color:var(--ink);margin:34px 0 22px;line-height:1.25;}
  .doc-cover-table{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;padding-top:20px;border-top:1.5px solid var(--ink);}
  .doc-cover-note{margin-top:60px;font-size:10.5px;font-style:italic;color:var(--gray-300);}
  .doc-page-header{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-300);font-family:var(--font-display);padding-bottom:10px;border-bottom:1px solid var(--hairline);margin-bottom:24px;}
  .doc-sub-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-family:var(--font-display);margin:24px 0 12px;}
  .doc-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:16px;padding-bottom:20px;border-bottom:1px solid var(--hairline);}
  .doc-info-block-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);font-family:var(--font-display);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--hairline-strong);}
  .doc-info-h{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--gray-500);font-weight:700;margin-bottom:2px;margin-top:9px;}
  .doc-info-h:first-child{margin-top:0;}
  .doc-info-v{font-size:12.5px;color:var(--ink);}
  .doc-toc{margin-top:22px;}
  .doc-toc-row{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:12.5px;}
  .doc-toc-num{font-family:var(--font-mono);color:var(--gray-500);width:18px;flex:none;}
  .doc-section{margin-top:30px;}
  .doc-section-h{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);margin-bottom:12px;padding-bottom:7px;border-bottom:1.5px solid var(--ink);display:flex;gap:10px;align-items:baseline;}
  .doc-section-h .n{color:var(--gray-300);font-family:var(--font-mono);font-size:12px;}
  .doc-section-t{font-size:12.5px;line-height:1.75;color:var(--gray-700);white-space:pre-line;}
  .doc-list{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.85;color:var(--gray-700);}
  .doc-simple-table{width:100%;border-collapse:collapse;margin-top:8px;}
  .doc-simple-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);padding:0 10px 9px;font-weight:700;border-bottom:1.5px solid var(--ink);}
  .doc-simple-table td{padding:10px;font-size:12.5px;border-bottom:1px solid var(--hairline);}
  .doc-simple-table td.pos{font-weight:700;color:var(--ink);}
  .doc-simple-table .num,.doc-simple-table th.num{text-align:right;font-family:var(--font-mono);}
  .doc-simple-table .center,.doc-simple-table th.center{text-align:center;}
  .doc-note{font-size:11px;font-style:italic;color:var(--gray-500);margin-top:12px;}
  .doc-sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:56px;}
  .doc-sig-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);font-family:var(--font-display);}
  .doc-sig-line{border-top:1px solid var(--hairline-strong);margin-top:46px;padding-top:8px;}
  .doc-sig-sub{font-size:10.5px;color:var(--gray-300);}
  .small-label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gray-500);margin-bottom:8px;}
  .dyn-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .dyn-row input{flex:1;padding:9px 11px;border:1px solid var(--hairline-strong);border-radius:var(--radius);font-family:var(--font-sans);font-size:13.5px;background:var(--white);color:var(--ink);}
  .dyn-row input:focus{outline:none;border-color:var(--ink);}
  .dyn-row .row-remove{flex:none;}

  .preview-toolbar{max-width:900px;margin:0 auto 18px;display:flex;justify-content:flex-end;gap:10px;}

  @media print{
    body *{visibility:hidden;}
    .preview-wrap,.preview-wrap *{visibility:visible;}
    .preview-wrap{background:#fff;padding:0;position:absolute;top:0;left:0;width:100%;}
    #printArea{box-shadow:none;max-width:100%;padding:0;margin:0;}
    .preview-toolbar, .screen-only-note{display:none;}
    table.doc-items tr{ page-break-inside:avoid; }
    .doc-terms{ page-break-inside:avoid; }
    .doc-terms .blk{ page-break-inside:avoid; }
    .doc-totals{ page-break-inside:avoid; }
    .doc-simple-table tr{ page-break-inside:avoid; }
    .doc-sig-grid{ page-break-inside:avoid; }
    .doc-cover-title, .doc-cover-table{ page-break-after:auto; }
    @page{ size:A4; margin:10mm 12mm; }
  }

  /* ---------- DASHBOARD ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 32px;}
  .kpi-card{border:1px solid var(--hairline-strong);border-radius:4px;padding:16px 16px 14px;background:var(--white);}
  .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);font-weight:700;margin-bottom:8px;}
  .kpi-value{font-family:var(--font-mono);font-size:20px;font-weight:600;color:var(--ink);}
  .kpi-sub{font-size:10.5px;color:var(--gray-300);margin-top:4px;}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .dash-col{min-width:0;}
  .status-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .status-bar-label{width:110px;font-size:11.5px;color:var(--gray-500);flex:none;}
  .status-bar-track{flex:1;height:7px;background:var(--paper-2);border-radius:4px;overflow:hidden;}
  .status-bar-fill{height:100%;background:var(--ink);border-radius:4px;}
  .status-bar-count{width:20px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--gray-500);flex:none;}

/* ---------------- STORAGE ADAPTER ----------------
   Kademeli depolama:
   0) SUPABASE — birincil, kalıcı depolama. Giriş yaptıktan sonra her stSet çağrısı
      hem Supabase'e (kv_store tablosu, kullanıcıya özel RLS ile) hem de anlık bir
      yerel önbelleğe (localStorage) yazar. Ağ hatası/çevrimdışı durumda stGet
      otomatik olarak bu yerel önbelleğe düşer, senkronizasyon bekleyen yazımlar
      kuyruğa alınır ve bağlantı dönünce otomatik gönderilir.
   1) FILE  — bilgisayarda seçtiğin bir dosyaya doğrudan yazar (eski yöntem, hâlâ
      kullanılabilir ama artık gerekli değil — Supabase bunun yerini alıyor).
   2) CLOUD — Claude içinde açıldığında window.storage (Claude bulutu).
   3) LOCAL — hiçbiri yoksa bu tarayıcının localStorage'ı (son çare).
   Hepsi aynı key/value arayüzünü (stGet/stSet/stDelete) kullanır, üstteki kod
   hangi modda olduğunu bilmek zorunda değildir. */

/* --- Supabase istemcisi --- */
const SUPABASE_URL = 'https://laopdoxuxvcwgcjghdim.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1nISfnWk7beTCi0DDnquYA_IALD-58G';
const sb = (typeof window.supabase !== 'undefined')
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
let currentUser = null;       // { id, email } — giriş yapan kullanıcı
let pendingSync = [];         // ağ hatası sırasında biriken, gönderilemeyen yazımlar: {key, value|null(=delete)}
let syncFailed = false;

async function sbGet(key){
  try{
    const { data, error } = await sb.from('kv_store').select('value').eq('user_id', currentUser.id).eq('key', key).maybeSingle();
    if(error) throw error;
    if(data){ try{ localStorage.setItem('godo::'+key, data.value); }catch(e){} return { key, value:data.value, shared:false }; }
    return null;
  }catch(e){
    syncFailed = true; renderStorageBanner();
    const v = localStorage.getItem('godo::'+key);
    return v!==null ? { key, value:v, shared:false } : null;
  }
}
async function sbSet(key, value){
  try{ localStorage.setItem('godo::'+key, value); }catch(e){}
  try{
    const { error } = await sb.from('kv_store').upsert(
      { user_id: currentUser.id, key, value },
      { onConflict: 'user_id,key' }
    );
    if(error) throw error;
    syncFailed = false;
  }catch(e){
    syncFailed = true;
    pendingSync.push({ key, value });
    renderStorageBanner();
  }
  return { key, value, shared:false };
}
async function sbDelete(key){
  try{ localStorage.removeItem('godo::'+key); }catch(e){}
  try{
    const { error } = await sb.from('kv_store').delete().eq('user_id', currentUser.id).eq('key', key);
    if(error) throw error;
  }catch(e){
    syncFailed = true;
    pendingSync.push({ key, value:null });
    renderStorageBanner();
  }
  return { key, deleted:true, shared:false };
}
async function retryPendingSync(){
  if(!pendingSync.length || !currentUser) return;
  const queue = pendingSync; pendingSync = [];
  for(const item of queue){
    if(item.value===null) await sbDelete(item.key);
    else await sbSet(item.key, item.value);
  }
  if(!pendingSync.length){ syncFailed = false; renderStorageBanner(); }
}
window.addEventListener('online', retryPendingSync);
setInterval(retryPendingSync, 20000);

let storageMode = 'local'; // 'supabase' | 'file' | 'cloud' | 'local' — giriş yapınca 'supabase' olur
let fileHandle = null;
let fileStore = {};      // key -> string value, mirrored to disk as one JSON object when storageMode==='file'
let fileWriteTimer = null;
let fileNeedsReconnect = false; // true if a handle was linked previously but permission needs a click to re-grant

function idbOpen(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('godo-fs', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
async function idbGetHandle(){
  try{ const db = await idbOpen(); return await new Promise((res,rej)=>{ const tx=db.transaction('handles','readonly'); const r=tx.objectStore('handles').get('fileHandle'); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); }); }catch(e){ return null; }
}
async function idbSetHandle(handle){
  try{ const db = await idbOpen(); return await new Promise((res,rej)=>{ const tx=db.transaction('handles','readwrite'); tx.objectStore('handles').put(handle,'fileHandle'); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); }); }catch(e){ return false; }
}

async function readFileStoreFromHandle(handle){
  try{
    const f = await handle.getFile();
    const text = await f.text();
    return text.trim() ? JSON.parse(text) : {};
  }catch(e){ return {}; }
}
function scheduleFileWrite(){
  clearTimeout(fileWriteTimer);
  fileWriteTimer = setTimeout(writeFileStoreNow, 500);
}
let lastFileWriteAt = null;
async function writeFileStoreNow(){
  if(!fileHandle) return;
  try{
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(fileStore));
    await w.close();
    lastFileWriteAt = Date.now();
    updateSyncStatusLabel();
  }catch(e){ /* permission may have lapsed; user will see reconnect banner on next load */ }
}
function updateSyncStatusLabel(){
  const el = document.getElementById('syncStatusLabel');
  if(!el) return;
  if(storageMode!=='file'){ el.textContent=''; return; }
  if(!lastFileWriteAt){ el.textContent='Henüz bu oturumda yerel dosyaya yazılmadı.'; return; }
  const secs = Math.floor((Date.now()-lastFileWriteAt)/1000);
  let rel;
  if(secs<10) rel='az önce';
  else if(secs<60) rel=secs+' sn önce';
  else if(secs<3600) rel=Math.floor(secs/60)+' dk önce';
  else rel=Math.floor(secs/3600)+' sa önce';
  el.textContent = '💾 Son yerel kayıt: '+rel+' · Drive senkronunu Drive simgesinden takip et';
}
setInterval(updateSyncStatusLabel, 15000);

async function linkNewFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'godo-veri.json',
      types: [{ description:'Godo Veri Dosyası', accept:{'application/json':['.json']} }]
    });
    await idbSetHandle(handle);
    fileHandle = handle;
    // Var olan bulut/yerel verilerini yeni dosyaya taşı (ilk bağlantıda kaybolmasın)
    fileStore = {};
    for(const k of ['godo:company','godo:customers','godo:products','godo:quotes-index']){
      const existing = await stGetFromPreviousMode(k);
      if(existing) fileStore[k] = existing;
    }
    for(const q of quotesIndex){
      const existing = await stGetFromPreviousMode('godo:quote:'+q.id);
      if(existing) fileStore['godo:quote:'+q.id] = existing;
    }
    await writeFileStoreNow();
    storageMode = 'file';
    fileNeedsReconnect = false;
    document.getElementById('storageModeLabel').textContent = storageModeLabel();
    renderStorageBanner();
  }catch(e){ /* user cancelled the picker */ }
}
async function stGetFromPreviousMode(key){
  if(hasCloudStorage){ try{ const r = await window.storage.get(key); return r && r.value ? r.value : null; }catch(e){ return null; } }
  return localStorage.getItem('godo::'+key);
}

async function tryReconnectFile(){
  if(!fileHandle) return false;
  try{
    let perm = await fileHandle.queryPermission({ mode:'readwrite' });
    if(perm !== 'granted') perm = await fileHandle.requestPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileStore = await readFileStoreFromHandle(fileHandle);
      storageMode = 'file';
      fileNeedsReconnect = false;
      return true;
    }
  }catch(e){}
  return false;
}

async function initStorage(){
  if(storageMode==='supabase') return; // Supabase birincil kaynak — eski dosya-bağlama mantığı devre dışı
  if(!hasFileSystemAccess) return; // file:// veya desteklenmeyen tarayıcı — cloud/local moda devam
  const handle = await idbGetHandle();
  if(!handle) return;
  fileHandle = handle;
  try{
    const perm = await handle.queryPermission({ mode:'readwrite' });
    if(perm === 'granted'){
      fileStore = await readFileStoreFromHandle(handle);
      storageMode = 'file';
    } else {
      fileNeedsReconnect = true; // bağlanmak için tek tık gerekiyor (kullanıcı jesti şart)
    }
  }catch(e){}
}

async function stGet(key){
  if(storageMode==='supabase'){ return await sbGet(key); }
  if(storageMode==='file'){ return fileStore[key]!==undefined ? { key, value:fileStore[key], shared:false } : null; }
  if(storageMode==='cloud'){ try{ return await window.storage.get(key); }catch(e){ return null; } }
  const v = localStorage.getItem('godo::'+key);
  return v!==null ? { key, value:v, shared:false } : null;
}
async function stSet(key, value){
  if(storageMode==='supabase'){ return await sbSet(key, value); }
  if(storageMode==='file'){ fileStore[key]=value; scheduleFileWrite(); return { key, value, shared:false }; }
  if(storageMode==='cloud'){ try{ return await window.storage.set(key, value); }catch(e){ return null; } }
  try{ localStorage.setItem('godo::'+key, value); return { key, value, shared:false }; }catch(e){ return null; }
}
async function stDelete(key){
  if(storageMode==='supabase'){ return await sbDelete(key); }
  if(storageMode==='file'){ delete fileStore[key]; scheduleFileWrite(); return { key, deleted:true, shared:false }; }
  if(storageMode==='cloud'){ try{ return await window.storage.delete(key); }catch(e){ return null; } }
  localStorage.removeItem('godo::'+key);
  return { key, deleted:true, shared:false };
}
function storageModeLabel(){
  if(storageMode==='supabase') return syncFailed ? '⚠ Çevrimdışı — son senkronize veriler gösteriliyor' : ('● Godo Matrix bulut veritabanına kaydediliyor ('+(currentUser?currentUser.email:'')+' hesabıyla giriş yapıldı)');
  if(storageMode==='file') return '● Bağlı — bu bilgisayardaki dosyaya kaydediliyor';
  if(storageMode==='cloud') return 'Depolama: Claude bulut (bu artifact\'e bağlı)';
  return 'Depolama: bu tarayıcı (yerel — dosyaya bağlı değil)';
}
function renderStorageBanner(){
  const el = document.getElementById('storageBanner');
  if(!el) return;
  if(storageMode==='supabase'){
    if(syncFailed){
      el.innerHTML = `<div style="font-size:10.5px;color:#ffb84d;line-height:1.5;margin-bottom:10px;">⚠ Sunucuya ulaşılamıyor, değişiklikler bu cihazda bekletiliyor ve bağlantı dönünce otomatik gönderilecek.</div>`;
    } else {
      el.innerHTML = '';
    }
    return;
  }
  if(storageMode==='file'){ el.innerHTML=''; return; }
  if(fileNeedsReconnect){
    el.innerHTML = `<button id="btnReconnectFile" style="width:100%;background:#fff;color:var(--ink);border:none;font-size:11.5px;font-weight:700;padding:8px;border-radius:3px;cursor:pointer;margin-bottom:10px;">Bilgisayardaki Dosyaya Bağlan (tek tık)</button>`;
    document.getElementById('btnReconnectFile').onclick = async ()=>{
      const ok = await tryReconnectFile();
      if(ok){ document.getElementById('storageModeLabel').textContent = storageModeLabel(); renderStorageBanner(); await loadAll(); }
    };
  } else if(hasFileSystemAccess){
    el.innerHTML = `<button id="btnLinkFile" style="width:100%;background:transparent;color:var(--paper);border:1px dashed rgba(255,255,255,.35);font-size:11.5px;font-weight:700;padding:8px;border-radius:3px;cursor:pointer;margin-bottom:10px;">Bilgisayarda Dosyaya Bağlan</button>`;
    document.getElementById('btnLinkFile').onclick = ()=>linkNewFile();
  } else {
    el.innerHTML = `<div style="font-size:10.5px;color:#8B8A82;line-height:1.5;margin-bottom:10px;">Dosyaya bağlanmak için bu sayfayı http://localhost üzerinden aç (bkz. Godo Başlat.command).</div>`;
  }
}

/* ---------------- STORAGE ---------------- */
async function loadAll(){
  await initStorage();
  try{ const c = await stGet('godo:company'); if(c && c.value) company = JSON.parse(c.value); }catch(e){}
  if(company.tagline===undefined) company.tagline = 'GLOBAL OPTIMIZATION | DIGITAL OPERATION';
  try{ const cs = await stGet('godo:customers'); if(cs && cs.value) customers = JSON.parse(cs.value); }catch(e){}
  try{ const ps = await stGet('godo:products'); if(ps && ps.value) products = JSON.parse(ps.value); }catch(e){}
  try{ const sp = await stGet('godo:suppliers'); if(sp && sp.value) suppliers = JSON.parse(sp.value); }catch(e){}
  try{ const idx = await stGet('godo:quotes-index'); if(idx && idx.value) quotesIndex = JSON.parse(idx.value); }catch(e){}
  try{ const pidx = await stGet('godo:proposals-index'); if(pidx && pidx.value) proposalsIndex = JSON.parse(pidx.value); }catch(e){}
  try{ const ts = await stGet('godo:tasks'); if(ts && ts.value) tasks = JSON.parse(ts.value); }catch(e){}
  try{ const tr = await stGet('godo:trash'); if(tr && tr.value) trash = JSON.parse(tr.value); }catch(e){}
  try{ const tt = await stGet('godo:termTemplates'); if(tt && tt.value) termTemplates = JSON.parse(tt.value); }catch(e){}
  try{
    const newFmt = await stGet('godo:docTemplates');
    if(newFmt && newFmt.value){
      const parsed = JSON.parse(newFmt.value);
      docTemplates = parsed.templates || docTemplates;
      defaultTemplate = parsed.defaultTemplate || 'classic';
    } else {
      // Eski tek-şablon formatından geçiş
      const oldFmt = await stGet('godo:docTemplate');
      if(oldFmt && oldFmt.value){
        const old = JSON.parse(oldFmt.value);
        if(old.html || old.css) docTemplates.custom = { html: old.html||'', css: old.css||'' };
        defaultTemplate = old.defaultTemplate || 'classic';
        await saveDocTemplates();
      }
    }
  }catch(e){}
  if(!termTemplates.payment || !termTemplates.payment.length){
    termTemplates.payment = [
      { id:crypto.randomUUID(), name:'Avanslı (%30/%70)', text: defaultTerms.payment },
      { id:crypto.randomUUID(), name:'Peşin', text: "Ödemenin tamamı sipariş onayında peşin olarak alınır.\nBanka havalesi / EFT ile ödeme kabul edilir." },
      { id:crypto.randomUUID(), name:'Vadeli (30 Gün)', text: "Ödeme, fatura tarihinden itibaren 30 gün vadelidir.\nVade sonunda ödemenin tamamı tahsil edilir." }
    ];
    termTemplates.delivery = [ { id:crypto.randomUUID(), name:'Standart', text: defaultTerms.delivery } ];
    termTemplates.legal = [ { id:crypto.randomUUID(), name:'Standart', text: defaultTerms.legal } ];
    await saveTermTemplates();
  }
  if(!termTemplates.shipping || !termTemplates.shipping.length){
    termTemplates.shipping = ['Yurtiçi Kargo','MNG Kargo','Aras Kargo','PTT Kargo','DHL Kargo'].map(name=>({
      id: crypto.randomUUID(), name: name+' — Alıcı Öder',
      text: `Kargo Firması: ${name}\nÖdeme Şekli: Alıcı Öder`
    }));
    await saveTermTemplates();
  }
  document.getElementById('storageModeLabel').textContent = storageModeLabel();
  updateSyncStatusLabel();
  renderStorageBanner();
  if(quotesIndex.length){ await openQuote(quotesIndex[0].id); }
  else { quote = emptyQuote(); quote.quoteNo = nextQuoteNo(); render(); }
}
async function saveCompany(){ await stSet('godo:company', JSON.stringify(company)); }
async function saveCustomers(){ await stSet('godo:customers', JSON.stringify(customers)); }
async function saveProducts(){ await stSet('godo:products', JSON.stringify(products)); }
async function saveSuppliers(){ await stSet('godo:suppliers', JSON.stringify(suppliers)); }
async function saveIndex(){ await stSet('godo:quotes-index', JSON.stringify(quotesIndex)); }
async function saveTasks(){ await stSet('godo:tasks', JSON.stringify(tasks)); }
function applyCustomerDefaultsToQuote(cust){
  if(cust.defaultPaymentTplId){
    const pt = termTemplates.payment.find(t=>t.id===cust.defaultPaymentTplId);
    if(pt) quote.terms.payment = pt.text;
  }
  if(cust.defaultDeliveryTplId){
    const dt = termTemplates.delivery.find(t=>t.id===cust.defaultDeliveryTplId);
    if(dt) quote.terms.delivery = dt.text;
  }
  if(cust.defaultShippingTplId){
    const st = termTemplates.shipping.find(t=>t.id===cust.defaultShippingTplId);
    if(st) quote.terms.shipping = st.text;
  }
}

function maybeCreateFollowupTask(){
  if(!quote.id) quote.id = crypto.randomUUID();
  const already = tasks.some(t=>t.quoteId===quote.id && !t.done && t.autoFollowup);
  if(already) return;
  const dueDate = addBusinessDays(new Date().toISOString().slice(0,10), FOLLOWUP_DAYS);
  tasks.unshift({
    id: crypto.randomUUID(),
    title: `${quote.quoteNo||'Teklif'} için takip araması`,
    dueDate,
    customerId: quote.customer.customerId||null,
    customerName: quote.customer.name||'İsimsiz Müşteri',
    quoteId: quote.id,
    autoFollowup: true,
    done: false
  });
  saveTasks();
}
async function saveTrash(){ await stSet('godo:trash', JSON.stringify(trash)); }
async function moveToTrash(type, data){
  trash.unshift({ id: crypto.randomUUID(), type, data, deletedAt: new Date().toISOString() });
  await saveTrash();
}
async function restoreFromTrash(trashId){
  const idx = trash.findIndex(t=>t.id===trashId);
  if(idx<0) return;
  const item = trash[idx];
  if(item.type==='customer'){ customers.push(item.data); await saveCustomers(); }
  else if(item.type==='product'){ products.push(item.data); await saveProducts(); }
  else if(item.type==='supplier'){ suppliers.push(item.data); await saveSuppliers(); }
  else if(item.type==='quote'){
    quotesIndex.unshift(item.data.indexEntry); await saveIndex();
    await stSet('godo:quote:'+item.data.full.id, JSON.stringify(item.data.full));
  }
  else if(item.type==='proposal'){
    proposalsIndex.unshift(item.data.indexEntry); await saveProposalsIndex();
    await stSet('godo:proposal:'+item.data.full.id, JSON.stringify(item.data.full));
  }
  trash.splice(idx,1);
  await saveTrash();
}
async function permanentlyDeleteFromTrash(trashId){
  trash = trash.filter(t=>t.id!==trashId);
  await saveTrash();
}
async function saveTermTemplates(){ await stSet('godo:termTemplates', JSON.stringify(termTemplates)); }
async function saveDocTemplates(){ await stSet('godo:docTemplates', JSON.stringify({ templates: docTemplates, defaultTemplate })); }
function getSlotHTML(slot){ return (docTemplates[slot] && docTemplates[slot].html) || DEFAULT_DOC_HTML; }
function getSlotCSS(slot){ return (docTemplates[slot] && docTemplates[slot].css) || getDocSlotDefaultCSS(slot); }
function effectiveTemplate(){
  // Bir teklifte elle "Klasik" dışında bir şey seçilmediyse (yani hâlâ sessiz varsayılandaysa),
  // sistem genelindeki varsayılan şablonu kullan — böylece Ayarlar'da kaydettiğin an her yerde görünür.
  return (quote.template && quote.template!=='classic') ? quote.template : defaultTemplate;
}

async function persistQuote(){
  if(!quote.id) quote.id = crypto.randomUUID();
  if(!quote.rootId) quote.rootId = quote.id;
  await stSet('godo:quote:'+quote.id, JSON.stringify(quote));
  const total = computeTotals(quote).grand;
  const existingIdx = quotesIndex.findIndex(q=>q.id===quote.id);
  const entry = { id: quote.id, rootId: quote.rootId, version: quote.version||1, quoteNo: quote.quoteNo, customerName: quote.customer.name || "İsimsiz Müşteri", customerId: quote.customer.customerId||null, date: quote.date, total, currency: quote.currency, status: quote.status, orderStatus: quote.orderStatus||"", lossReason: quote.lossReason||"" };
  if(existingIdx >= 0) quotesIndex[existingIdx] = entry; else quotesIndex.unshift(entry);
  await saveIndex();
  flashSaved();
}
async function openQuote(id){
  const r = await stGet('godo:quote:'+id);
  if(r && r.value){ quote = JSON.parse(r.value); if(!quote.customer.contactId) quote.customer.contactId=null; render(); }
}
async function deleteQuote(id){
  const indexEntry = quotesIndex.find(q=>q.id===id);
  const r = await stGet('godo:quote:'+id);
  let full = null;
  if(r && r.value){ try{ full = JSON.parse(r.value); }catch(e){} }
  if(indexEntry && full) await moveToTrash('quote', { indexEntry, full });
  await stDelete('godo:quote:'+id);
  quotesIndex = quotesIndex.filter(q=>q.id!==id);
  await saveIndex();
  if(quote.id === id){ quote = emptyQuote(); quote.quoteNo = nextQuoteNo(); }
  render();
}

async function saveProposalsIndex(){ await stSet('godo:proposals-index', JSON.stringify(proposalsIndex)); }
async function persistProposal(){
  if(!proposal.id) proposal.id = crypto.randomUUID();
  await stSet('godo:proposal:'+proposal.id, JSON.stringify(proposal));
  const total = computeProposalTotals(proposal).grand;
  const entry = { id: proposal.id, proposalNo: proposal.proposalNo, title: proposal.title, customerName: proposal.customer.name || "İsimsiz Müşteri", customerId: proposal.customer.customerId||null, date: proposal.date, total, currency: proposal.currency, status: proposal.status };
  const idx = proposalsIndex.findIndex(p=>p.id===proposal.id);
  if(idx>=0) proposalsIndex[idx]=entry; else proposalsIndex.unshift(entry);
  await saveProposalsIndex();
  flashSaved();
}
async function openProposal(id){
  const r = await stGet('godo:proposal:'+id);
  if(r && r.value){ proposal = JSON.parse(r.value); activeTab='pInfo'; render(); }
}
async function deleteProposal(id){
  const indexEntry = proposalsIndex.find(p=>p.id===id);
  const r = await stGet('godo:proposal:'+id);
  let full = null;
  if(r && r.value){ try{ full = JSON.parse(r.value); }catch(e){} }
  if(indexEntry && full) await moveToTrash('proposal', { indexEntry, full });
  await stDelete('godo:proposal:'+id);
  proposalsIndex = proposalsIndex.filter(p=>p.id!==id);
  await saveProposalsIndex();
  if(proposal.id === id){ proposal = emptyProposal(); proposal.proposalNo = nextProposalNo(); }
  activeTab = 'proposalsList';
  render();
}
function scheduleProposalSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistProposal, 700); }

async function exportBackup(){
  const data = { exportedAt: new Date().toISOString(), company, customers, products, suppliers, quotesIndex, proposalsIndex, tasks, trash, termTemplates, docTemplates, defaultTemplate, quotes: {}, proposals: {} };
  for(const q of quotesIndex){
    const r = await stGet('godo:quote:'+q.id);
    if(r && r.value){ try{ data.quotes[q.id] = JSON.parse(r.value); }catch(e){} }
  }
  for(const p of proposalsIndex){
    const r = await stGet('godo:proposal:'+p.id);
    if(r && r.value){ try{ data.proposals[p.id] = JSON.parse(r.value); }catch(e){} }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'godo-yedek-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ alert('Dosya okunamadı: geçersiz yedek dosyası.'); return; }
    if(!confirm('Bu yedek, mevcut cari/ürün/teklif verilerinin üzerine yazılacak. Devam edilsin mi?')) return;
    if(data.company) company = data.company;
    if(data.customers) customers = data.customers;
    if(data.products) products = data.products;
    if(data.suppliers) suppliers = data.suppliers;
    if(data.quotesIndex) quotesIndex = data.quotesIndex;
    if(data.proposalsIndex) proposalsIndex = data.proposalsIndex;
    if(data.tasks) tasks = data.tasks;
    if(data.trash) trash = data.trash;
    if(data.termTemplates) termTemplates = data.termTemplates;
    if(data.docTemplates) docTemplates = data.docTemplates;
    if(data.defaultTemplate) defaultTemplate = data.defaultTemplate;
    await saveCompany(); await saveCustomers(); await saveProducts(); await saveSuppliers(); await saveIndex(); await saveProposalsIndex(); await saveTasks(); await saveTrash(); await saveTermTemplates(); await saveDocTemplates();
    if(data.quotes){ for(const id in data.quotes){ await stSet('godo:quote:'+id, JSON.stringify(data.quotes[id])); } }
    if(data.proposals){ for(const id in data.proposals){ await stSet('godo:proposal:'+id, JSON.stringify(data.proposals[id])); } }
    alert('Yedek başarıyla yüklendi.');
    await loadAll();
  };
  reader.readAsText(file);
}
function flashSaved(){
  const el = document.querySelector('.save-indicator');
  if(!el) return;
  const prev = el.textContent;
  el.textContent = 'Kaydedildi ✓';
  setTimeout(()=>{ if(el.isConnected) el.textContent = prev; }, 1600);
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(persistQuote, 700); }
function nextQuoteNo(){
  const year = new Date().getFullYear();
  const count = quotesIndex.filter(q=>q.quoteNo && q.quoteNo.includes(String(year))).length + 1;
  return `GODO-${year}-${String(count).padStart(3,'0')}`;
}

/* ---------------- CALC ---------------- */
function lineUnitPrice(item){
  if(item.useCalc){
    const lp = parseFloat(item.listPrice)||0;
    const disc = parseFloat(item.discount)||0;
    return lp * (1 - disc/100);
  }
  return parseFloat(item.unitPrice)||0;
}
function lineBuyPrice(item){
  if(item.useCalc && item.listPrice && item.buyDiscount!==''){
    const lp = parseFloat(item.listPrice)||0;
    const bd = parseFloat(item.buyDiscount)||0;
    return lp * (1 - bd/100);
  }
  return null;
}
function lineMarginPct(item){
  const sell = lineUnitPrice(item);
  const buy = lineBuyPrice(item);
  if(buy===null || !sell) return null;
  return ((sell-buy)/sell)*100;
}
function lineProfit(item){
  const buy = lineBuyPrice(item);
  if(buy===null) return null;
  return (lineUnitPrice(item)-buy) * (parseFloat(item.qty)||0);
}
function lineTotal(item){ return lineUnitPrice(item) * (parseFloat(item.qty)||0); }
function computeTotals(q){
  const sub = q.items.reduce((s,it)=>s+lineTotal(it),0);
  const vat = q.vatEnabled ? sub * (parseFloat(q.vatRate)||0)/100 : 0;
  const profit = q.items.reduce((s,it)=>{ const p=lineProfit(it); return s+(p===null?0:p); },0);
  return { sub, vat, grand: sub+vat, profit };
}
function fmt(n){ return (n||0).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function parseTRNumber(str){
  // Excel'den yapıştırılan "1.234,56" (TR) ya da "1234.56" (US) biçimlerini güvenle sayıya çevirir.
  if(!str) return '';
  let s = String(str).trim();
  if(!s) return '';
  if(s.includes(',') && s.includes('.')){
    // Hangisi son geliyorsa ondalık ayraç odur
    if(s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(s.includes(',')){
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? '' : String(n);
}

function validateQuoteForSend(){
  const issues = [];
  if(!quote.quoteNo || !quote.quoteNo.trim()) issues.push('Teklif numarası boş.');
  if(!quote.customer.name || !quote.customer.name.trim()) issues.push('Müşteri adı boş.');
  const validItems = quote.items.filter(it=>it.code||it.desc);
  if(!validItems.length) issues.push('Hiç ürün kalemi eklenmemiş.');
  const emptyPriceItems = validItems.filter(it=>!lineUnitPrice(it));
  if(emptyPriceItems.length) issues.push(`${emptyPriceItems.length} kalemde birim fiyat 0 veya boş.`);
  const t = computeTotals(quote);
  if(t.grand<=0) issues.push('Genel toplam 0 veya negatif.');
  return issues;
}

const MONTH_NAMES = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function monthLabel(ym){ const [y,m]=ym.split('-'); return MONTH_NAMES[parseInt(m,10)-1]+" '"+y.slice(2); }

async function ensureReportsData(){
  const monthly = {};
  const monthlyProfit = {};
  quotesIndex.forEach(q=>{
    if(q.status==='Siparişe Dönüştü'){
      const ym=(q.date||'').slice(0,7);
      if(ym) monthly[ym]=(monthly[ym]||0)+(q.total||0);
    }
  });
  const productAgg = {};
  const customerAgg = {};
  let totalProfitAll = 0;
  for(const qEntry of quotesIndex){
    const r = await stGet('godo:quote:'+qEntry.id);
    if(!r || !r.value) continue;
    let full; try{ full = JSON.parse(r.value); }catch(e){ continue; }
    const isOrder = full.status==='Siparişe Dönüştü';
    const ym = (full.date||'').slice(0,7);
    let quoteRevenue = 0, quoteProfit = 0, quoteHasCost = false;
    (full.items||[]).forEach(it=>{
      if(!it.code && !it.desc) return;
      const key = (it.code||'')+'|'+(it.desc||'');
      if(!productAgg[key]) productAgg[key] = { code:it.code, desc:it.desc, qty:0, revenue:0, cost:0, hasCost:false, discSum:0, discCount:0 };
      const p = productAgg[key];
      p.qty += parseFloat(it.qty)||0;
      p.revenue += lineTotal(it);
      if(it.useCalc){ p.discSum += parseFloat(it.discount)||0; p.discCount++; }
      const buy = lineBuyPrice(it);
      if(buy!==null){ p.cost += buy*(parseFloat(it.qty)||0); p.hasCost = true; }
      if(isOrder){
        quoteRevenue += lineTotal(it);
        if(buy!==null){
          const profit = (lineUnitPrice(it)-buy)*(parseFloat(it.qty)||0);
          quoteProfit += profit; quoteHasCost = true;
          totalProfitAll += profit;
          if(ym) monthlyProfit[ym] = (monthlyProfit[ym]||0) + profit;
        }
      }
    });
    if(isOrder){
      const custKey = full.customer.name || 'İsimsiz Müşteri';
      if(!customerAgg[custKey]) customerAgg[custKey] = { name:custKey, revenue:0, cost:0, profit:0, hasCost:false, orders:0 };
      const c = customerAgg[custKey];
      c.revenue += quoteRevenue;
      c.profit += quoteProfit;
      c.cost += (quoteRevenue - quoteProfit);
      if(quoteHasCost) c.hasCost = true;
      c.orders++;
    }
  }
  const monthlyArr = Object.entries(monthly).sort((a,b)=> a[0]<b[0]?-1:1).slice(-12);
  const productArr = Object.values(productAgg).sort((a,b)=>b.revenue-a.revenue);
  const customerArr = Object.values(customerAgg).sort((a,b)=>b.profit-a.profit);

  const funnelCounts = {};
  STATUS_OPTIONS.forEach(s=>funnelCounts[s]=0);
  quotesIndex.forEach(q=>{ funnelCounts[q.status] = (funnelCounts[q.status]||0)+1; });

  return { monthlyArr, productArr, customerArr, totalProfitAll, monthlyProfit, funnelCounts, totalQuoteCount: quotesIndex.length };
}

function buildBarChartSVG(monthlyArr, curr){
  if(!monthlyArr.length) return '<p class="hint">Henüz "Siparişe Dönüştü" durumunda teklif yok — grafik bu duruma göre hesaplanıyor.</p>';
  const w=680, h=200, padB=26, padT=10, gap=14;
  const barW = (w - gap*(monthlyArr.length+1)) / monthlyArr.length;
  const maxVal = Math.max(1, ...monthlyArr.map(m=>m[1]));
  const bars = monthlyArr.map(([ym,val],i)=>{
    const bh = (val/maxVal) * (h-padB-padT);
    const x = gap + i*(barW+gap);
    const y = h - padB - bh;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${bh}" fill="#0E0E0E" rx="2"></rect>
      <text x="${x+barW/2}" y="${h-8}" font-size="9.5" font-family="Inter, sans-serif" fill="#77766F" text-anchor="middle">${monthLabel(ym)}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:680px;height:auto;">${bars}</svg>`;
}

            <td class="num mono">${p.discCount ? '%'+(p.discSum/p.discCount).toFixed(1) : '—'}</td>
          </tr>`).join('')}

    <div class="section-div"></div>
    <div class="subhead">Cari Bazında Kârlılık</div>
    ${data.customerArr.length ? `
    <table class="items-table">
      <thead><tr><th>Müşteri</th><th class="num">Sipariş</th><th class="num">Ciro</th><th class="num">Kâr</th><th class="num">Marj %</th></tr></thead>
      <tbody>
        ${data.customerArr.map(c=>`
          <tr>
            <td>${escapeHtml(c.name)}</td>
            <td class="num">${c.orders}</td>
            <td class="num mono">${curr} ${fmt(c.revenue)}</td>
            <td class="num mono">${c.hasCost ? curr+' '+fmt(c.profit) : '—'}</td>
            <td class="num mono">${c.hasCost && c.revenue ? '%'+((c.profit/c.revenue)*100).toFixed(1) : '—'}</td>
          </tr>`).join('')}
      </tbody>
    </table>` : '<p class="hint">Henüz "Siparişe Dönüştü" durumunda teklif yok.</p>'}

    <div class="section-div"></div>
    <div class="subhead">Dönüşüm Hunisi</div>
    <p class="hint">Tekliflerin şu anki duruma göre dağılımı (geçmiş durum değişiklikleri değil, mevcut anlık durum baz alınır).</p>
    ${buildFunnelHTML(data.funnelCounts, data.totalQuoteCount)}
  `;
}
function buildFunnelHTML(counts, total){
  if(!total) return '<p class="hint">Henüz teklif yok.</p>';
  const stages = ['Taslak','Gönderildi','Onaylandı','Siparişe Dönüştü'];
  const maxCount = Math.max(1, ...stages.map(s=>counts[s]||0));
  const rows = stages.map(s=>{
    const c = counts[s]||0;
    const pct = total ? (c/total*100) : 0;
    return `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        <span style="width:120px;font-size:11.5px;color:var(--gray-500);flex:none;">${s}</span>
        <div style="flex:1;background:var(--paper-2);border-radius:4px;height:22px;overflow:hidden;">
          <div style="width:${(c/maxCount*100)||0}%;background:var(--ink);height:100%;"></div>
        </div>
        <span style="width:110px;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--gray-500);flex:none;">${c} · %${pct.toFixed(0)}</span>
      </div>`;
  }).join('');
  const rejected = counts['Reddedildi']||0;
  return rows + (rejected ? `<p class="hint" style="margin-top:6px;">Ayrıca ${rejected} teklif "Reddedildi" durumunda (%${(rejected/total*100).toFixed(0)}).</p>` : '');
}

function openItemBulkImportModal(){
  const old = document.getElementById('modalOverlay'); if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  overlay.innerHTML = `<div class="modal-box" style="width:640px;max-width:94vw;">
    <h2>Excel'den / Yapıştır ile Kalem Ekle</h2>
    <p class="hint">Excel'de <b>Ürün Kodu</b> ve <b>Adet</b> sütunlarını sırayla seç, kopyala, aşağıya yapıştır. Kod, kayıtlı ürünlerle eşleşirse açıklama/fiyat/iskonto otomatik gelir — sonrasında dilediğin gibi düzenleyebilirsin.</p>
    <textarea id="ibi-paste" rows="8" class="code-editor" style="width:100%;" placeholder="6ES7214-1AG40-0XB0	3"></textarea>
    <div class="subhead" style="margin-top:16px;">Önizleme</div>
    <div id="ibi-preview" style="max-height:220px;overflow-y:auto;font-size:12px;"><p class="hint">Yapıştırdığında burada önizleme görünecek.</p></div>
    <div class="actions-row" style="margin-top:14px;">
      <button class="btn btn-primary" id="ibi-import">Kalemleri Ekle</button>
      <button class="btn btn-ghost" id="ibi-cancel">Vazgeç</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });

  const ta = overlay.querySelector('#ibi-paste');
  const previewEl = overlay.querySelector('#ibi-preview');
  function getRows(){
    return ta.value.split(/\r?\n/).filter(l=>l.trim().length).map(l=> l.split('\t').length>1 ? l.split('\t') : l.split(','));
  }
  function updatePreview(){
    const rows = getRows();
    if(!rows.length){ previewEl.innerHTML = '<p class="hint">Yapıştırdığında burada önizleme görünecek.</p>'; return; }
    previewEl.innerHTML = `<table class="items-table"><thead><tr><th>Kod</th><th class="num">Adet</th><th>Eşleşme</th></tr></thead><tbody>${
      rows.map(r=>{
        const code = (r[0]||'').trim();
        const match = products.find(p=>(p.code||'').trim().toLowerCase()===code.toLowerCase());
        return `<tr><td class="mono">${escapeHtml(code)}</td><td class="num">${escapeHtml((r[1]||'1').trim())}</td><td style="color:${match?'var(--ink)':'var(--danger)'};">${match?escapeHtml(match.desc||'Eşleşti'):'Bulunamadı — manuel doldurulacak'}</td></tr>`;
      }).join('')
    }</tbody></table><p class="hint" style="margin-top:6px;">${rows.length} satır bulundu.</p>`;
  }
  ta.oninput = updatePreview;
  overlay.querySelector('#ibi-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#ibi-import').onclick = ()=>{
    const rows = getRows();
    if(!rows.length){ alert('İçe aktarılacak veri yok.'); return; }
    let matched=0, unmatched=0;
    const newItems = rows.map(r=>{
      const code = (r[0]||'').trim();
      const qty = (r[1]||'1').trim();
      const p = products.find(pr=>(pr.code||'').trim().toLowerCase()===code.toLowerCase());
      if(p){
        matched++;
        return { id:crypto.randomUUID(), productId:p.id, code:p.code, desc:p.desc, delivery:p.delivery, qty,
                  listPrice:p.listPrice, buyDiscount:p.buyDiscount||'', discount:p.discount, unitPrice:'', useCalc:!!p.listPrice };
      }
      unmatched++;
      return { id:crypto.randomUUID(), productId:null, code, desc:'', delivery:'', qty, listPrice:'', buyDiscount:'', discount:'', unitPrice:'', useCalc:false };
    });
    // İlk satır tamamen boşsa onun yerine geçsin
    if(quote.items.length===1 && !quote.items[0].code && !quote.items[0].desc) quote.items = newItems;
    else quote.items = quote.items.concat(newItems);
    scheduleSave();
    overlay.remove();
    alert(`${matched} kalem kayıtlı üründen dolduruldu, ${unmatched} kalem eşleşmedi (manuel doldurman gerekecek).`);
    render();
  };
}

function getDocSlotDefaultCSS(slot){
  const base = `/* "${slot==='classic'?'Klasik':slot==='dark'?'Koyu Başlık':slot==='minimal'?'Minimal':'Özel'}" şablonunun görünüm kuralları. Buradan başlayıp dilediğin gibi değiştirebilirsin. */\n` + getDocBaseCSS();
  if(slot==='dark'){
    return base + `

/* Koyu başlık varyasyonu */
.doc-head{ background:var(--ink); margin:-46px -46px 0; padding:34px 46px 24px; }
.doc-word, .doc-sub, .doc-tagline, .doc-meta, .doc-meta .qn{ color:#fff; }
.doc-rule{ background:#fff; }
.doc-title{ margin-top:30px; }`;
  }
  if(slot==='minimal'){
    return base + `

/* Minimal varyasyon */
.doc-rule{ display:none; }
.doc-title{ border-bottom:1px solid var(--hairline); font-weight:500; letter-spacing:.1em; }
table.doc-items thead th{ border-bottom:1px solid var(--hairline); font-weight:500; }
.doc-totals .r.grand{ border-top:1px solid var(--hairline); font-weight:500; }
.doc-terms .blk .h{ color:var(--gray-500); }`;
  }
  return base;
}

function applyTemplate(str, tokens){
  return str.replace(/\{\{(\w+)\}\}/g, (m,k)=> tokens[k]!==undefined ? tokens[k] : '');
}

function buildDocTokens(){
  const t = computeTotals(quote);
  const validUntil = addBusinessDays(quote.date, quote.validityDays);
  const filteredItems = quote.items.filter(it=>it.code||it.desc);
  const itemsRows = filteredItems.map((it,idx)=>`
    <tr>
      <td class="num pos">${idx+1}</td>
      <td>
        <div class="item-code">${escapeHtml(it.code)}</div>
        ${it.desc ? `<div class="item-desc">${escapeHtml(it.desc)}</div>` : ''}
      </td>
      <td class="center">${it.qty} AD</td>
      <td>${escapeHtml(it.delivery)}</td>
      <td class="num">${quote.currency} ${fmt(lineUnitPrice(it))}</td>
      <td class="num">${quote.currency} ${fmt(lineTotal(it))}</td>
    </tr>
  `).join('') || '<tr><td colspan="6" style="color:var(--gray-300);text-align:center;padding:20px 0;">Henüz ürün kalemi eklenmedi</td></tr>';

  const custContact = quote.customer.contactName ? escapeHtml(quote.customer.contactName)+(quote.customer.contactPhone?' · '+escapeHtml(quote.customer.contactPhone):'') : (quote.customer.contactPhone?escapeHtml(quote.customer.contactPhone):'—');
  const custTaxLine = (quote.customer.taxOffice||quote.customer.taxNo) ? escapeHtml((quote.customer.taxOffice||'—')+' · '+(quote.customer.taxNo?'VN '+quote.customer.taxNo:'')) : '—';
  const addressBlock = quote.customer.address ? `<div class="dc-address">${escapeHtml(quote.customer.address)}</div>` : '';
  const taglineBlock = company.tagline ? `<div class="doc-tagline">${escapeHtml(company.tagline)}</div>` : '';

  return {
    DOC_TITLE: 'Fiyat Teklifi',
    COMPANY_NAME: escapeHtml(company.name || 'GODO'),
    COMPANY_NAME_UPPER: escapeHtml((company.name||'GODO').toUpperCase()),
    COMPANY_TAGLINE_BLOCK: taglineBlock,
    COMPANY_TAGLINE: escapeHtml(company.tagline||''),
    COMPANY_WEBSITE: escapeHtml(company.website||'godo.tr'),
    QUOTE_NO: escapeHtml(quote.quoteNo),
    DATE: formatDate(quote.date),
    VALID_UNTIL: formatDate(validUntil),
    CUSTOMER_NAME: escapeHtml(quote.customer.name||'—'),
    CUSTOMER_TAX: custTaxLine,
    CUSTOMER_CONTACT: custContact,
    CUSTOMER_ADDRESS_BLOCK: addressBlock,
    ITEMS_ROWS: itemsRows,
    SUBTOTAL: `${quote.currency} ${fmt(t.sub)}`,
    VAT_LABEL: quote.vatEnabled ? `KDV (%${quote.vatRate})` : 'KDV',
    VAT_VALUE: quote.vatEnabled ? `${quote.currency} ${fmt(t.vat)}` : 'Hariçtir',
    GRAND_TOTAL: `${quote.currency} ${fmt(t.grand)}`,
    PAYMENT_TERMS: escapeHtml(quote.terms.payment),
    DELIVERY_TERMS: escapeHtml(quote.terms.delivery),
    SHIPPING_BLOCK: quote.terms.shipping ? `<div class="blk"><div class="h">Kargo Koşulları</div><div class="t">${escapeHtml(quote.terms.shipping)}</div></div>` : '',
    LEGAL_TERMS: escapeHtml(quote.terms.legal),
    CURRENCY: quote.currency
  };
}

/* ---------------- HELPERS ---------------- */
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function addBusinessDays(dateStr, days){
  let d = new Date(dateStr);
  let added = 0;
  const total = parseInt(days)||0;
  while(added < total){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day!==0 && day!==6) added++;
  }
  return d.toISOString().slice(0,10);
}
function formatDate(dateStr){
  if(!dateStr) return '—';
  const [y,m,d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}
function buildMailtoLink(to){
  const validUntil = addBusinessDays(quote.date, quote.validityDays);
  const subject = `${company.name||'Godo'} Teklifi — ${quote.quoteNo}`;
  const body = [
    `Merhaba ${quote.customer.contactName||''}`.trim()+ ',',
    '',
    `${quote.quoteNo} numaralı teklifimizi ilişikte bulabilirsiniz.`,
    `Teklif geçerlilik tarihi: ${formatDate(validUntil)}`,
    '',
    'Sorularınız için her zaman ulaşabilirsiniz.',
    '',
    'İyi çalışmalar,',
    company.name || 'Godo'
  ].join('\n');
  return `mailto:${to||''}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

    document.getElementById('lf-to').onchange = e=>{ listFilters.to=e.target.value; render(); };
    document.querySelectorAll('.view-toggle-btn').forEach(btn=>{
      btn.onclick = ()=>{ quotesViewMode = btn.dataset.view; render(); };
    });
    document.querySelectorAll('.dash-quote-row').forEach(row=>{ row.onclick = async ()=>{ await openQuote(row.dataset.id); activeTab='info'; render(); }; });

    if(quotesViewMode==='kanban'){
      let draggedId = null;
      let justDragged = false;
      document.querySelectorAll('.kanban-card').forEach(card=>{
        card.addEventListener('dragstart', ()=>{ draggedId = card.dataset.id; card.classList.add('dragging'); });
        card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); justDragged = true; setTimeout(()=>{ justDragged=false; }, 150); });
        card.onclick = async ()=>{ if(justDragged) return; await openQuote(card.dataset.id); activeTab='info'; render(); };
      });
      document.querySelectorAll('.kanban-col-body').forEach(col=>{
        col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', ()=>col.classList.remove('drag-over'));
        col.addEventListener('drop', async e=>{
          e.preventDefault();
          col.classList.remove('drag-over');
          if(!draggedId) return;
          const newStatus = col.dataset.status;
          const r = await stGet('godo:quote:'+draggedId);
          if(r && r.value){
            const full = JSON.parse(r.value);
            full.status = newStatus;
            await stSet('godo:quote:'+draggedId, JSON.stringify(full));
            const idx = quotesIndex.findIndex(q=>q.id===draggedId);
            if(idx>=0) quotesIndex[idx].status = newStatus;
            await saveIndex();
            if(quote.id===draggedId) quote.status = newStatus;
          }
          draggedId = null;
          render();
        });
      });
    }
  }

  if(activeTab==='proposalsList'){
    document.getElementById('btnNewProposal').onclick = ()=>{ proposal = emptyProposal(); proposal.proposalNo = nextProposalNo(); activeTab='pInfo'; render(); };

          const p = products.find(pr=>(pr.code||'').trim().toLowerCase()===codeInp.value.trim().toLowerCase());

          } else {
            it.code = codeInp.value; it.productId = null; scheduleSave();

      }
      const map = {'.it-desc':'desc','.it-delivery':'delivery','.it-qty':'qty','.it-list':'listPrice','.it-buydisc':'buyDiscount','.it-disc':'discount','.it-unit':'unitPrice'};

        if(!proceed) return;
      }
      persistQuote(); window.print();
    };
    document.getElementById('btnMailDraft').onclick = ()=>{
      const to = quote.customer.contactEmail || (quote.customer.contactPhone && quote.customer.contactPhone.includes('@') ? quote.customer.contactPhone : '');

function refreshTotalsOnly(){
  const rows = document.querySelectorAll('#itemsBody tr[data-idx]');
  rows.forEach((tr,idx)=>{
    const it = quote.items[idx];
    if(!it) return;
    const totalCell = tr.querySelector('.col-total');
    if(totalCell) totalCell.textContent = fmt(lineTotal(it));
    const marginCell = tr.querySelector('.col-margin');
    if(marginCell){ const m=lineMarginPct(it); marginCell.textContent = m===null?'—':(m>=0?'+':'')+m.toFixed(1)+'%'; }
  });
  const t = computeTotals(quote);
  const box = document.querySelector('.totals-box');
  if(box){
    const rowsT = box.querySelectorAll('.totals-row');
    if(rowsT[0]) rowsT[0].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.sub)}`;
    if(rowsT[1]) rowsT[1].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.vat)}`;
    if(rowsT[2]) rowsT[2].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.grand)}`;
    if(rowsT[3]) rowsT[3].querySelector('span:last-child').textContent = `${quote.currency} ${fmt(t.profit)}`;
  }
}
function renderProposalTotalsOnly(){
  const rows = document.querySelectorAll('#pItemsBody tr[data-idx]');
  rows.forEach((tr,idx)=>{
    const it = proposal.items[idx];
    if(!it) return;
    const cells = tr.querySelectorAll('td');
    const totalCell = cells[3];
    if(totalCell) totalCell.textContent = fmt((parseFloat(it.unitPrice)||0)*(parseFloat(it.qty)||0));
  });
  const t = computeProposalTotals(proposal);
  const box = document.querySelector('.totals-box');
  if(box){
    const rowsT = box.querySelectorAll('.totals-row');
    if(rowsT[0]) rowsT[0].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.sub)}`;
    if(rowsT[1]) rowsT[1].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.vat)}`;
    if(rowsT[2]) rowsT[2].querySelector('span:last-child').textContent = `${proposal.currency} ${fmt(t.grand)}`;
  }
}

function bind(id, key){ const el = document.getElementById(id); el.oninput = ()=>{ quote[key] = el.value; scheduleSave(); }; }
function bindNested(id, parentKey, childKey){ const el = document.getElementById(id); if(!el) return; el.oninput = ()=>{ quote[parentKey][childKey] = el.value; scheduleSave(); }; }

function openProductBulkImportModal(){
  const old = document.getElementById('modalOverlay'); if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id='modalOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(14,14,14,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  overlay.innerHTML = `<div class="modal-box" style="width:740px;max-width:94vw;">
    <h2>Excel'den / Yapıştır ile Ürün Yükle</h2>
    <p class="hint">Excel'de <b>Ürün Kodu, Açıklama, Liste Fiyatı, Alış İskonto %, Satış İskonto %, Ürün Grubu</b> sütunlarını sırayla seç, kopyala (Ctrl+C), aşağıya yapıştır (Ctrl+V). Kod zaten kayıtlıysa güncellenir, yoksa yeni eklenir.</p>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray-500);margin-bottom:8px;"><input type="checkbox" id="bi-header" checked> İlk satır başlık (atlanacak)</label>
    <textarea id="bi-paste" rows="8" class="code-editor" style="width:100%;" placeholder="6ES7214-1AG40-0XB0	CPU 1214C compact	478.00	43	42	PLC"></textarea>
    <div class="subhead" style="margin-top:16px;">Önizleme</div>
    <div id="bi-preview" style="max-height:220px;overflow-y:auto;font-size:12px;"><p class="hint">Yapıştırdığında burada önizleme görünecek.</p></div>
    <div class="actions-row" style="margin-top:14px;">
      <button class="btn btn-primary" id="bi-import">İçe Aktar</button>
      <button class="btn btn-ghost" id="bi-cancel">Vazgeç</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });

  const ta = overlay.querySelector('#bi-paste');
  const headerChk = overlay.querySelector('#bi-header');
  const previewEl = overlay.querySelector('#bi-preview');
  function getRows(){
    let lines = ta.value.split(/\r?\n/).filter(l=>l.trim().length);
    if(headerChk.checked && lines.length) lines = lines.slice(1);
    return lines.map(l=> l.split('\t').length>1 ? l.split('\t') : l.split(','));
  }
  function updatePreview(){
    const rows = getRows();
    if(!rows.length){ previewEl.innerHTML = '<p class="hint">Yapıştırdığında burada önizleme görünecek.</p>'; return; }
    previewEl.innerHTML = `<table class="items-table"><thead><tr><th>Kod</th><th>Açıklama</th><th class="num">Liste</th><th class="num">Alış %</th><th class="num">Satış %</th><th>Grup</th></tr></thead><tbody>${
      rows.map(r=>`<tr><td class="mono">${escapeHtml((r[0]||'').trim())}</td><td>${escapeHtml((r[1]||'').trim())}</td><td class="num mono">${escapeHtml((r[2]||'').trim())}</td><td class="num mono">${escapeHtml((r[3]||'').trim())}</td><td class="num mono">${escapeHtml((r[4]||'').trim())}</td><td>${escapeHtml((r[5]||'').trim())}</td></tr>`).join('')
    }</tbody></table><p class="hint" style="margin-top:6px;">${rows.length} satır bulundu.</p>`;
  }
  ta.oninput = updatePreview;
  headerChk.onchange = updatePreview;
  overlay.querySelector('#bi-cancel').onclick = ()=>overlay.remove();
  overlay.querySelector('#bi-import').onclick = ()=>{
    const rows = getRows();
    if(!rows.length){ alert('İçe aktarılacak veri yok.'); return; }
    let created=0, updated=0;
    rows.forEach(r=>{
      const code = (r[0]||'').trim();
      const desc = (r[1]||'').trim();
      const listPrice = parseTRNumber((r[2]||'').trim());
      const buyDiscount = parseTRNumber((r[3]||'').trim());
      const sellDiscount = parseTRNumber((r[4]||'').trim());
      const category = (r[5]||'').trim();
      if(!code && !desc) return;
      let existing = code ? products.find(p=>(p.code||'').trim().toLowerCase()===code.toLowerCase()) : null;
      if(existing){
        existing.desc = desc || existing.desc;
        if(listPrice) existing.listPrice = listPrice;
        if(buyDiscount) existing.buyDiscount = buyDiscount;
        if(sellDiscount) existing.discount = sellDiscount;
        if(category) existing.category = category;
        updated++;
      } else {
        products.push({ id:crypto.randomUUID(), code, desc, delivery:'', listPrice, buyDiscount, discount:sellDiscount, category });
        created++;
      }
    });
    saveProducts();
    overlay.remove();
    alert(`${created} yeni ürün eklendi, ${updated} ürün güncellendi.`);
    render();
  };
}
